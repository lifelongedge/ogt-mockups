<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OGT Mockups — Review Index</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: #0d1117;
  color: #e6edf3;
  line-height: 1.6;
  padding: 40px 24px;
}
.page { max-width: 700px; margin: 0 auto; }
h1 { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
.subtitle { font-size: 15px; color: #8b949e; margin-bottom: 24px; }
.notice {
  background: #161b22;
  border: 1px solid #21262d;
  border-left: 3px solid #d4940a;
  border-radius: 6px;
  padding: 14px 16px;
  margin-bottom: 32px;
  font-size: 13px;
  color: #c9d1d9;
}
.notice a { color: #58a6ff; text-decoration: none; }
.notice a:hover { text-decoration: underline; }
h2 {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: #d4940a;
  margin: 32px 0 12px;
}
.card {
  display: block;
  background: #161b22;
  border: 1px solid #21262d;
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 10px;
  text-decoration: none;
  transition: all 0.15s;
}
.card:hover {
  background: #1c2128;
  border-color: #8b949e;
  transform: translateY(-1px);
}
.card .title {
  font-size: 16px;
  font-weight: 700;
  color: #e6edf3;
  margin-bottom: 4px;
}
.card .desc {
  font-size: 13px;
  color: #8b949e;
  line-height: 1.5;
}
.card .badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  margin-right: 6px;
  background: rgba(88,166,255,0.12);
  color: #58a6ff;
}
.card .badge.new { background: rgba(63,185,80,0.12); color: #3fb950; }
.footer {
  margin-top: 48px;
  padding-top: 20px;
  border-top: 1px solid #21262d;
  font-size: 12px;
  color: #6e7681;
  text-align: center;
}
</style>
</head>
<body>
<div class="page">

<h1>OGT Mockups</h1>
<p class="subtitle">Review assets for Owl Group Trading growth strategy. Internal use only.</p>

<div class="notice">
  Nothing is listed here. Review pages are shared with reviewers by direct link. The shipped product lives at
  <a href="https://owlgrouptrading.com" target="_blank" rel="noopener">owlgrouptrading.com</a>.
</div>

<div class="footer">
  OGT Growth Engineering &middot; Delisted 2026-11-21 &middot; Internal review only
</div>

</div>
</body>
</html>
