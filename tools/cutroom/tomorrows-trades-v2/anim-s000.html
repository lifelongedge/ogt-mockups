const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,u)=>a+(b-a)*u, ease=u=>{u=clamp(u,0,1);return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;};
const op=(t,t0,d)=>clamp((t-t0)/(d||0.5),0,1), pr=(t,t0,d)=>ease((t-t0)/(d||0.6));
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function furniture(t){
  let s='';
  const a=op(t,1.2,.7), y=lerp(640,610,pr(t,1.2,.9));
  const w = Math.max(420, TITLE.length*26+80);
  s += `<g opacity="${a}"><rect x="${640-w/2}" y="${y-44}" width="${w}" height="88" rx="18" fill="rgba(255,255,255,.78)" stroke="rgba(255,255,255,.95)" stroke-width="2"/>
        <text x="640" y="${y+13}" text-anchor="middle" class="ttl" font-size="40" fill="#1b1f26">${esc(TITLE)}</text></g>`;
  const b=op(t,2.0,.6);
  s += `<g opacity="${b}"><text x="640" y="${y+70}" text-anchor="middle" class="wm" font-size="17" letter-spacing="3" fill="#f3ead6" opacity=".9">${esc(KICKER)}</text></g>`;
  return s;
}
function ridge(y, amp, seed, col, t, drift){
  let d=`M0 720 L0 ${y}`;
  for(let x=0;x<=1280;x+=40){ const n=Math.sin(x/190+seed)*amp+Math.sin(x/61+seed*2)*amp*0.35+Math.sin(x/23)*amp*0.1; d+=` L${x} ${y+n+Math.sin(t*0.6+x/300)*(drift||0)}`; }
  return `<path d="${d} L1280 720 Z" fill="${col}"/>`;
}
function owlPhoto(x,y,size,t,o){
  const z=1+0.035*clamp(t/ANIM_DURATION,0,1), sz=size*z, dx=x-(sz-size)/2, dy=y-(sz-size)/2;
  return `<defs><radialGradient id="gm" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="mk"><rect x="${dx}" y="${dy}" width="${sz}" height="${sz}" fill="url(#gm)"/></mask></defs>
    <image href="${OWL}" x="${dx}" y="${dy}" width="${sz}" height="${sz}" mask="url(#mk)" opacity="${o.op==null?1:o.op}" preserveAspectRatio="xMidYMid slice"/>`;
}
function draw(t){
  let s=`<defs><linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03060f"/><stop offset=".55" stop-color="#0f2548"/><stop offset="1" stop-color="#2d5578"/></linearGradient>
    <linearGradient id="seaB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b3a5c"/><stop offset="1" stop-color="#0a1a2c"/></linearGradient>
    <radialGradient id="nightB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#02040a"/><stop offset=".7" stop-color="#02040a" stop-opacity=".9"/><stop offset="1" stop-color="#02040a" stop-opacity="0"/></radialGradient></defs>`;
  s += `<rect width="1280" height="720" fill="url(#skyB)"/>`;
  const r=rng(11); for(let i=0;i<90;i++){ const x=r()*1280, y=r()*380, k=r(); s += `<circle cx="${x}" cy="${y}" r="${0.8+k*1.4}" fill="#fff" opacity="${0.35+0.6*Math.abs(Math.sin(t*1.5+i))}"/>`; }
  s += `<circle cx="760" cy="110" r="30" fill="#f3ead6" opacity=".9"/><circle cx="749" cy="103" r="26" fill="#0b1a33"/>`;
  s += ridge(392,18,7,'#0d2238',t,0);
  const ang = -60 + 50*Math.sin(t*0.7); const rad=ang*Math.PI/180;
  s += `<polygon points="${210+Math.cos(rad-0.07)*1500},${270+Math.sin(rad-0.07)*1500} 210,270 ${210+Math.cos(rad+0.07)*1500},${270+Math.sin(rad+0.07)*1500}" fill="rgba(255,236,170,.2)"/>`;
  s += `<path d="M0 720 L0 400 C80 395 160 390 260 392 L300 720 Z" fill="#091a2c"/>`;
  s += `<path d="M190 400 L186 300 L234 300 L230 400 Z" fill="#dfe6ee"/><rect x="182" y="286" width="56" height="16" fill="#1f2a36"/><rect x="190" y="256" width="40" height="30" fill="#ffe8a6" opacity="${0.8+0.2*Math.sin(t*6)}"/><path d="M186 256 L210 236 L234 256 Z" fill="#1f2a36"/>`;
  for(let i=0;i<3;i++) s += `<rect x="196" y="${320+i*26}" width="28" height="4" fill="#c0392b"/>`;
  s += `<rect x="0" y="420" width="1280" height="300" fill="url(#seaB)"/>`;
  for(let i=0;i<40;i++){ const y=430+i*7+(i*i)%5, w=40+((i*37)%180), x=((i*131)+t*(20+i))%1400-60; s += `<rect x="${x}" y="${y}" width="${w}" height="1.5" fill="#cfe3ff" opacity="${0.08+0.1*Math.abs(Math.sin(t+i))}"/>`; }
  const lit = clamp(1-Math.abs(ang+22)/30,0,1);
  s += `<ellipse cx="1000" cy="380" rx="520" ry="440" fill="url(#nightB)"/>`;
  s += owlPhoto(690,40,700,t,{op:0.55+0.45*lit});
  return s + furniture(t);
}

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  document.getElementById('svg').innerHTML = draw(t);
  const f = document.getElementById('fade');
  f.style.opacity = t < 0.6 ? 1 - t / 0.6 : (ANIM_DURATION - t < 0.6 ? 1 - (ANIM_DURATION - t) / 0.6 : 0);
};
renderFrame(0);
</script>
