  if (t>=148.8){ ['control','carry','cross','crush'].forEach((w,i)=> s += pill(835+(i%2)*160,310+Math.floor(i/2)*50,w,{sz:20,c:KEY,s:KEY,o:op(t,148.8+i*1.5,.4),w:130})); }
  if (t>=157.6) s += defn(t,157.6,780,392,340,'the rules',['protect the goal · get the ball','go to the goal · shoot · score'],{lsz:18,lh:26,pad:14,sz:22});
  if (t>=166.1) s += aside(t,166.1,785,527,'always phrased as a question',{sz:22,c:RULE,rot:-1});
  s += focus(t,[[0.8,282,gy-95],[15.2,200,150],[22.4,565,139],[41.8,282,gy-90],[58.4,250,435],[86.0,700,440],[94.4,950,150],[148.8,915,335],[157.6,950,460]]);
  return s;
}

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  let cap = '', sub = '';
  for (const b of BEATS) if (t >= b[0]) { cap = b[1]; sub = b[2] || ''; }
  $('cap').innerHTML = cap; $('sub').textContent = sub;
  $('svg').innerHTML = WRAP[0] + draw(t) + WRAP[1];
  const f = $('fade');
  f.style.opacity = t < 0.5 ? 1 - t / 0.5 : (ANIM_DURATION - t < 0.6 ? 1 - (ANIM_DURATION - t) / 0.6 : 0);
};
renderFrame(0);
