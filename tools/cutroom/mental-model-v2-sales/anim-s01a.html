<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>s01a · the coaching eye</title>
<style>
  :root { --bg:#030507; --fg:#E1EEF5; --muted:#8fa3ad; --border:rgba(56,225,255,0.14); --accent:#F2D06B;
          --ok:#4ade80; --dn:#f87171; --card:#0a1016; --blue:#7baad4; }
  html, body { margin:0; background:var(--bg); overflow:hidden; }
  #stage { position:relative; width:1280px; height:720px; background:var(--bg); color:var(--fg);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #cap { position:absolute; left:60px; right:60px; top:30px; font-size:32px; font-weight:600; letter-spacing:-.01em; line-height:1.15; }
  #cap em { font-style:normal; color:var(--accent); }
  #sub { position:absolute; left:60px; width:1160px; top:648px; font-size:20px; color:var(--muted); line-height:1.4; }
  #scene { position:absolute; left:60px; top:112px; width:1160px; height:518px; border:1px solid var(--border);
           border-radius:10px; background:var(--card); overflow:hidden; }
  #svg { position:absolute; inset:0; }
  #fade { position:absolute; inset:0; background:var(--bg); pointer-events:none; opacity:0; }
  /* the picture-in-picture corner: build_v2 composites Ken's camera tile here (PIP_W/X/Y); the cutroom shows this placeholder */
  #pip { position:absolute; left:950px; top:22px; width:300px; height:169px; border:1px dashed rgba(56,225,255,0.35); border-radius:4px;
         display:none; color:var(--muted); font-size:13px; text-align:center; line-height:169px; }
  .pip #pip { display:block; } .pip #cap { right:360px; font-size:29px; }
  text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; } svg { fill:#E1EEF5; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; }
  #third { display:none; }
  #seal { display:none; }
</style>
</head>
<body>
<div id="stage" class="pip">
  <div id="cap"></div>
  <div id="pip">Ken on camera, composited at render</div>
  <div id="scene"><svg id="svg" width="1160" height="530" viewBox="0 0 1160 530"></svg></div>
  <div id="third"></div>
  <div id="sub"></div>
  <div id="seal"></div>
  <div id="fade"></div>
</div>
<script>
const BUILD = 's01a-5';
console.log('[s01a] build', BUILD);
// Overdub twin of s01: Ken's audio apk 883.0→905.0; t is seconds after the in-point.
// Beat times read from the VTT cues on 2026-11-22 (tools/cutroom/mental-model-v2-sales/transcript-apk.json).
window.ANIM_DURATION = 22.0;
const ACC='#F2D06B', FG='#E1EEF5', MUT='#8fa3ad', OK='#4ade80', DN='#f87171', BLUE='#7baad4', BRD='rgba(56,225,255,.22)', CARD='#0a1016', TXS=1, WRAP=['',''];
const W=1160, H=530;
const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=u=>{u=clamp(u,0,1);return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;};
const lerp=(a,b,u)=>a+(b-a)*u;
const pr=(t,t0,d)=>ease((t-t0)/(d||0.6));          // eased progress 0..1 from t0 over d seconds
const on=(t,t0)=>t>=t0;
const op=(t,t0,d)=>clamp((t-t0)/(d||0.5),0,1);      // linear opacity ramp
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const txt=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${(o.sz||20)*TXS}" fill="${o.c||FG}" opacity="${o.o==null?1:o.o}" text-anchor="${o.a||'start'}" font-weight="${o.w||400}" class="${o.cls||''}" ${o.extra||''}>${esc(s)}</text>`;
const rect=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r==null?6:o.r}" fill="${o.f||'none'}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.5}" opacity="${o.o==null?1:o.o}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} ${o.extra||''}/>`;
const circ=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.f||FG}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.5}" opacity="${o.o==null?1:o.o}"/>`;
const line=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.s||MUT}" stroke-width="${o.sw||2}" opacity="${o.o==null?1:o.o}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} stroke-linecap="round"/>`;
const path=(d,o={})=>`<path d="${d}" fill="${o.f||'none'}" stroke="${o.s||FG}" stroke-width="${o.sw||2}" opacity="${o.o==null?1:o.o}" stroke-linecap="round" stroke-linejoin="round" ${o.dash?`stroke-dasharray="${o.dash}"`:''}/>`;
const arrow=(x1,y1,x2,y2,o={})=>{const a=Math.atan2(y2-y1,x2-x1),h=10;return line(x1,y1,x2,y2,o)+path(`M${x2} ${y2} L${x2-h*Math.cos(a-0.5)} ${y2-h*Math.sin(a-0.5)} M${x2} ${y2} L${x2-h*Math.cos(a+0.5)} ${y2-h*Math.sin(a+0.5)}`,{s:o.s||MUT,sw:o.sw||2,o:o.o});};
// a labelled box that grows in from t0
const box=(t,t0,x,y,w,h,label,o={})=>{const u=pr(t,t0,0.5);if(u<=0)return '';const ww=w*u,hh=h;return rect(x+(w-ww)/2,y,ww,hh,{s:o.s||BRD,f:o.f||'rgba(255,255,255,.02)',sw:o.sw||1.5,o:u})+(u>.6?txt(x+w/2,y+h/2+(o.sz||20)/3,label,{a:'middle',sz:o.sz||20,c:o.c||FG,o:op(t,t0+.3,.3),w:o.w||500}):'');};
// deterministic pseudo-random
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
// a herd of dots in a region; drift is a slow deterministic wander
function herd(n,seed,x,y,w,h){const r=rng(seed);const pts=[];for(let i=0;i<n;i++)pts.push({x:x+r()*w,y:y+r()*h,p:r()*6.28,q:r()*6.28});return pts;}
const wander=(p,t,amp)=>[p.x+Math.sin(t*0.9+p.p)*amp,p.y+Math.cos(t*0.7+p.q)*amp];
// typewriter: the first k chars of s by time
const type=(s,t,t0,cps)=>s.slice(0,Math.max(0,Math.floor((t-t0)*(cps||28))));
// a list that reveals one row per step seconds from t0
// --- the lesson helpers (2026-11-21, read from the Stanford "Probability for AI" screens) ---
// the question the window answers, top-left of the scene, serif, amber
const headY=(o={})=>{const capH=($('cap')||{}).offsetHeight||0;return Math.max(o.y||44,(capH-68)/1.1034+32);};
const head=(t,t0,q,o={})=>{const a=op(t,t0,.5);if(a<=0)return '';return txt(o.x||40,headY(o),q,{sz:o.sz||30,c:o.c||ACC,w:600,o:a,cls:'serif'});};
const bridge=(t,t0,s,o={})=>{const a=op(t,t0+.4,.6);if(a<=0)return '';const x=o.x||40,y=headY(o)+(o.dy||33);return txt(x,y,'in trading:',{sz:o.sz||24,c:MUT,o:a,cls:'hand'})+txt(x+(o.gap||128),y,s,{sz:o.sz||24,c:o.c||FG,o:a*.92,cls:'hand'});};   // the metaphor named as the trade, under the head, for the whole scene (lesson rule 8)   // under a three-line caption the question steps down
// where to look: a soft ring that glides to the element of the beat. pts=[[t0,x,y],...]; it holds for o.hold s (default 5) after each beat
function focus(t,pts,o={}){let cur=null,prev=null;for(const p of pts){if(t>=p[0]){prev=cur;cur=p;}}if(!cur)return '';const age=t-cur[0];if(age>(o.hold||5))return '';
  const u=prev?pr(t,cur[0],.6):1;const x=prev?lerp(prev[1],cur[1],u):cur[1],y=prev?lerp(prev[2],cur[2],u):cur[2];const r=(o.r||22)+Math.sin(t*4)*2;const a=op(t,cur[0],.3)*(age>(o.hold||5)-.6?((o.hold||5)-age)/.6:1);
  return circ(x,y,r,{f:'none',s:o.c||ACC,sw:2.5,o:a*.9})+circ(x,y,4,{f:o.c||ACC,o:a});}
// the boxed definition, once the intuition has landed: a serif title and his words under it
function defn(t,t0,x,y,w,title,lines,o={}){const u=pr(t,t0,.6);if(u<=0)return '';const lh=o.lh||28,h=(o.pad||22)*2+34+lines.length*lh;let s=rect(x,y,w,h,{r:8,s:o.s||FG,sw:2,f:o.f||'rgba(255,255,255,.03)',o:u});
  if(u>.5){const a=op(t,t0+.3,.4);s+=txt(x+(o.pad||22),y+(o.pad||22)+22,title,{sz:o.sz||26,c:o.c||FG,w:600,o:a,cls:'serif'});lines.forEach((ln,i)=>{s+=txt(x+(o.pad||22),y+(o.pad||22)+34+22+i*lh,ln,{sz:o.lsz||20,c:o.lc||FG,o:op(t,t0+.5+i*.25,.4)});});}return s;}
// the aside, in a second register: handwritten, amber, a little tilted (sparingly: his aside, not the framework)
const aside=(t,t0,x,y,s,o={})=>{const a=op(t,t0,.5);return a<=0?'':`<g transform="rotate(${o.rot==null?-2:o.rot} ${x} ${y})">`+txt(x,y,s,{sz:o.sz||24,c:o.c||ACC,o:a*(o.o==null?1:o.o),a:o.a||'start',cls:'hand'})+'</g>';};
// the recall box: an earlier figure back, small, in a corner, for a few seconds (draw the figure with its own helper inside g)
function recall(t,t0,x,y,w,h,label,inner,o={}){const a=op(t,t0,.5)*(o.until&&t>o.until?clamp(1-(t-o.until)/.6,0,1):1);if(a<=0)return '';
  return rect(x,y,w,h,{r:8,s:MUT,sw:1.5,f:'rgba(255,255,255,.03)',o:a,dash:'4 4'})+txt(x+12,y+20,label,{sz:14,c:MUT,o:a})+`<g opacity="${a}" transform="translate(${x} ${y+28}) scale(${o.sc||.5})">${inner}</g>`;}
function list(t,t0,step,items,x,y,o={}){let out='';items.forEach((s,i)=>{const o1=op(t,t0+i*step,0.4);if(o1>0)out+=txt(x,y+i*(o.lh||34),s,{sz:o.sz||22,c:o.c||FG,o:o1,w:o.w||400});});return out;}

const BEATS = [[0.3, "Develop the <em>coaching eye</em>", ""], [3.1, "Instead of waiting for me to tell you what right looks like", ""], [9.9, "Look at your trading, compare it to a standard", "The system and the rules you set up."], [18.6, "<em>Did I follow my own rules?</em> Yes or no.", ""]];
// WARP (optional): [[t_voice, t_authored], …] knots from the voice-over's words; the scene was authored on an estimate
const WARP = null;
const warpT = t => { if (!WARP) return t; for (let i = 1; i < WARP.length; i++) if (t <= WARP[i][0]) {
  const [a0, b0] = WARP[i - 1], [a1, b1] = WARP[i]; return b0 + (b1 - b0) * (t - a0) / Math.max(1e-6, a1 - a0); }
  return WARP[WARP.length - 1][1]; };
const __D = (function () {
const BEATS = [[0.8, "Develop the <em>coaching eye</em>", ""], [3.1, "Instead of waiting for me to tell you what right looks like", ""], [9.9, "Look at your trading, compare it to a standard", "The system and the rules you set up."], [18.6, "<em>Did I follow my own rules?</em> Yes or no.", ""], [22.2, "Was the trade any good? Yes or no.", ""], [27.6, "From that you develop data", "Not only can I follow my own rules; I can create good enough rules."], [38.3, "The second part: a system I design, that I can follow, that produces good results", ""], [47.8, "Over time it gets better, and learns from the process", ""], [53.9, "Each trade is also a <em>learning case study</em>", "That is why we study them after the fact."]];

// one colour per quantity, for the whole course
const RULE=BLUE, RISK=DN, REWARD=OK, KEY=ACC, INTU='#f472b6', IMAG='#c084fc', SENSE='#2dd4bf', EMO='#fb923c';
const FOUR=[['intuition',INTU],['imagination',IMAG],['common sense',SENSE],['emotion',EMO]];
const big=(x,y,sc,inner)=>`<g transform="translate(${x} ${y}) scale(${sc}) translate(${-x} ${-y})">${inner}</g>`;
const person=(x,y,o={})=>circ(x,y-14,9,{f:'none',s:o.c||FG,sw:2.5,o:o.o==null?1:o.o})+path(`M${x-16} ${y+22} C${x-16} ${y} ${x+16} ${y} ${x+16} ${y+22}`,{s:o.c||FG,sw:2.5,o:o.o==null?1:o.o});
const pill=(x,y,s,o={})=>{const w=(o.w||s.length*11+30);return rect(x-w/2,y-19,w,38,{r:19,s:o.s||BRD,f:o.f||'rgba(255,255,255,.03)',sw:2,o:o.o==null?1:o.o})+txt(x,y+7,s,{a:'middle',sz:o.sz||20,c:o.c||FG,o:o.o==null?1:o.o,w:o.wt||500});};
const lab=(t,t0,x,y,s,o={})=>{const a=op(t,t0,o.d||.5);return a<=0?'':txt(x,y,s,{sz:20,...o,o:a*(o.o==null?1:o.o)});};
const fade=(t,t0,t1,d)=>op(t,t0,d||.5)*(t1==null?1:1-op(t,t1,d||.5));
// a candle chart from a seed; n bars, drift d
function candles(x,y,w,h,n,seed,d,o={}){const r=rng(seed);let v=h*0.55,s='';const bw=w/n;for(let i=0;i<(o.k==null?n:o.k);i++){const o1=v;v=clamp(v-(r()-0.5+(d||0))*h*0.14,8,h-8);const hi=Math.min(o1,v)-r()*8,lo=Math.max(o1,v)+r()*8;const up=v<o1;s+=line(x+i*bw+bw/2,y+hi,x+i*bw+bw/2,y+lo,{s:up?OK:DN,sw:2,o:o.o==null?1:o.o});s+=rect(x+i*bw+2,y+Math.min(o1,v),bw-4,Math.max(2,Math.abs(v-o1)),{f:up?OK:DN,r:1,o:o.o==null?1:o.o});}return s;}
// the running example: the trade frame. now at y0, target up by up px, stop down by dn px; both=the mirror (the failure, the other way)
function tframe(x,w,y0,up,dn,o={}){const a=o.o==null?1:o.o,sz=o.sz||20;let s=line(x,y0,x+w,y0,{s:FG,sw:3,o:a})+txt(x+w+10,y0+7,'now',{sz,c:MUT,o:a});
  if(up)s+=line(x,y0-up,x+w,y0-up,{s:REWARD,sw:3,o:a})+txt(x+w+10,y0-up+7,o.tl||'target',{sz,c:REWARD,o:a});
  if(dn)s+=line(x,y0+dn,x+w,y0+dn,{s:RISK,sw:3,o:a})+txt(x+w+10,y0+dn+7,o.sl||'stop',{sz,c:RISK,o:a});
  if(o.both){const b=o.both;s+=line(x,y0+up,x+w,y0+up,{s:REWARD,sw:2.5,o:a*b,dash:'8 6'})+line(x,y0-dn,x+w,y0-dn,{s:RISK,sw:2.5,o:a*b,dash:'8 6'});}return s;}
// one of the four intelligences as a node
const node=(x,y,i,o={})=>{const a=o.o==null?1:o.o,c=FOUR[i][1];return circ(x,y,o.r||16,{f:'none',s:c,sw:3,o:a})+circ(x,y,(o.r||16)*.45,{f:c,o:a})+(o.lab===false?'':txt(x+(o.r||16)+12,y+7,FOUR[i][0],{sz:o.sz||22,c,o:a,w:500}));};
// a teeter-totter plank on a fulcrum at (cx,cy), half-length L, tilt in degrees
const plank=(cx,cy,L,deg,o={})=>{const a=deg*Math.PI/180,dx=Math.cos(a)*L,dy=Math.sin(a)*L;return path(`M${cx-26} ${cy+42} L${cx} ${cy} L${cx+26} ${cy+42} Z`,{s:MUT,sw:2.5,f:'rgba(255,255,255,.04)',o:o.o==null?1:o.o})+line(cx-dx,cy-dy,cx+dx,cy+dy,{s:o.s||FG,sw:o.sw||6,o:o.o==null?1:o.o});};
const onPlank=(cx,cy,L,deg,u,r)=>{const a=deg*Math.PI/180;return [cx+Math.cos(a)*L*u, cy+Math.sin(a)*L*u-(r||0)];};
// a hunter (lion or wolf) as a filled wedge
const hunter=(x,y,c,o={})=>path(`M${x-16} ${y+13} L${x} ${y-15} L${x+16} ${y+13} Z`,{s:c,f:c,sw:2,o:o.o==null?1:o.o});
// a car seen from above, nose to the right
const car=(x,y,c,o={})=>rect(x,y,84,40,{r:9,f:o.f||'rgba(255,255,255,.04)',s:c,sw:2.5,o:o.o==null?1:o.o})+rect(x+50,y+7,20,26,{r:4,s:c,sw:2,o:(o.o==null?1:o.o)*.7});

function draw(t){
  let s='';
  s += head(t,0.8,'Did I follow my own rules?')+bridge(t,0.8,"grade every trade against the rules you set yourself");
  // the eye, watching your trading
  const oe=op(t,0.8,.6), px=Math.sin(t*0.6)*5;
  s += path('M50 220 C95 165 205 165 250 220 C205 275 95 275 50 220 Z',{s:KEY,sw:3,o:oe}) + circ(150+px,220,24,{f:'none',s:FG,sw:2.5,o:oe}) + circ(150+px,220,10,{f:KEY,o:oe});
  s += lab(t,0.8,150,300,'the coaching eye',{a:'middle',c:KEY,sz:20});
  // your trading
  const ot=op(t,3.1,.6); if (ot>0) s += candles(290,130,420,190,20,3,0.02,{o:ot});
  s += lab(t,3.1,500,345,'your trading',{a:'middle',c:MUT,sz:20});
  // the standard laid under it
  if (t>=9.9){ const u=pr(t,9.9,.8); s += line(290,362,290+420*u,362,{s:RULE,sw:4}); s += lab(t,10.5,500,394,'the standard: your system, your rules',{a:'middle',c:RULE,sz:20}); }
  // right column: the two yes / no questions, then the data
  s += lab(t,18.6,790,170,'followed my rules?',{sz:24,c:RULE,w:600}); s += lab(t,19.4,790,202,'yes  /  no',{sz:22,c:MUT});
  s += lab(t,22.2,790,250,'was the trade good?',{sz:24,c:FG,w:600}); s += lab(t,23.0,790,282,'yes  /  no',{sz:22,c:MUT});
  if (t>=27.6){ const n=Math.min(12,Math.floor((t-27.6)/0.8)+1); for(let i=0;i<n;i++){ const ok=rng(i+5)()>0.3; s += txt(800+(i%6)*44,335+Math.floor(i/6)*34,ok?'✓':'✗',{sz:26,c:ok?REWARD:RISK}); } s += lab(t,28.2,1070,350,'data',{c:MUT,sz:20}); }
  // the second part, boxed in his words
  s += defn(t,38.3,40,410,680,'The system',['one I design, that I can follow, that gets good results','over time it gets better, and learns from the process'],{pad:16,lsz:20,s:RULE});
  // each trade a case study
  if (t>=53.9){ const n=Math.min(4,Math.floor((t-53.9)/1.4)+1); for(let i=0;i<n;i++) s += rect(820+i*10,440-i*10,190,70,{s:KEY,f:'#000',sw:2,o:0.95}); s += txt(920+(n-1)*10,482-(n-1)*10,'case study',{a:'middle',c:KEY,sz:20}); }
  s += focus(t,[[0.8,150,220],[9.9,500,362],[18.6,880,180],[22.2,880,260],[27.6,880,350],[38.3,100,440],[53.9,950,460]]);
  return s;
}

return draw;
})();
function draw(t) { return __D(t + 0.0); }   // mental-model-v2 s01 from +0.0 s

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  const tv = t; t = warpT(t);
  let cap = '', sub = '';
  for (const b of BEATS) if (t >= b[0]) { cap = b[1]; sub = b[2] || ''; }
  $('cap').innerHTML = cap; $('sub').textContent = sub;
  $('svg').innerHTML = WRAP[0] + draw(t) + WRAP[1];
  const f = $('fade');
  f.style.opacity = tv < 0.5 ? 1 - tv / 0.5 : (ANIM_DURATION - tv < 0.6 ? 1 - (ANIM_DURATION - tv) / 0.6 : 0);
};
renderFrame(0);
</script>
</body>
</html>
