<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>s38d · Tesla, the trade frame on his real daily chart</title>
<style>
  :root { --bg:#030507; --fg:#E1EEF5; --muted:#8fa3ad; --border:rgba(56,225,255,0.14); --accent:#F2D06B;
          --ok:#4ade80; --dn:#f87171; --card:#0a1016; --blue:#7baad4; }
  html, body { margin:0; background:var(--bg); overflow:hidden; }
  #stage { position:relative; width:1280px; height:720px; background:var(--bg); color:var(--fg);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #cap { position:absolute; left:60px; right:60px; top:30px; font-size:32px; font-weight:600; letter-spacing:-.01em; line-height:1.15; }
  #cap em { font-style:normal; color:var(--accent); }
  #sub { position:absolute; left:60px; width:1160px; top:648px; font-size:20px; color:var(--muted); line-height:1.4; }
  #scene { position:absolute; left:60px; top:112px; width:1160px; height:518px; border:1px solid var(--border);
           border-radius:10px; background:var(--card); overflow:hidden; }
  #svg { position:absolute; inset:0; }
  #fade { position:absolute; inset:0; background:var(--bg); pointer-events:none; opacity:0; }
  /* the picture-in-picture corner: build_v2 composites Ken's camera tile here (PIP_W/X/Y); the cutroom shows this placeholder */
  #pip { position:absolute; left:950px; top:22px; width:300px; height:169px; border:1px dashed rgba(56,225,255,0.35); border-radius:4px;
         display:none; color:var(--muted); font-size:13px; text-align:center; line-height:169px; }
  .pip #pip { display:block; } .pip #cap { right:360px; font-size:29px; }
  text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; fill:#E1EEF5; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; }
</style>
</head>
<body>
<div id="stage" class="">
  <div id="cap"></div>
  <div id="pip">Ken on camera, composited at render</div>
  <div id="scene"><svg id="svg" width="1160" height="530" viewBox="0 0 1160 530"></svg></div>
  <div id="sub"></div>
  <div id="fade"></div>
</div>
<script>
const BUILD = 's38d-2';
console.log('[s38d] build', BUILD);
// Overdub twin of s38d: Ken's audio src 4812.6→4959.3; t is seconds after the in-point.
// Beat times read from the VTT cues on 2026-11-17 (tools/cutroom/swing-logic-v2/transcript-src.json).
window.ANIM_DURATION = 146.7;

const ACC='#F2D06B', FG='#E1EEF5', MUT='#8fa3ad', OK='#4ade80', DN='#f87171', BLUE='#7baad4', BRD='rgba(56,225,255,.22)', CARD='#0a1016';
const W=1160, H=530;
const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=u=>{u=clamp(u,0,1);return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;};
const lerp=(a,b,u)=>a+(b-a)*u;
const pr=(t,t0,d)=>ease((t-t0)/(d||0.6));          // eased progress 0..1 from t0 over d seconds
const on=(t,t0)=>t>=t0;
const op=(t,t0,d)=>clamp((t-t0)/(d||0.5),0,1);      // linear opacity ramp
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const txt=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${o.sz||20}" fill="${o.c||FG}" opacity="${o.o==null?1:o.o}" text-anchor="${o.a||'start'}" font-weight="${o.w||400}" class="${o.cls||''}" ${o.extra||''}>${esc(s)}</text>`;
const rect=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r==null?6:o.r}" fill="${o.f||'none'}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.5}" opacity="${o.o==null?1:o.o}" ${o.extra||''}/>`;
const circ=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.f||FG}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.5}" opacity="${o.o==null?1:o.o}"/>`;
const line=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.s||MUT}" stroke-width="${o.sw||2}" opacity="${o.o==null?1:o.o}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} stroke-linecap="round"/>`;
const path=(d,o={})=>`<path d="${d}" fill="${o.f||'none'}" stroke="${o.s||FG}" stroke-width="${o.sw||2}" opacity="${o.o==null?1:o.o}" stroke-linecap="round" stroke-linejoin="round" ${o.dash?`stroke-dasharray="${o.dash}"`:''}/>`;
const arrow=(x1,y1,x2,y2,o={})=>{const a=Math.atan2(y2-y1,x2-x1),h=10;return line(x1,y1,x2,y2,o)+path(`M${x2} ${y2} L${x2-h*Math.cos(a-0.5)} ${y2-h*Math.sin(a-0.5)} M${x2} ${y2} L${x2-h*Math.cos(a+0.5)} ${y2-h*Math.sin(a+0.5)}`,{s:o.s||MUT,sw:o.sw||2,o:o.o});};
// a labelled box that grows in from t0
const box=(t,t0,x,y,w,h,label,o={})=>{const u=pr(t,t0,0.5);if(u<=0)return '';const ww=w*u,hh=h;return rect(x+(w-ww)/2,y,ww,hh,{s:o.s||BRD,f:o.f||'rgba(255,255,255,.02)',sw:o.sw||1.5,o:u})+(u>.6?txt(x+w/2,y+h/2+(o.sz||20)/3,label,{a:'middle',sz:o.sz||20,c:o.c||FG,o:op(t,t0+.3,.3),w:o.w||500}):'');};
// deterministic pseudo-random
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
// a herd of dots in a region; drift is a slow deterministic wander
function herd(n,seed,x,y,w,h){const r=rng(seed);const pts=[];for(let i=0;i<n;i++)pts.push({x:x+r()*w,y:y+r()*h,p:r()*6.28,q:r()*6.28});return pts;}
const wander=(p,t,amp)=>[p.x+Math.sin(t*0.9+p.p)*amp,p.y+Math.cos(t*0.7+p.q)*amp];
// typewriter: the first k chars of s by time
const type=(s,t,t0,cps)=>s.slice(0,Math.max(0,Math.floor((t-t0)*(cps||28))));
// a list that reveals one row per step seconds from t0
function list(t,t0,step,items,x,y,o={}){let out='';items.forEach((s,i)=>{const o1=op(t,t0+i*step,0.4);if(o1>0)out+=txt(x,y+i*(o.lh||34),s,{sz:o.sz||22,c:o.c||FG,o:o1,w:o.w||400});});return out;}

const BEATS = [[0.0, "Now, if this region does not hold support", ""], [4.4, "It will come down to 230: the mean of this previous support level", ""], [23.7, "At 264, that means about a <em>$35 move</em> to the downside", ""], [28.3, "A $10 risk is still three to one; a $5 risk, seven to one", ""], [41.5, "The downside trade is <em>more than justified</em>", ""], [47.0, "The upside trade has to get through 274", "Not much to play for, unless it breaks out."], [70.0, "Tesla's so big its momentum attracts more: 280, and it could go all the way", ""], [77.8, "Watch the S&P, XLK and the Qs: how is tech doing?", ""], [98.2, "In a perfect world: Tesla is the best of all, my primary upside play", ""], [114.7, "A chance to buy it on sale at 265; somebody bought this at 310", ""], [125.4, "A 10% fire sale on Tesla", ""], [137.9, "Ready to trade Tesla <em>in either direction</em>: a critical state at key support", ""]];

const PURP='#b48cff';
const T=i=>BEATS[Math.min(i,BEATS.length-1)][0];
const after=(t,i)=>t>=T(i);
const between=(t,i,j)=>t>=T(i)&&t<T(j);
// a phase's opacity: in at beat i, out at beat j (j omitted: stays)
const ph=(t,i,j)=>op(t,T(i),.5)*(j==null?1:1-op(t,T(j)-.4,.4));
// a price path through key points [[u,v],...] (u 0..1) with a small deterministic wobble
function walk(keys,seed,amp){const r=rng(seed);const N=240;const nz=[];let a=0;for(let i=0;i<=N;i++){a=a*0.82+(r()-.5);nz.push(a);}
  return u=>{u=clamp(u,0,1);let k=0;while(k<keys.length-2&&u>keys[k+1][0])k++;const [x0,v0]=keys[k],[x1,v1]=keys[k+1];const w=clamp((u-x0)/((x1-x0)||1),0,1);return lerp(v0,v1,w)+nz[Math.round(u*N)]*(amp||0);};}
// a chart frame: x,y,w,h in the scene; lo..hi the price scale
function fr(x,y,w,h,lo,hi){return {x,y,w,h,lo,hi,X:u=>x+u*w,Y:v=>y+h-(v-lo)/(hi-lo)*h};}
function plot(F,f,u0,u1,o={}){if(u1<=u0)return '';let d='';const n=Math.max(2,Math.round((u1-u0)*180));for(let i=0;i<=n;i++){const u=u0+(u1-u0)*i/n;d+=(i?'L':'M')+F.X(u).toFixed(1)+' '+F.Y(f(u)).toFixed(1);}return path(d,{s:o.s||FG,sw:o.sw||2.5,o:o.o==null?1:o.o,dash:o.dash});}
function lvl(F,v,label,o={}){const y=F.Y(v),x0=o.x0==null?F.x:F.X(o.x0),x1=o.x1==null?F.x+F.w:F.X(o.x1);
  return line(x0,y,x1,y,{s:o.s||MUT,sw:o.sw||1.5,dash:o.dash===undefined?'6 5':o.dash,o:o.o})+(label?txt(o.left?x0-8:x1+8,y+6,label,{a:o.left?'end':'start',c:o.s||MUT,sz:o.sz||16,o:o.o,w:o.w||500}):'');}
function panel(x,y,w,h,label,o){return rect(x,y,w,h,{s:BRD,f:'rgba(255,255,255,.015)',o:o,r:6})+(label?txt(x+12,y+24,label,{c:MUT,sz:15,o:o,w:600}):'');}
function zone(F,u0,u1,va,vb,o={}){const y1=F.Y(Math.max(va,vb)),y2=F.Y(Math.min(va,vb));return rect(F.X(u0),y1,F.X(u1)-F.X(u0),Math.max(1,y2-y1),{f:o.f||'rgba(248,113,113,.14)',s:o.s||DN,sw:o.sw||1.2,r:2,o:o.o==null?1:o.o,extra:o.dash?`stroke-dasharray="${o.dash}"`:''});}
function dot(F,u,v,c,o){return circ(F.X(u),F.Y(v),7,{f:c,o:o==null?1:o})+circ(F.X(u),F.Y(v),12,{f:'none',s:c,sw:1.5,o:(o==null?1:o)*.5});}
// candles from a series of closes; reveal the first k
function candles(F,cl,k,o={}){let s='';const n=cl.length,bw=F.w/n*.62;for(let i=0;i<Math.min(k,n);i++){const a=i?cl[i-1]:cl[0]-(cl[1]-cl[0]),b=cl[i];const up=b>=a;const c=o.c&&o.c[i]?o.c[i]:(up?OK:DN);
  const x=F.x+(i+.5)*F.w/n,hi=Math.max(a,b)+(o.wk||.35)*Math.abs(b-a)+(o.wk0||.4),lo=Math.min(a,b)-(o.wk||.35)*Math.abs(b-a)-(o.wk0||.4);
  s+=line(x,F.Y(hi),x,F.Y(lo),{s:c,sw:1.5,o:o.o})+rect(x-bw/2,F.Y(Math.max(a,b)),bw,Math.max(2,Math.abs(F.Y(a)-F.Y(b))),{f:c,s:'none',r:1,o:o.o});}return s;}
const cx=(F,i,n)=>F.x+(i+.5)*F.w/n;
// a bell curve lying on its side: base x, centre y, sd in px, height in px
function bellSide(x,y,sd,h,o={}){let d='';for(let i=0;i<=80;i++){const z=-3+6*i/80;const yy=y-z*sd,xx=x+h*Math.exp(-z*z/2);d+=(i?'L':'M')+xx.toFixed(1)+' '+yy.toFixed(1);}return path(d,{s:o.s||ACC,sw:2,o:o.o,f:o.f||'rgba(242,208,107,.08)'});}
// a gauge: centre, radius, needle value -1..1 (left..right)
function gauge(x,y,r,v,o={}){let s='';const arc=(a0,a1,c,w)=>{const p0=[x+r*Math.cos(Math.PI*(1-a0)),y-r*Math.sin(Math.PI*(1-a0))],p1=[x+r*Math.cos(Math.PI*(1-a1)),y-r*Math.sin(Math.PI*(1-a1))];return path(`M${p0[0].toFixed(1)} ${p0[1].toFixed(1)} A${r} ${r} 0 0 1 ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`,{s:c,sw:w||10,o:o.o});};
  s+=arc(0,.333,DN,10)+arc(.333,.667,'rgba(143,163,173,.5)',10)+arc(.667,1,OK,10);const a=Math.PI*(1-(v+1)/2);s+=line(x,y,x+(r-18)*Math.cos(a),y-(r-18)*Math.sin(a),{s:ACC,sw:4,o:o.o})+circ(x,y,8,{f:ACC,o:o.o});
  if(o.labels!==false){s+=txt(x-r,y+26,'weak',{a:'middle',c:DN,sz:14,o:o.o})+txt(x,y-r-18,'normal',{a:'middle',c:MUT,sz:14,o:o.o})+txt(x+r,y+26,'strong',{a:'middle',c:OK,sz:14,o:o.o});}return s;}
// a chip: rounded label
function chip(x,y,s,o={}){const w=o.w||Math.max(60,s.length*(o.sz||17)*.58+26);return rect(x,y,w,o.h||34,{f:o.f||'rgba(242,208,107,.10)',s:o.s||ACC,sw:1.2,r:17,o:o.o})+txt(x+w/2,y+(o.h||34)/2+6,s,{a:'middle',c:o.c||FG,sz:o.sz||17,o:o.o,w:500});}
// a centred statement
function big(s,o,c,y){return txt(580,y||270,s,{a:'middle',sz:34,c:c||ACC,o:o,w:600});}
// an R ruler: n stacked 1R blocks from (x,y) upward, block height h
function rruler(x,y,h,n,k,c){let s='';for(let i=0;i<Math.min(n,k);i++)s+=rect(x,y-(i+1)*h,40,h-3,{f:'rgba(74,222,128,.22)',s:c||OK,sw:1,r:2})+txt(x+50,y-i*h-h/2+5,`${i+1}R`,{sz:14,c:c||OK});return s;}

const DK={ok:'#15803d',dn:'#dc2626',am:'#b45309',bl:'#1d4ed8'};
function tag(x,y,s,c,o,a){const w=s.length*9.2+16;const x0=a==='end'?x-w:x;return rect(x0,y-13,w,24,{f:'rgba(3,5,7,.88)',s:c,sw:1,r:5,o})+txt(x0+w/2,y+5,s,{a:'middle',c:'#fff',sz:15,o,w:600});}

const XR=PX(775), XN=PX(747);   // the plot's right edge; the last bar (2022-09-30)
function draw(t){
  let s='';
  s += `<image href="${IMG}" x="${IX}" y="0" width="${405*S}" height="${424*S}" preserveAspectRatio="none"/>`;
  s += txt(IX+8,522,"Ken's daily chart, 2022-09-30",{c:'#555',sz:13});

  if (after(t,2)){ const o=op(t,T(2),.5); s += arrow(XR-8,PY(263),XR-8,PY(231),{s:DK.dn,sw:4,o}); }
  if (after(t,3)){ const o=op(t,T(3),.5); s += rect(XN-34,PY(274),26,PY(264)-PY(274),{f:'rgba(220,38,38,.25)',s:DK.dn,sw:1.5,r:1,o}) + rect(XN-64,PY(269),26,PY(264)-PY(269),{f:'rgba(220,38,38,.25)',s:DK.dn,sw:1.5,r:1,o:op(t,T(3)+2,.5)}); }

  if (after(t,6)){ const o=op(t,T(6),.5); s += hl(280,PX(640),XR,DK.ok,o,2,'6 4') + tag(PX(640),PY(280)-34,'280',DK.ok,o,'end') + arrow(XR-8,PY(281),XR-8,PY(306),{s:DK.ok,sw:3,o:op(t,T(6)+2,.5)}); }

  const RX=600;

  if (oB>0){
    [['S&P',7],['XLK',7],['QQQ',7],['TSLA',8]].forEach(([n,b],i)=>{ const o=oB*op(t,T(b)+i*.5,.4); s += rect(RX,60+i*64,300,48,{f:'rgba(255,255,255,.02)',s:i==3?ACC:BRD,o,r:8}) + txt(RX+24,91+i*64,n,{sz:19,o,w:600,c:i==3?ACC:FG}) + txt(RX+276,91+i*64,i==3?'best of all':'up?',{a:'end',sz:15,c:i==3?ACC:MUT,o}); });
    if (after(t,9)) s += txt(RX,350,'on sale at 265',{c:ACC,sz:22,o:op(t,T(9),.4),w:600}) + txt(RX+190,350,'somebody paid 310',{c:MUT,sz:16,o:op(t,T(9)+2,.4)});
    if (after(t,10)) s += txt(RX,392,'a 10% fire sale',{c:ACC,sz:22,o:op(t,T(10),.4),w:600});
    if (after(t,11)){ const o=op(t,T(11),.4); s += arrow(RX+20,470,RX+20,430,{s:OK,sw:4,o}) + arrow(RX+56,430,RX+56,470,{s:DN,sw:4,o}) + txt(RX+84,448,'either direction',{c:ACC,sz:20,o,w:600}) + txt(RX+84,474,'critical state at key support',{c:MUT,sz:15,o}); } }
  return s;
}
function phh(t,i,j){ return op(t,T(i),.5)*(j==null?1:1-op(t,T(j)-.4,.4)); }

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  let cap = '', sub = '';
  for (const b of BEATS) if (t >= b[0]) { cap = b[1]; sub = b[2] || ''; }
  $('cap').innerHTML = cap; $('sub').textContent = sub;
  $('svg').innerHTML = draw(t);
  const f = $('fade');
  f.style.opacity = t < 0.5 ? 1 - t / 0.5 : (ANIM_DURATION - t < 0.6 ? 1 - (ANIM_DURATION - t) / 0.6 : 0);
};
renderFrame(0);
</script>
