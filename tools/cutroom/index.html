<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cutroom</title>
<style>
  :root {
    --bg:#0e0e0c; --card:#181815; --card2:#1f1f1c; --fg:#e8e6df; --dim:#9c978a;
    --faint:#5d594f; --amber:#d4a559; --amber-dim:#8a6a35; --border:#2a2925;
    --cut:#d4a559; --explainer:#7baad4; --overdub:#6aa84f; --slide:#9c978a;
    --excl:#c45656; --board:#b48ead; --rec:#d9534f;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:var(--amber); text-decoration:none; }
  button { font-family:inherit; background:var(--card2); color:var(--fg); border:1px solid var(--border); border-radius:5px; padding:.35rem .7rem; cursor:pointer; font-size:.82rem; }
  button:hover { border-color:var(--amber-dim); }
  button.primary { background:var(--amber-dim); border-color:var(--amber-dim); color:#0e0e0c; font-weight:600; }
  button.small { padding:.15rem .45rem; font-size:.72rem; }
  header { display:flex; align-items:center; gap:1rem; padding:.8rem 1.4rem; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:20; flex-wrap:wrap; }
  header h1 { font-family:Georgia,serif; font-size:1.15rem; font-weight:400; }
  header .meta { color:var(--faint); font-size:.78rem; font-family:"SF Mono",Menlo,monospace; }
  header .spacer { flex:1; }
  .toast { position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%); background:var(--amber-dim); color:#0e0e0c; padding:.5rem 1.1rem; border-radius:6px; font-size:.85rem; font-weight:600; opacity:0; transition:opacity .25s; z-index:99; pointer-events:none; }
  .toast.show { opacity:1; }

  main { display:grid; grid-template-columns: 1fr clamp(560px, 52vw, 1100px); gap:0; min-height:calc(100vh - 56px); }
  @media (max-width:1100px){ main { grid-template-columns:1fr; } }

  /* ---- timeline ---- */
  #timeline { padding:1.2rem 1.4rem 3rem; overflow-x:auto; }
  .lane-legend { display:flex; gap:1.4rem; margin:0 0 .9rem; font-size:.72rem; color:var(--faint); font-family:"SF Mono",Menlo,monospace; }
  .lane-legend b { font-weight:600; }
  .lane-legend .k { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:.35rem; vertical-align:-1px; }
  .seg { display:grid; grid-template-columns: 54px 1fr; gap:.7rem; margin:0 0 .55rem; cursor:pointer; }
  .seg .tc { font-family:"SF Mono",Menlo,monospace; font-size:.72rem; color:var(--faint); padding-top:.55rem; text-align:right; }
  .segcard { border:1px solid var(--border); border-radius:8px; background:var(--card); padding:.55rem .8rem .6rem; transition:border-color .15s, opacity .15s; position:relative; }
  .seg.sel .segcard { border-color:var(--amber); box-shadow:0 0 0 1px var(--amber); }
  .seg.excluded .segcard { opacity:.38; }
  .seg.excluded .segcard::after { content:"EXCLUDED"; position:absolute; top:.5rem; right:.7rem; color:var(--excl); font-size:.66rem; font-family:"SF Mono",Menlo,monospace; font-weight:700; }
  .seghead { display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap; }
  .type-pill { font-size:.62rem; font-family:"SF Mono",Menlo,monospace; font-weight:700; letter-spacing:.06em; padding:.08rem .45rem; border-radius:3px; color:#0e0e0c; }
  .type-cut .type-pill { background:var(--cut); } .type-explainer .type-pill { background:var(--explainer); }
  .type-overdub .type-pill { background:var(--overdub); } .type-slide .type-pill { background:var(--slide); }
  .type-board .type-pill { background:var(--board); } .type-outcome .type-pill { background:var(--explainer); }
  .lanes .lv.a-take { border-left:3px solid var(--rec); }
  .seglabel { font-size:.9rem; }
  .segdur { margin-left:auto; font-family:"SF Mono",Menlo,monospace; font-size:.72rem; color:var(--faint); }
  .lanes { display:grid; grid-template-columns: 64px 1fr; gap:.15rem .5rem; margin-top:.45rem; font-size:.7rem; }
  .lanes .ln { color:var(--faint); font-family:"SF Mono",Menlo,monospace; text-align:right; }
  .lanes .lv { border-radius:3px; padding:.12rem .5rem; background:var(--card2); color:var(--dim); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .lanes .lv.v-src { border-left:3px solid var(--cut); } .lanes .lv.v-anim { border-left:3px solid var(--explainer); }
  .lanes .lv.v-slide { border-left:3px solid var(--slide); }
  .lanes .lv.a-ken { border-left:3px solid var(--cut); } .lanes .lv.a-vo { border-left:3px solid var(--explainer); }
  .lanes .lv.a-sil { border-left:3px solid var(--faint); }
  .lanes .lv.o-lt { border-left:3px solid var(--overdub); } .lanes .lv.o-none { border-left:3px solid transparent; color:var(--faint); }
  .notebadge { margin-top:.4rem; font-size:.72rem; color:var(--amber); }
  /* ---- storyboard (cutroom-18): one picture per included segment, in course order; the pictures come from
     scripts/cutroom_board.py by convention (<course>/thumbs/<sid>.jpg, <course>/slides/<slide_id>.jpg) ---- */
  #boardwrap { padding:.55rem 1.4rem .4rem; border-bottom:1px solid var(--border); background:var(--card); }
  .boardhead { display:flex; align-items:center; gap:.6rem; font-size:.7rem; color:var(--faint); font-family:"SF Mono",Menlo,monospace; margin-bottom:.45rem; }
  .boardhead .spacer { flex:1; }
  #board { display:flex; gap:.45rem; overflow-x:auto; padding:0 0 .5rem; scrollbar-width:thin; }
  #board.grid { flex-wrap:wrap; overflow:visible; }
  .bt { flex:0 0 auto; width:148px; cursor:pointer; border-radius:5px; border:1px solid var(--border); background:var(--card); overflow:hidden; transition:border-color .15s; }
  .bt:hover { border-color:var(--amber-dim); }
  .bt.sel { border-color:var(--amber); box-shadow:0 0 0 1px var(--amber); }
  .bt .bar { height:3px; }
  .bt .pic { width:148px; height:83px; background:var(--card2); display:flex; align-items:center; justify-content:center; color:var(--faint); font-size:.62rem; font-family:"SF Mono",Menlo,monospace; text-align:center; padding:0 .4rem; }
  .bt .pic img { width:100%; height:100%; object-fit:cover; display:block; }
  .bt.type-slide { border-color:var(--slide); }
  .bt.type-slide.sel { border-color:var(--amber); }
  .bt .cap { display:flex; justify-content:space-between; gap:.3rem; padding:.18rem .35rem .22rem; font-size:.6rem; font-family:"SF Mono",Menlo,monospace; color:var(--faint); white-space:nowrap; overflow:hidden; }
  .bt .cap b { color:var(--dim); font-weight:600; overflow:hidden; text-overflow:ellipsis; }
  .bt.type-slide .cap b { color:var(--fg); }
  .segcard.has-thumb { display:grid; grid-template-columns:1fr 128px; gap:.6rem; }
  .segcard .thumb { grid-column:2; grid-row:1 / span 3; align-self:start; width:128px; height:72px; object-fit:cover; border-radius:4px; border:1px solid var(--border); background:var(--card2); margin-top:.1rem; }
  .segcard.type-slide-card .thumb { border-color:var(--slide); }
  /* ---- the owner's text card (cutroom-19): a slide segment with `text` is drawn live from what is typed; the real
     png comes from scripts/render_slides.py with the SAME values (TEXT_CARD_CSS there) ---- */
  .cardwrap { width:100%; aspect-ratio:16/9; overflow:hidden; position:relative; background:#0e0e0c; border-radius:4px; }
  .cardwrap.thumb { width:128px; height:72px; border:1px solid var(--slide); }
  .card { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; background:#0e0e0c; color:#e8e6df;
          display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 160px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
  .card .ck { font-size:34px; color:#d4a559; letter-spacing:.14em; text-transform:uppercase; margin-bottom:36px; text-align:center; }
  .card .ct { font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:96px; line-height:1.15; max-width:1500px; text-align:center; }
  .card .cs { font-size:52px; color:#e8e6df; margin-top:18px; max-width:1500px; text-align:center; white-space:pre-wrap; }
  .card .cb { font-size:44px; color:#9c978a; margin-top:40px; max-width:1400px; line-height:1.5; text-align:center; white-space:pre-wrap; }
  /* layouts: the values of the designed cards in courses/<dir>/slides.html (cutroom-20) */
  .card.L-title .ct { font-size:118px; line-height:1.1; letter-spacing:-.01em; max-width:1700px; }
  .card.L-title .cb { margin-top:0; font-size:44px; max-width:1500px; line-height:1.45; }
  .card.L-title .cb::before { content:""; display:block; width:220px; height:3px; background:#d4a559; margin:44px auto 28px; border-radius:2px; }
  .card.L-chapter .ct { font-size:104px; }
  .card.L-chapter .cs { font-size:44px; color:#9c978a; margin-top:28px; }
  .card.L-maxim .ct { font-style:italic; font-size:92px; line-height:1.3; }
  .card.L-maxim .cs { font-size:44px; color:#d4a559; margin-top:56px; }
  .card.L-end { padding:0 60px; }
  .card.L-end .ct { font-size:84px; max-width:none; }
  .card.L-end .cs { font-family:"SF Mono",Menlo,monospace; font-size:60px; color:#d4a559; margin-top:32px; }
  .card.L-end .cb { font-size:38px; margin-top:72px; max-width:1320px; }
  .card .amber { color:#d4a559; }
  .card .cbrand { position:absolute; bottom:44px; right:56px; font-size:26px; color:#5d594f; letter-spacing:.06em; }
  .card .cbrand b { color:#8a6a35; font-weight:600; }
  .card .ph { color:#5d594f; }
  .cardedit { border:1px solid var(--amber-dim); border-radius:6px; padding:.6rem .7rem .2rem; margin:0 0 .85rem; background:var(--card); }
  .cardedit .hint { font-size:.7rem; color:var(--faint); margin:-.3rem 0 .6rem; }
  .slideview { width:100%; aspect-ratio:16/9; display:block; border-radius:6px; background:#000; border:1px solid var(--border); }

  /* ---- inspector ---- */
  #inspector { border-left:1px solid var(--border); padding:1.1rem 1.2rem 3rem; position:sticky; top:56px; height:calc(100vh - 56px); overflow-y:auto; }
  @media (max-width:1100px){ #inspector { position:static; height:auto; border-left:none; border-top:1px solid var(--border);} }
  #inspector h2 { font-family:Georgia,serif; font-size:1rem; font-weight:500; margin-bottom:.7rem; }
  .field { margin:0 0 .85rem; }
  .field label { display:block; font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); font-family:"SF Mono",Menlo,monospace; margin-bottom:.3rem; }
  .field textarea, .field input[type=text], .field select {
    width:100%; background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:5px; padding:.45rem .6rem; font-size:.83rem; font-family:inherit;
  }
  .field textarea { min-height:70px; resize:vertical; line-height:1.45; }
  /* The viewer is pinned to the top of the inspector so it never scrolls out of
     reach while you work the transcript below it. */
  .viewer { position:sticky; top:0; z-index:6; background:var(--bg); padding:.15rem 0 .55rem; margin-bottom:.5rem; border-bottom:1px solid var(--border); }
  .viewer .rowbtns { margin:.6rem 0 0; }
  @media (max-width:1100px){ .viewer { position:static; } }
  video { width:100%; max-height:52vh; background:#000; border-radius:6px; aspect-ratio:16/9; object-fit:contain; display:block; }

  /* ---- animation overlay ----
     An overdub is Ken's audio over our picture, so the draft animation sits ON
     the video: the video keeps playing (and keeps supplying the audio and the
     trim scrubber) while the canvas covers his cohort-only screen. */
  .vstack { position:relative; }
  .animlayer { position:absolute; top:0; left:0; width:1280px; height:720px; border:0;
               transform-origin:top left; border-radius:6px; background:#000;
               display:none; pointer-events:none; }
  .vstack.anim .animlayer { display:block; }
  /* cutroom-17: the picture-in-picture corner. A twin with pip:true on a source with pip.crop shows Ken's camera
     tile live over the animation, cropped from the playing video, exactly where build_v2 composites it (950,22 300x169). */
  .piplayer { position:absolute; top:0; left:0; width:300px; height:169px; transform-origin:top left; border:1px solid rgba(56,225,255,.35);
              border-radius:4px; background:#000; display:none; pointer-events:none; }
  .vstack.anim.pip .piplayer { display:block; }
  /* ---- the Voice panel: an animation-only viewer (no source video), the prompter, the recorder ---- */
  .vstack.solo { width:100%; aspect-ratio:16/9; background:#000; border-radius:6px; overflow:hidden; }
  .vstack.solo .animlayer { display:block; }
  .prompter { font-size:1.08rem; line-height:1.65; max-height:34vh; overflow-y:auto; border:1px solid var(--border); border-radius:6px; padding:.75rem .95rem; background:var(--card); color:var(--fg); }
  .prompter u { text-decoration:none; border-bottom:2px solid var(--amber-dim); }
  .prompter.board li { margin:.2rem 0; }
  .vaudio { width:100%; height:32px; margin:.4rem 0; }
  button.rec { background:var(--rec); border-color:var(--rec); color:#fff; font-weight:600; }
  button.rec.live { animation:pulse 1s infinite; } @keyframes pulse { 50% { opacity:.55; } }
  .vstatus { font-family:"SF Mono",Menlo,monospace; font-size:.72rem; color:var(--dim); line-height:1.5; }
  .vstatus b { color:var(--amber); font-weight:600; }
  .fitrep { font-family:"SF Mono",Menlo,monospace; font-size:.7rem; line-height:1.55; color:var(--dim); border:1px solid var(--border); border-radius:6px; padding:.4rem .6rem; background:var(--card); max-height:22vh; overflow:auto; }
  .fitrep .ok { color:#6aa84f; } .fitrep .fz { color:var(--amber); } .fitrep .no { color:var(--excl); }
  .microw { display:flex; align-items:center; gap:.6rem; margin:.35rem 0; font-size:.75rem; color:var(--dim); flex-wrap:wrap; }
  .microw select { background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:5px; padding:.25rem .4rem; font:inherit; font-size:.75rem; max-width:320px; }
  .meter { flex:1; min-width:140px; height:10px; border:1px solid var(--border); border-radius:5px; background:var(--card); overflow:hidden; }
  .meter i { display:block; height:100%; width:0; background:linear-gradient(90deg, #6aa84f, var(--amber) 70%, var(--rec)); transition:width .08s; }
  .meter.flat i { background:var(--excl); }
  .diag { font-family:"SF Mono",Menlo,monospace; font-size:.68rem; color:var(--dim); white-space:pre-wrap; border:1px solid var(--border); border-radius:6px; padding:.4rem .6rem; background:var(--card); max-height:26vh; overflow:auto; }
  .diag b { color:var(--amber); font-weight:600; } .diag .bad { color:var(--excl); } .diag .good { color:#6aa84f; }
  .rlog { font-family:"SF Mono",Menlo,monospace; font-size:.66rem; color:var(--faint); white-space:pre-wrap; max-height:16vh; overflow:auto; }
  .viewtabs { display:flex; gap:.35rem; align-items:center; margin:.55rem 0 0; flex-wrap:wrap; }
  .viewtabs button.on { background:var(--amber-dim); border-color:var(--amber-dim); color:#0e0e0c; font-weight:600; }
  .viewtabs .cov { margin-left:auto; font-size:.68rem; color:var(--faint); font-family:"SF Mono",Menlo,monospace; }
  .trimrow { display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; margin:.3rem 0; }
  .trimrow .tv { font-family:"SF Mono",Menlo,monospace; font-size:.85rem; color:var(--amber); min-width:84px; }
  .rowbtns { display:flex; gap:.5rem; flex-wrap:wrap; margin:.9rem 0; }
  .hint { font-size:.72rem; color:var(--faint); line-height:1.5; margin-top:.4rem; }
  .empty { color:var(--faint); font-size:.85rem; padding:2rem 0; text-align:center; }
  .voicebox { border:1px solid var(--border); border-radius:6px; padding:.6rem .7rem; margin:.4rem 0; display:flex; align-items:center; gap:.6rem; }
  .voicebox input { accent-color:var(--amber); }
  .voicebox audio { height:28px; flex:1; }
  .why { font-size:.75rem; color:var(--dim); font-style:italic; line-height:1.45; margin:.4rem 0 .8rem; }
  /* transcript panel */
  .tx { max-height:36vh; overflow-y:auto; border:1px solid var(--border); border-radius:6px; background:var(--card); padding:.3rem 0; }
  .cue { display:flex; gap:.55rem; align-items:baseline; padding:.18rem .6rem; font-size:.78rem; line-height:1.45; cursor:pointer; border-left:3px solid transparent; }
  .cue:hover { background:var(--card2); }
  .cue .ct { font-family:"SF Mono",Menlo,monospace; font-size:.68rem; color:var(--faint); white-space:nowrap; min-width:44px; }
  .cue .cx { color:var(--dim); flex:1; }
  .cue.inrange { border-left-color:var(--amber-dim); }
  .cue.inrange .cx { color:var(--fg); }
  .cue.now { background:var(--card2); border-left-color:var(--amber); }
  .cue .setbtns { visibility:hidden; display:flex; gap:.25rem; }
  .cue:hover .setbtns { visibility:visible; }
  .cue .setbtns button { padding:.02rem .35rem; font-size:.62rem; }
  .txsearch { display:flex; gap:.5rem; align-items:center; margin:0 0 .4rem; }
  .txsearch input { flex:1; background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:5px; padding:.35rem .6rem; font-size:.8rem; }
  .txsearch input:focus { outline:none; border-color:var(--amber-dim); }
  .txsearch .cnt { font-family:"SF Mono",Menlo,monospace; font-size:.7rem; color:var(--faint); white-space:nowrap; }
  .cue mark { background:var(--amber-dim); color:#0e0e0c; border-radius:2px; padding:0 .1em; }
</style>
</head>
<body>

<header>
  <h1>Cutroom <span style="color:var(--faint)">·</span> <span id="ctitle" style="color:var(--amber)"></span></h1>
  <span class="meta" id="cmeta"></span>
  <span class="spacer"></span>
  <button id="undoBtn" disabled title="Undo last change (Ctrl+Z)">↩ Undo</button>
  <button id="redoBtn" disabled title="Redo (Ctrl+Shift+Z)">↪ Redo</button>
  <button id="resetBtn" title="Discard local edits, reload the published plan">Reset to published</button>
  <button id="copyBtn">Copy plan JSON</button>
  <select id="courseSel" style="display:none;background:var(--card2);color:var(--fg);border:1px solid var(--border);border-radius:5px;padding:.3rem .5rem;font:inherit;font-size:.82rem" title="Switch course (local app)"></select>
  <button class="primary" id="saveBtn" style="display:none" title="Save edits to courses/&lt;course&gt;/plan.v2.edited.json (Ctrl+S)">Save to coursecraft</button>
  <button class="primary" id="exportBtn">Export plan JSON</button>
</header>

<section id="boardwrap" style="display:none">
  <div class="boardhead"><b>STORYBOARD</b> <span id="boardmeta"></span> <span class="spacer"></span>
    <button class="small" id="boardGrid" title="Show every picture at once">Show all</button></div>
  <div id="board" title="The course as it plays: one picture per included segment (slide card, animation, Ken's screen). Click to select."></div>
</section>

<main>
  <div id="timeline">
    <div class="lane-legend">
      <span><b>LANES per segment:</b></span>
      <span><span class="k" style="background:var(--cut)"></span>Ken (source)</span>
      <span><span class="k" style="background:var(--explainer)"></span>explainer / animation</span>
      <span><span class="k" style="background:var(--overdub)"></span>overdub / overlay</span>
      <span><span class="k" style="background:var(--slide)"></span>slide</span>
    </div>
    <div id="segs"></div>
  </div>

  <aside id="inspector">
    <div class="empty" id="noSel">Select a segment to inspect and edit.<br><br>
      <span style="font-size:.75rem">Keys: ↑/↓ select · space play/pause · x include/exclude</span>
    </div>
    <div id="insp" style="display:none"></div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<script>
const BUILD = 'cutroom-21';
console.log('[cutroom] build', BUILD);
window.__edgeBuild = BUILD;

// ---------- config / mode ----------
const qs = new URLSearchParams(location.search);
const COURSE = qs.get('course') || 'frog-box-v2';
// media override: ?media=<base-url-or-relative-path>  (Mac local mode uses e.g. ?media=../../courses/topical-frog-box/proxies/)
const MEDIA_OVERRIDE = qs.get('media');
const LS_KEY = `cutroom:${COURSE}`;

let plan = null;        // working copy
let published = null;   // pristine copy
let selIdx = -1;
let videoEl = null;
let stopAt = null;

// ---------- undo / redo ----------
const undoStack = [];   // snapshots BEFORE each mutation: {plan, selIdx, label}
const redoStack = [];
const UNDO_MAX = 100;
function snapshot(label) {
  undoStack.push({ plan: structuredClone(plan), selIdx, label });
  if (undoStack.length > UNDO_MAX) undoStack.shift();
  redoStack.length = 0;
  updateUndoButtons();
}
function updateUndoButtons() {
  const u = document.getElementById('undoBtn'), r = document.getElementById('redoBtn');
  if (!u) return;
  u.disabled = undoStack.length === 0;
  r.disabled = redoStack.length === 0;
  u.title = undoStack.length ? `Undo: ${undoStack[undoStack.length-1].label} (Ctrl+Z)` : 'Nothing to undo';
  r.title = redoStack.length ? `Redo: ${redoStack[redoStack.length-1].label} (Ctrl+Shift+Z)` : 'Nothing to redo';
}
function restoreState(state) {
  plan = state.plan;
  selIdx = Math.min(state.selIdx, plan.segments.length - 1);
  persist(); render();
  if (selIdx >= 0) select(selIdx);
  else { document.getElementById('insp').style.display='none'; document.getElementById('noSel').style.display='block'; }
}
function doUndo() {
  if (!undoStack.length) return;
  const prev = undoStack.pop();
  redoStack.push({ plan: structuredClone(plan), selIdx, label: prev.label });
  restoreState(prev);
  updateUndoButtons();
  toast(`Undid: ${prev.label}`);
}
function doRedo() {
  if (!redoStack.length) return;
  const next = redoStack.pop();
  undoStack.push({ plan: structuredClone(plan), selIdx, label: next.label });
  restoreState(next);
  updateUndoButtons();
  toast(`Redid: ${next.label}`);
}

const $ = id => document.getElementById(id);
const toast = (msg, ms = 1800) => { const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), ms); };
const fmt = s => { s=Math.max(0,s); const m=Math.floor(s/60), ss=(s%60); return `${m}:${ss.toFixed(1).padStart(4,'0')}`; };

function mediaUrl(file) {
  if (MEDIA_OVERRIDE) return MEDIA_OVERRIDE.replace(/\/?$/, '/') + file;
  return (plan.media_base || '').replace(/\/?$/, '/') + file;
}
function srcById(id) { return plan.sources.find(s => s.id === id); }
const txCache = {};
async function loadTranscript(srcId) {
  if (txCache[srcId]) return txCache[srcId];
  try {
    const r = await fetch(`${COURSE}/transcript-${srcId}.json?t=${Date.now()}`, {cache:'no-cache'});   // cutroom-16: the Pages CDN holds a URL for 10 min per edge; a fresh query string skips it
    txCache[srcId] = (await r.json()).cues || [];
  } catch { txCache[srcId] = []; }
  return txCache[srcId];
}
function segDur(s) {
  const v = VOICE && VOICE.segments && VOICE.segments[s.id];
  if (v) { const d = (v.take && v.take.duration) || v.synth_duration; if (d) return d; }
  if (s.type === 'slide') return s.duration || 0;
  if (s.type === 'board') return s.est_duration || 0;
  if (s.type === 'explainer' || s.type === 'outcome') return s.est_duration || 0;
  return Math.max(0, (s.out || 0) - (s.in || 0));
}

// ---------- load ----------
async function load() {
  const res = await fetch(`${COURSE}/plan.v2.json?t=${Date.now()}`, {cache:'no-cache'});   // cutroom-16: same, so a new revision shows on the first reload
  published = await res.json();
  const saved = localStorage.getItem(LS_KEY);
  if (saved) {
    try {
      const loc = JSON.parse(saved);
      if ((published.revision || 0) > (loc.revision || 0)) {
        // cutroom-15: a plan published since the local edits began wins (the owner's s01 and s08 were hidden behind a rev-9 copy);
        // the local copy is set aside, not lost
        localStorage.setItem(LS_KEY + '.stale', saved); localStorage.removeItem(LS_KEY);
        plan = structuredClone(published);
        toast(`Plan rev ${published.revision} published since your local edits (rev ${loc.revision || '?'}): loaded the published plan; the edits are set aside`, 7000);
      } else {
        plan = loc;
        // voices + media_base always follow the published plan (voice slate can grow after local edits began)
        plan.voices = published.voices;
        const pub = Object.fromEntries((published.segments||[]).map(x => [x.id, x]));
        for (const x of plan.segments) if (x.type === 'slide' && !x.text && pub[x.id] && pub[x.id].text) { x.text = structuredClone(pub[x.id].text); x.layout = pub[x.id].layout; }   // cutroom-20
        plan.media_base = published.media_base;
        toast('Loaded local edits (localStorage)');
      }
    }
    catch { plan = structuredClone(published); }
  } else {
    plan = structuredClone(published);
  }
  $('ctitle').textContent = plan.title;
  render();
}
function persist() { localStorage.setItem(LS_KEY, JSON.stringify(plan)); renderMeta(); }
function renderMeta() {
  const total = plan.segments.filter(s=>s.include).reduce((a,s)=>a+segDur(s),0);
  const inc = plan.segments.filter(s=>s.include).length;
  $('cmeta').textContent = `rev ${plan.revision} · ${inc}/${plan.segments.length} segments · est ${fmt(total)} · ${MEDIA_OVERRIDE?'LOCAL media':'GCS media'}`;
}

// ---------- timeline render ----------
function laneModel(s) {
  // returns {video:[cls,label], audio:[cls,label], overlay:[cls,label]}
  if (s.type === 'cut') return {
    video: ['v-src', `Ken on screen · ${s.source} ${fmt(s.in)}→${fmt(s.out)}`],
    audio: ['a-ken', 'Ken (source audio)'],
    overlay: s.lower_third ? ['o-lt', `lower-third: ${s.lower_third}`] : ['o-none','(none)'],
  };
  if (s.type === 'overdub') return {
    video: ['v-anim', 'CUSTOM ANIMATION (replaces his screen)'],
    audio: ['a-ken', `Ken (source audio) · ${s.source} ${fmt(s.in)}→${fmt(s.out)}`],
    overlay: s.lower_third ? ['o-lt', `lower-third: ${s.lower_third}`] : ['o-none','(none)'],
  };
  if (s.type === 'outcome') return {
    video: ['v-anim', `REAL-BARS ANIMATION (${(s.data||{}).symbol||'?'} · ${(s.data||{}).window||''})`],
    audio: ['a-vo', `synth VO (${s.voice||'?'}) · ~${s.est_duration||'?'}s`],
    overlay: ['o-none','(none)'],
  };
  const v = VOICE && VOICE.segments && VOICE.segments[s.id];
  const voiceLane = v && v.take ? ['a-take', `YOUR TAKE · ${fmt(v.take.duration)}${v.take.fitted ? ' · fitted' : ' · NOT FITTED'}`]
                                : ['a-vo', `synth VO (${s.voice||'?'}) · ~${Math.round(segDur(s))||'?'}s`];
  if (s.type === 'explainer') return {
    video: ['v-anim', 'CUSTOM ANIMATION'],
    audio: voiceLane,
    overlay: ['o-none','(none)'],
  };
  if (s.type === 'board') return {
    video: ['v-anim', 'BOARD · stills from the asset library, pinned to words'],
    audio: v && v.take ? voiceLane : ['a-vo', `recorded voice (${s.voice||'stand-in'}) · ~${Math.round(segDur(s))||'?'}s`],
    overlay: ['o-none','(none)'],
  };
  return { // slide
    video: ['v-slide', `slide: ${s.slide_id} · ${s.duration}s`],
    audio: ['a-sil', 'silence'],
    overlay: ['o-none','(none)'],
  };
}

// cutroom-18: pictures by convention (scripts/cutroom_board.py); an <img> that is not there removes itself
const THUMBS = {};   // sid -> true|false once known
function thumbUrl(s) { return `${COURSE}/thumbs/${s.id}.jpg?r=${plan.revision || 0}`; }
function slideUrl(s) { return `${COURSE}/slides/${s.slide_id}.jpg?r=${plan.revision || 0}`; }
function hasThumb(s) { if (s.type === 'slide' && !s.include && !s.text) return false; return THUMBS[s.id] !== false && (s.type === 'slide' || s.type === 'overdub' || s.type === 'explainer' || s.type === 'cut'); }
function thumbImg(s, cls) {
  if (s.type === 'slide' && s.text) return `<div class="cardwrap ${cls}">${cardHtml(s.text, s.layout)}</div>`;
  if (!hasThumb(s)) return '';
  return `<img class="${cls}" src="${thumbUrl(s)}" alt="" loading="lazy" onerror="THUMBS['${s.id}']=false; this.closest('.bt') ? (this.parentNode.textContent='${s.type === 'cut' ? "Ken's screen" : s.type}') : (this.parentNode.classList.remove('has-thumb'), this.remove())">`;
}
// cutroom-19: a slide the owner typed (segment.text = {kicker, title, body}); **word** turns amber
const LAYOUTS = {   // field roles per layout; the CSS values mirror scripts/render_slides.py
  setup:   { kicker: 'Kicker (small amber line above the title)', title: 'Title', subtitle: 'Subtitle (smaller, under the title)', body: 'Body (lines under the title)' },
  title:   { kicker: 'Kicker (above the title; usually empty)', title: 'Title (big)', subtitle: 'Under the title, smaller print', body: 'Lines under the rule' },
  chapter: { kicker: 'Chapter line (Chapter 2)', title: 'Chapter title', subtitle: 'Subtitle (dim, optional)', body: 'Extra lines (optional)' },
  maxim:   { kicker: 'Kicker (usually empty)', title: 'The maxim (type the quote marks)', subtitle: 'Attribution', body: 'Extra lines (optional)' },
  end:     { kicker: 'Kicker (usually empty)', title: 'Main line', subtitle: 'URL line', body: 'Small lines' },
};
function cardHtml(t, layout) {
  t = t || {}; layout = LAYOUTS[layout] ? layout : 'setup';
  const mark = x => escHtml(x || '').replace(/\*\*(.+?)\*\*/g, '<span class="amber">$1</span>');
  return `<div class="card L-${layout}">${t.kicker ? `<p class="ck">${mark(t.kicker)}</p>` : ''}
    <div class="ct">${t.title ? mark(t.title) : '<span class="ph">Your title</span>'}</div>
    ${t.subtitle ? `<p class="cs">${mark(t.subtitle)}</p>` : ''}
    ${t.body ? `<p class="cb">${mark(t.body)}</p>` : (layout === 'setup' ? '<p class="cb ph">The setup text for the next cut</p>' : '')}
    <div class="cbrand"><b>OWL</b> GROUP TRADING</div></div>`;
}
function fitCards() {
  document.querySelectorAll('.cardwrap').forEach(w => { const c = w.querySelector('.card'); if (c) c.style.transform = `scale(${w.clientWidth / 1920})`; });
}
window.addEventListener('resize', fitCards);
function nextCardIds() {
  const n = plan.segments.filter(s => s.type === 'slide' && s.text).length + 1;
  let k = n; while (plan.segments.some(s => s.id === `x${String(k).padStart(2,'0')}` || s.slide_id === `card-${String(k).padStart(2,'0')}`)) k++;
  return { id: `x${String(k).padStart(2,'0')}`, slide_id: `card-${String(k).padStart(2,'0')}` };
}
function insertCardAfter(i) {
  const ids = nextCardIds();
  snapshot(`insert card ${ids.slide_id} after ${plan.segments[i].label}`);
  plan.segments.splice(i + 1, 0, { id: ids.id, type: 'slide', include: true, label: 'Setup card', slide_id: ids.slide_id, duration: 8,
    layout: 'setup', text: { kicker: '', title: '', subtitle: '', body: '' }, status: 'owner card typed in the cutroom; the png is rendered by render_slides.py from this text' });

function renderBoard() {
  const b = $('board'); b.innerHTML = '';
  const inc = plan.segments.filter(s => s.include);
  $('boardwrap').style.display = inc.length ? 'block' : 'none';
  $('boardmeta').textContent = `· ${inc.length} segments · ${inc.filter(s=>s.type==='slide').length} slide cards · est ${fmt(inc.reduce((a,s)=>a+segDur(s),0))}`;
  let t = 0;
  plan.segments.forEach((s, i) => {
    if (!s.include) return;
    const el = document.createElement('div');
    el.className = `bt type-${s.type}` + (i===selIdx?' sel':'');

}

function render() {

  renderMeta();
  renderBoard();

  let t = 0;
  plan.segments.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = `seg type-${s.type}` + (i===selIdx?' sel':'') + (s.include?'':' excluded');

// ---------- animation overlay ----------
// Convention, so no plan field is needed and nothing can be lost on export:
// an animation for segment <id> lives at `${COURSE}/anim-<id>.html` and exposes
// a deterministic renderFrame(t) plus ANIM_DURATION. If it is not there, the
// toggle simply never appears.
let animLayer = null, animMode = 'source', animDur = 40, animReady = false, animRaf = null;

// The iframe stays intrinsically 1280x720 and is scaled by transform only.
// Setting an explicit height as well scaled it twice. The video can also be
// clamped by max-height on a short viewport, so fit to whichever axis binds and
// centre on the other — otherwise the overlay drifts off his picture.
function fitAnim() {
  const f = animLayer, v = $('vid') || $('vstack');
  if (!f || !v) return;
  const w = v.clientWidth, h = v.clientHeight;
  if (!w || !h) return;
  const k = Math.min(w / 1280, h / 720);
  const dx = (w - 1280 * k) / 2, dy = (h - 720 * k) / 2;
  f.style.transform = `translate(${dx}px, ${dy}px) scale(${k})`;
  const pl = $('pipLayer');
  if (pl) pl.style.transform = `translate(${dx + PIP.x * k}px, ${dy + PIP.y * k}px) scale(${k})`;
}

// ---------- picture-in-picture (cutroom-17) ----------
// Mirrors build_v2 PIP_W/PIP_X/PIP_Y. The crop is the source's ffmpeg string (w:h:x:y in iw/ih terms).
const PIP = { x: 950, y: 22, w: 300, h: 169 };
function pipCrop(s) {
  if (!s.pip) return null;
  const src = srcById(s.source), c = src && src.pip && src.pip.crop;
  if (!c || !/^[\d.iwh*/+\-:() ]+$/.test(c)) return null;
  return (vw, vh) => c.split(':').map(e => Function('iw', 'ih', `return (${e});`)(vw, vh));
}
function paintPip(s) {
  const pl = $('pipLayer'), crop = pipCrop(s);
  if (!pl || !crop || !videoEl || !videoEl.videoWidth) return;
  const [cw, ch, cx, cy] = crop(videoEl.videoWidth, videoEl.videoHeight);
  pl.getContext('2d').drawImage(videoEl, cx, cy, cw, ch, 0, 0, PIP.w, PIP.h);
}

function animTime(s) {
  if (!videoEl) return 0;
  const el = videoEl.currentTime - s.in;
  if (animMode === 'stretch') {
    const span = Math.max(0.1, s.out - s.in);
    return Math.max(0, Math.min(animDur, animDur * (el / span)));
  }
  return Math.max(0, Math.min(animDur, el));   // 1:1, holds on the last frame
}

// Every scene opens on a title card fading up from black, so renderFrame(0) is
// an empty frame. Park on a representative frame whenever the playhead is
// outside the segment; inside it, always show the truthful mapped frame.
const ANIM_POSTER = 0.62;
function paintAnim(s) {
  if (!animReady || animMode === 'source' || !animLayer) return;
  const w = animLayer.contentWindow;
  if (!w || typeof w.renderFrame !== 'function') return;
  const ct = videoEl ? videoEl.currentTime : 0;
  const inside = ct >= s.in && ct <= s.out;
  w.renderFrame(inside ? animTime(s) : animDur * ANIM_POSTER);
  paintPip(s);
}

// rAF only while the video is actually rolling; timeupdate alone is ~4Hz and
// the animation stutters against his voice.
function animLoop(s) {
  if (animRaf) cancelAnimationFrame(animRaf);
  animRaf = null;
  if (animMode === 'source' || !animReady || !videoEl || videoEl.paused) { paintAnim(s); return; }
  paintAnim(s);
  animRaf = requestAnimationFrame(() => animLoop(s));
}

function setupAnim(s) {
  animLayer = $('animLayer');
  animReady = false; animMode = 'source';
  if (animRaf) { cancelAnimationFrame(animRaf); animRaf = null; }
  const tabs = $('viewtabs'), stack = $('vstack');
  if (!animLayer || !tabs) return;
  stack.classList.remove('anim');
  stack.classList.toggle('pip', !!pipCrop(s));
  tabs.style.display = 'none';

  animLayer.onload = () => {
    const w = animLayer.contentWindow;
    if (!w || typeof w.renderFrame !== 'function') return;   // 404 or not an anim
    animReady = true;
    animDur = w.ANIM_DURATION || 40;
    tabs.style.display = 'flex';
    const span = Math.max(1, s.out - s.in);
    $('animCov').textContent =
      `draft ${animDur.toFixed(0)}s · segment ${fmt(span)} · covers ${Math.round(animDur / span * 100)}%`;
    fitAnim();
    tabs.querySelectorAll('button[data-view]').forEach(b => b.onclick = () => {
      animMode = b.dataset.view;
      tabs.querySelectorAll('button[data-view]').forEach(x => x.classList.toggle('on', x === b));
      stack.classList.toggle('anim', animMode !== 'source');
      fitAnim();
      animLoop(s);
    });
  };
  animLayer.src = `${COURSE}/anim-${s.id}.html`;
}
window.addEventListener('resize', fitAnim);

// ---------- sound check: which speaker, is anything leaving the player, a report to paste ----------
const SC = { ctx: null, an: null, src: null, raf: null, peak: 0, sink: '', notes: [] };
function scNote(html) { SC.notes.push(html); const d = $('diag'); if (d) { d.innerHTML = SC.notes.slice(-14).join('\n'); d.scrollTop = d.scrollHeight; } }
async function scContext() {

}
async function scApplySink(el) {

  try { await el.setSinkId(SC.sink || ''); scNote(`player output → <b>${escHtml(scSinkLabel())}</b>`); }

}
// the owner's choices, kept on this machine: the microphone for every recording, the speaker for every replay and test
const DEV = { get mic() { try { return localStorage.getItem('cutroom.mic') || ''; } catch { return ''; } }, set mic(v) { try { localStorage.setItem('cutroom.mic', v || ''); } catch {} },
              get out() { try { return localStorage.getItem('cutroom.out') || ''; } catch { return ''; } }, set out(v) { try { localStorage.setItem('cutroom.out', v || ''); } catch {} } };
async function listDevices() {

  mic.value = ins.some(d => d.deviceId === DEV.mic) ? DEV.mic : ''; out.value = outs.some(d => d.deviceId === DEV.out) ? DEV.out : '';

async function devGrant() {

async function micTest() {

    const m = $('meter'); if (m) m.querySelector('i').style.width = Math.min(100, rms * 300) + '%'; if (Date.now() - t0 < 3000) requestAnimationFrame(tick); else res(); }; tick(); });

function scSinkLabel() { const sel = $('outSel'); return sel && sel.selectedOptions[0] ? sel.selectedOptions[0].textContent : 'default output'; }
function scMeterOn(node, label) {

  const tick = () => { SC.an.getByteTimeDomainData(td); let sum = 0; for (const x of td) { const v = (x - 128) / 128; sum += v * v; } const rms = Math.sqrt(sum / td.length); SC.peak = Math.max(SC.peak, rms);
    const m = $('outMeter'); if (m) { m.querySelector('i').style.width = Math.min(100, rms * 300) + '%'; } const t = $('outMeterTxt'); if (t) t.textContent = `${label} · ${rms.toFixed(3)} (peak ${SC.peak.toFixed(2)})`;
    if (Date.now() - t0 < 60000) SC.raf = requestAnimationFrame(tick); };

async function scTone() {
  const ctx = await scContext();
  const osc = ctx.createOscillator(); osc.frequency.value = 440; const g = ctx.createGain(); g.gain.value = 0.25; osc.connect(g);
  scMeterOn(g, 'tone'); osc.start(); osc.stop(ctx.currentTime + 1.0);
  scNote(`test tone → <b>${escHtml(scSinkLabel())}</b> · AudioContext ${ctx.state} @ ${ctx.sampleRate} Hz${ctx.sinkId !== undefined ? ' · ctx sink ' + escHtml(String(ctx.sinkId) || 'default') : ''}`);
  setTimeout(() => scNote(SC.peak > 0.02 ? '<span class="good">the tone left the player (meter moved). No sound = the output device or its volume.</span>' : '<span class="bad">the tone did not reach the meter: the AudioContext is not running (autoplay policy) — press the button again</span>'), 1300);
}
async function scSample() {
  const el = new Audio('/media/vo-ava.mp3?v=' + Date.now()); el.preload = 'auto';
  await scApplySink(el);
  el.onplaying = () => scNote(`Ava sample <span class="good">playing</span> · volume ${el.volume} · muted ${el.muted}`);
  el.onerror = () => scNote(`<span class="bad">Ava sample did not load (${el.error ? el.error.code : '?'}): is inbox/vo-ava.mp3 there?</span>`);
  try { await el.play(); } catch (e) { scNote(`<span class="bad">play() refused: ${escHtml(e.name)} ${escHtml(e.message)}</span>`); }

async function scLoopback() {

  const ctx = await scContext();
  if (!SC.src || SC.src.mediaElement !== a) { try { SC.src = ctx.createMediaElementSource(a); } catch (e) { scNote(`<span class="bad">cannot tap the player: ${escHtml(e.message)}</span>`); return; } }

}
async function scReport() {
  const a = VS.audio || {}; const ctx = SC.ctx;
  let outs = [], ins = [];
  try { const d = await navigator.mediaDevices.enumerateDevices(); outs = d.filter(x => x.kind === 'audiooutput').map(x => x.label || x.deviceId.slice(0, 8)); ins = d.filter(x => x.kind === 'audioinput').map(x => x.label || x.deviceId.slice(0, 8)); } catch {}

    `cutroom ${BUILD} · ${new Date().toISOString()}`,

    `page ${location.href} · secure ${window.isSecureContext} · visible ${document.visibilityState}`,
    `player src ${(a.src || '').slice(0, 90)} · readyState ${a.readyState} · networkState ${a.networkState} · error ${a.error ? a.error.code : 'none'}`,
    `player paused ${a.paused} · currentTime ${a.currentTime} · duration ${a.duration} · volume ${a.volume} · muted ${a.muted} · sinkId "${a.sinkId === undefined ? 'n/a' : a.sinkId}"`,

async function refreshVoice() {
  if (!LOCAL_APP) return;
  try { VOICE = await (await fetch(`/api/cutroom/${encodeURIComponent(COURSE)}/voice`, {cache:'no-store'})).json(); if (VOICE.error) VOICE = null; }
  catch { VOICE = null; }

// ---------- transcript panel ----------
let txCues = [];
let txSeg = null;
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function renderTx(cues, s) {
  txCues = cues; txSeg = s;
  const q = $('txq');
  if (q) {
    q.oninput = () => buildTxList(q.value);
    q.onkeydown = (e) => { if (e.key === 'Escape') { q.value=''; buildTxList(''); q.blur(); } e.stopPropagation(); };
  }

}
function buildTxList(query) {
  const box = $('tx'); if (!box) return;
  const s = txSeg;
  if (!txCues.length) { box.innerHTML = '<div class="cue"><span class="cx">No transcript available for this source.</span></div>'; $('txcnt').textContent=''; return; }
  const ql = (query||'').trim().toLowerCase();
  const rows = [];
  let matches = 0;
  txCues.forEach((c, i) => {
    const hit = ql && c.x.toLowerCase().includes(ql);
    if (ql && !hit) return;
    if (hit) matches++;
    const text = ql ? c.x.replace(new RegExp(escRe(query.trim()), 'gi'), m => `<mark>${m}</mark>`) : c.x;
    rows.push(`
    <div class="cue${(c.t < s.out && c.e > s.in) ? ' inrange' : ''}" data-i="${i}" data-t="${c.t}">
      <span class="ct">${fmt(c.t)}</span>
      <span class="cx">${text}</span>
      <span class="setbtns">
        <button data-set="in" title="Set IN to ${fmt(c.t)}">IN</button>
        <button data-set="out" title="Set OUT to ${fmt(c.e)}">OUT</button>
      </span>
    </div>`);
  });
  $('txcnt').textContent = ql ? `${matches} line${matches===1?'':'s'}` : `${txCues.length} lines`;
  box.innerHTML = rows.length ? rows.join('') : '<div class="cue"><span class="cx">No matches.</span></div>';
  box.querySelectorAll('.cue').forEach(el => {
    el.onclick = (e) => {
      if (e.target.dataset.set) return;
      if (videoEl && el.dataset.t !== undefined) { videoEl.currentTime = parseFloat(el.dataset.t); stopAt = null; videoEl.play(); }
    };
  });
  box.querySelectorAll('button[data-set]').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      const cue = txCues[parseInt(b.closest('.cue').dataset.i)];
      const seg = plan.segments[selIdx];
      if (b.dataset.set === 'in') { snapshot(`set IN from transcript (${fmt(cue.t)})`); seg.in = cue.t; if (seg.out <= seg.in) seg.out = seg.in + 0.5; }
      else { snapshot(`set OUT from transcript (${fmt(cue.e)})`); seg.out = cue.e; if (seg.in >= seg.out) seg.in = Math.max(0, seg.out - 0.5); }

// Scroll ONLY the transcript box. scrollIntoView() walks every scrollable
// ancestor, which dragged the whole inspector up on each timeupdate and took
// the video with it.
function scrollCueIntoView(box, el, mode) {
  const top = el.offsetTop - box.offsetTop;
  if (mode === 'center') {
    box.scrollTop = top - (box.clientHeight - el.offsetHeight) / 2;
    return;
  }
  if (top < box.scrollTop) box.scrollTop = top;
  else if (top + el.offsetHeight > box.scrollTop + box.clientHeight)
    box.scrollTop = top + el.offsetHeight - box.clientHeight;
}
function highlightNow() {
  const box = $('tx'); if (!box || !videoEl || !txCues.length) return;
  const ct = videoEl.currentTime;
  const idx = txCues.findIndex(c => c.t <= ct && ct < c.e);
  box.querySelectorAll('.cue.now').forEach(el => el.classList.remove('now'));
  if (idx >= 0) {
    const el = box.querySelector(`.cue[data-i="${idx}"]`);
    if (el) { el.classList.add('now'); if (!videoEl.paused) scrollCueIntoView(box, el, 'nearest'); }
  }
}

// ---------- export ----------
function exportJson(download) {
  plan.edited = new Date().toISOString();
  plan.edited_with = BUILD;
  const txt = JSON.stringify(plan, null, 2);
  if (download) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
    a.download = `${COURSE}.plan.v2.edited.json`;
    a.click();
    toast('Exported. Send the file (or paste the copy) to coursecraft.');
  } else {
    navigator.clipboard.writeText(txt).then(()=>toast('Plan JSON copied to clipboard'));
  }
}
$('exportBtn').onclick = () => exportJson(true);

// ---------- local app (scripts/cutroom_serve.py): save straight to the repo ----------
let LOCAL_APP = false;
async function saveToRepo() {
  if (!LOCAL_APP) return;
  plan.edited = new Date().toISOString();
  plan.edited_with = BUILD;
  try {
    const r = await fetch(`/api/cutroom/${encodeURIComponent(COURSE)}/plan`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(plan, null, 2) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    persist();

$('saveBtn').onclick = saveToRepo;
document.addEventListener('keydown', e => {

});
fetch('/api/cutroom/ping', {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(j => {
  if (!j || !j.ok) return;
  LOCAL_APP = true;
  $('saveBtn').style.display = '';
  refreshVoice().then(() => { if (VOICE) { render(); if (selIdx >= 0) select(selIdx); } });
  const sel = $('courseSel');
  sel.innerHTML = (j.cutrooms || []).map(c => `<option${c===COURSE?' selected':''}>${c}</option>`).join('');
  sel.style.display = '';
  sel.onchange = () => { const q = new URLSearchParams(location.search); q.set('course', sel.value); q.delete('media');
    if ((j.local_media || []).includes(sel.value)) q.set('media', '/media/');
    location.search = q.toString(); };
}).catch(() => {});
$('copyBtn').onclick = () => exportJson(false);
$('resetBtn').onclick = () => {
  if (confirm('Discard ALL local edits and reload the published plan?')) {
    localStorage.removeItem(LS_KEY); plan = structuredClone(published); selIdx=-1;
    undoStack.length = 0; redoStack.length = 0; updateUndoButtons();
    $('insp').style.display='none'; $('noSel').style.display='block';
    render(); toast('Reset to published');
  }
};

// ---------- keys ----------
document.addEventListener('keydown', e => {
  if (['TEXTAREA','INPUT','SELECT'].includes(document.activeElement.tagName)) return;
  if (e.key==='ArrowDown'){ e.preventDefault(); select(Math.min(plan.segments.length-1, selIdx+1)); }
  if (e.key==='ArrowUp'){ e.preventDefault(); select(Math.max(0, selIdx-1)); }
  if (e.key===' ' && videoEl){ e.preventDefault(); videoEl.paused ? videoEl.play() : videoEl.pause(); }
  if (e.key==='x' && selIdx>=0){ const s=plan.segments[selIdx]; snapshot(`${s.include?'exclude':'include'} ${s.label}`); s.include=!s.include; persist(); select(selIdx); }
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); }
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); doRedo(); }
});
document.getElementById('undoBtn').onclick = doUndo;
document.getElementById('redoBtn').onclick = doRedo;

load();
