const ease=u=>{u=clamp(u,0,1);return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;};
const lerp=(a,b,u)=>a+(b-a)*u;

function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}

function herd(n,seed,x,y,w,h){const r=rng(seed);const pts=[];for(let i=0;i<n;i++)pts.push({x:x+r()*w,y:y+r()*h,p:r()*6.28,q:r()*6.28});return pts;}

function defn(t,t0,x,y,w,title,lines,o={}){const u=pr(t,t0,.6);if(u<=0)return '';const lh=o.lh||28,h=(o.pad||22)*2+34+lines.length*lh;let s=rect(x,y,w,h,{r:8,s:o.s||FG,sw:2,f:o.f||'rgba(255,255,255,.03)',o:u});

function timeline(t,t0,x,y,w,h,weeks,px,o={}){const a=op(t,t0,.8);if(a<=0||!px.length)return '';const d0=Date.parse(px[0][0]),d1=Date.parse(px[px.length-1][0]);const X=iso=>x+(Date.parse(iso)-d0)/(d1-d0)*w;

    const rows=[['XLK','buy',INV],['VUG','buy',INV],['EFA','buy',INV],['EWY','below',CASH]];rows.forEach((r,i)=>{const c=op(t,496+i*1.5,.4)*b;s+=txt(780,298+i*30,r[0],{sz:20,c:PRICE,o:c});s+=txt(880,298+i*30,r[1],{sz:20,c:r[2],o:c});});
    if(t>=512) s += e2_lab(t,512,960,388,'South Korea',{sz:18,c:NOTE});

  s += focus(t,[[17,300,180],[50,360,310],[119,160,486],[199,210,211],[267,350,211],[316,210,293],[367,630,457],[382,490,457],[457,490,293],[496,900,262]]);
  return s;
}

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  let cap = '', sub = '';
  for (const b of BEATS) if (t >= b[0]) { cap = b[1]; sub = b[2] || ''; }
  $('cap').innerHTML = cap; $('sub').textContent = sub;
  $('svg').innerHTML = WRAP[0] + draw(t) + WRAP[1];
  const f = $('fade');
  f.style.opacity = t < 0.5 ? 1 - t / 0.5 : (ANIM_DURATION - t < 0.6 ? 1 - (ANIM_DURATION - t) / 0.6 : 0);
};
renderFrame(0);
