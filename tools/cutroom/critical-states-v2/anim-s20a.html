function herd(n,seed,x,y,w,h){const r=rng(seed);const pts=[];for(let i=0;i<n;i++)pts.push({x:x+r()*w,y:y+r()*h,p:r()*6.28,q:r()*6.28});return pts;}

const bridge=(t,t0,s,o={})=>{const a=op(t,t0+.4,.6);if(a<=0)return '';const x=o.x||40,y=headY(o)+(o.dy||33);return txt(x,y,'in trading:',{sz:o.sz||24,c:MUT,o:a,cls:'hand'})+txt(x+(o.gap||128),y,s,{sz:o.sz||24,c:o.c||FG,o:a*.92,cls:'hand'});};   // the metaphor named as the trade, under the head, for the whole scene (lesson rule 8)   // under a three-line caption the question steps down

function focus(t,pts,o={}){let cur=null,prev=null;for(const p of pts){if(t>=p[0]){prev=cur;cur=p;}}if(!cur)return '';const age=t-cur[0];if(age>(o.hold||5))return '';
  const u=prev?pr(t,cur[0],.6):1;const x=prev?lerp(prev[1],cur[1],u):cur[1],y=prev?lerp(prev[2],cur[2],u):cur[2];const r=(o.r||22)+Math.sin(t*4)*2;const a=op(t,cur[0],.3)*(age>(o.hold||5)-.6?((o.hold||5)-age)/.6:1);

const BEATS = [[1.4, "So this was 2020. This was the moment that it <em>breached</em> this long-term 270", "SPY, nine-day bars, TC2000"], [14.5, "Remember, that's a 2,500-day, which is like <em>five years</em>: a five-year moving regression line", ""], [22.1, "Notice what happened here. Yikes", ""], [32.6, "It went another minus <em>25 percent</em>: from 285 to 220, 65 dollars", ""], [43.2, "65 over 285 is minus 25, just from where it crossed", ""], [46.7, "Then it crossed back over. Ah", ""], [53.0, "That's where the second mouse is: a <em>kata 2</em>. This was all first-mouse action", ""], [67.8, "This is where the third mouse starts adding back in, and somewhere in here the fourth and fifth", ""], [78.2, "This time it only went a small distance below; that one was 25 percent", ""], [95.0, "Look at the <em>symmetry</em>. If the short-term traders have the power to move it that far from the long-term average…", "Luis, a student."], [109.1, "…there's the potential for the long-term average to be the opposite direction. That's what happened in COVID", "Luis, a student."], [130.1, "Iran war. That was a surprise", ""], [154.0, "If this looked like 2020, it's a 25 percent move below this. That's 640", ""], [168.5, "25 percent of that is <em>160</em>", ""], [190.5, "Using the numbers on the chart it would be <em>500</em> even. 780 minus 640, and down to 500", "Luis, a student."], [200.6, "Holy smokes", ""]];

  return WARP[WARP.length - 1][1]; };

const T=i=>BEATS[Math.min(i,BEATS.length-1)][0];

const between=(t,i,j)=>t>=T(i)&&t<T(j);
const ph=(t,i,j)=>op(t,T(i),.5)*(j==null?1:1-op(t,T(j)-.4,.4));

function walk(keys,seed,amp){const r=rng(seed);const N=240;const nz=[];let a=0;for(let i=0;i<=N;i++){a=a*0.82+(r()-.5);nz.push(a);}

function lv(price,label,c,o,x0,x1,left){const y=PY(price);const a=x0==null?IX:x0,b=x1==null?IX+IW:x1;return line(a,y,b,y,{s:c,sw:2,dash:'7 5',o})+(label?(left?tag(a-6,y,label,c,o,'end'):tag(b+6,y,label,c,o)):'');}
// a vertical bracket between two prices at x
function vbr(x,p0,p1,label,c,o){const y0=PY(p0),y1=PY(p1);return path(`M${x+8} ${y0} L${x} ${y0} L${x} ${y1} L${x+8} ${y1}`,{s:c,sw:2.5,o})+(label?txt(x-10,(y0+y1)/2+6,label,{a:'end',c,sz:17,o,w:600}):'');}

const PX=x=>IX+x*S, PYX=y=>IY+y*S;
const base=(o,k)=>`<image href="${IMGS[k||0]}" x="${IX}" y="${IY}" width="${IW}" height="${IH}" preserveAspectRatio="none" opacity="${o==null?1:o}"/>`;
const PY=p=>IY+((1071.78)+(-2.0335)*p-(70))*S;

// two of his charts: the 2020 view (PY, its own axis) until he scrolls to today's (PYC) on "the opposite direction"
const PYC=p=>IY+((1061.86)+(-1.2351)*p-(70))*S;
const B20=[285,430], LOW20=[288,555], BACK20=[345,385], M3=[420,330], D22a=[680,262], D22b=[730,290];
const at=p=>[PX(p[0]),PYX(p[1])];
function lvc(price,label,c,o,x0,x1,left){const y=PYC(price);return line(x0,y,x1,y,{s:c,sw:2,dash:'7 5',o})+(label?(left?tag(x0-6,y,label,c,o,'end'):tag(x1+6,y,label,c,o)):'');}
function draw(t){
  const now=after(t,10);
  let s=GDEF+base(.95,now?1:0);
  s += head(t,0.2,'What happened when the 270 broke?') + bridge(t,0.2,'2020: 285 to 220 under the 270; today that is 640 to 500');
  if (!now){
    if (after(t,0)){ const o=op(t,T(0),.5); s += ring(...at(B20),16,RL270,o) + tag(PX(270),PYX(470),'2020: the breach',RL270,o,'end'); }
    if (after(t,3)){ const o=op(t,T(3),.5); s += lv(285,'285',FG,o,PX(200),PX(805)) + lv(220,'220',RISK,o,PX(200),PX(805)) + vbr(PX(192),285,220,'',RISK,o) + ring(...at(LOW20),12,RISK,o); }
    if (after(t,5)){ const o=op(t,T(5),.5); s += ring(...at(BACK20),13,SAFE,o) + tag(PX(365),PYX(360),'crossed back: kata 2',SAFE,o); }
    if (after(t,7)){ const o=op(t,T(7),.5); s += ring(...at(M3),12,MOUSE,o); }
    if (after(t,8)){ const o=op(t,T(8),.5); s += ring(...at(D22a),12,KEY,o) + ring(...at(D22b),12,KEY,o) + tag(PX(690),PYX(330),'only a small distance below',KEY,o,'end'); }
  } else {
    const o=op(t,T(10),.5);
    if (after(t,12)){ const o2=op(t,T(12),.5); s += lvc(640,'640',RL270,o2,PX(560),PX(805)); }
    if (after(t,13)){ const o2=op(t,T(13),.5); s += lvc(480,'480',RISK,o2,PX(560),PX(805),true); }
    if (after(t,14)){ const o2=op(t,T(14),.5); s += lvc(500,'500',KEY,o2,PX(560),PX(805)); }
    s += tag(PX(20),PYX(20),'today',FG,o);
  }
  if (after(t,1)){ const o=op(t,T(1),.5); s += chip(RX,148,'the 270 here ≈ five years',{s:RL270,c:RL270,o,sz:18}); }
  s += readout(RX,205,'2020, below the 270','285 → 220',{o:after(t,3)?op(t,T(3),.5):0,sz:30},FG);
  s += rc(t,4,272,'65 over 285 = −25 %',{c:RISK,sz:21,w:600});
  s += rc(t,6,300,'2nd mouse: the kata 2',{c:MOUSE,sz:18});
  s += rc(t,7,322,'3rd, 4th, 5th: adding back',{c:MOUSE,sz:18});
  s += defn(t,T(9),RX,350,330,'Symmetry (Luis)',['short-term traders push it far','from the long-term average…','the average can reverse'],{lh:21,pad:10,lsz:17});
  s += rc(t,13,494,'640 − 25 % = 480',{c:RISK,sz:21,w:600});
  s += rc(t,14,516,'Luis: 500 even, on the chart',{c:KEY,sz:18});
  s += aside(t,T(15),PX(560),PYX(80),'holy smokes',{sz:28});
  s += focus(t,[[T(0),...at(B20)],[T(1),RX+120,166],[T(3),...at(LOW20)],[T(4),RX+120,266],[T(5),...at(BACK20)],[T(7),...at(M3)],[T(8),...at(D22a)],[T(9),RX+150,405],[T(12),PX(700),PYC(640)],[T(13),PX(700),PYC(480)],[T(14),PX(700),PYC(500)],[T(15),PX(600),PYX(80)]]);
  return s;
}

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  const tv = t; t = warpT(t);
  let cap = '', sub = '';
  for (const b of BEATS) if (t >= b[0]) { cap = b[1]; sub = b[2] || ''; }
  $('cap').innerHTML = cap; $('sub').textContent = sub;
  $('svg').innerHTML = WRAP[0] + draw(t) + WRAP[1];
  const f = $('fade');
  f.style.opacity = tv < 0.5 ? 1 - tv / 0.5 : (ANIM_DURATION - tv < 0.6 ? 1 - (ANIM_DURATION - tv) / 0.6 : 0);
};
renderFrame(0);
