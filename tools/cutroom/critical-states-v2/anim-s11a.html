MP4q/wCjHzrQfsw/ir/ozjRFX//Z'], S=0.57895, IX=30, IY=150, IW=1160*0.57895, IH=330;
const PX=x=>IX+x*S, PYX=y=>IY+y*S;
const base=(o,k)=>`<image href="${IMGS[k||0]}" x="${IX}" y="${IY}" width="${IW}" height="${IH}" preserveAspectRatio="none" opacity="${o==null?1:o}"/>`;
const PY=p=>IY+((3648.88)+(-4.4628)*p-(110))*S;

const NOW=[1065,465], S30PK=[85,445], DRB=[190,540], R10B=[260,490], TAIL=[135,560], TOP=[1060,120];
const at=p=>[PX(p[0]),PYX(p[1])];
function draw(t){
  let s=GDEF+base(.95);
  s += head(t,0.2,'Where is the next support?') + bridge(t,0.2,'the ladder down is the stack; the way back up is the same stack');
  if (after(t,0)){ const o=op(t,T(0),.5); s += glow(arrow(PX(1065),PYX(150),PX(1065),PYX(450),{s:RISK,sw:4,o})); }
  if (after(t,1)){ const o=op(t,T(1),.5); s += ring(...at(NOW),12,KEY,o) + tag(PX(1050),PYX(500),'already there',KEY,o,'end'); }
  s += rc(t,1,165,'the ladder down',{c:MUT,sz:17});
  s += rc(t,2,195,'resistance, now support',{c:KEY,sz:19,w:600});
  if (after(t,3)){ const o=op(t,T(3),.5); s += lv(690,'690',RL30,o); s += ring(...at(S30PK),14,RL30,o); }
  s += rc(t,3,223,'the SMA30 peak',{c:RL30,sz:19,w:600}) + txt(RX+330,223,'690',{sz:19,c:RL30,o:after(t,7)?op(t,T(7),.5):0,w:600,a:'end'});
  if (after(t,4)){ const o=op(t,T(4),.5); s += ring(...at(DRB),14,DRAG,o); }
  s += rc(t,4,251,'the bottom of the dragon',{c:DRAG,sz:19,w:600});
  if (after(t,5)){ const o=op(t,T(5),.5); s += ring(...at(R10B),14,RL10,o); }
  s += rc(t,5,279,'the bottom of the RL10',{c:RL10,sz:19,w:600}) + txt(RX+330,279,'660',{sz:19,c:RL10,o:after(t,7)?op(t,T(7),.5):0,w:600,a:'end'});
  if (after(t,6)){ const o=op(t,T(6),.5); s += ring(...at(TAIL),14,RISK,o); }
  s += rc(t,6,307,'the fat tail',{c:RISK,sz:19,w:600});
  if (after(t,7)){ const o=op(t,T(7),.5); s += lv(660,'660',RL10,o); s += txt(RX,336,'645 · 630 by ear, not in the captions',{sz:15,c:MUT,o}); }
  if (after(t,8)){ const o=op(t,T(8),.5); const u=pr(t,T(8),1.5); s += glow(arrow(PX(1085),PYX(460),PX(1085),PYX(lerp(460,140,u)),{s:SAFE,sw:4,o})); }
  s += defn(t,T(9),RX,362,330,'The recovery path',['up the stack: RL, PSAR, SMA30','dragon tip, PSAR flip, RL10','over the top: the last tranche'],{lh:26,pad:14});
  if (after(t,10)){ const o=op(t,T(10),.5); s += ring(...at(TOP),16,SAFE,o); }
  if (after(t,12)){ const o=op(t,T(12),.5); s += tag(PX(1040),PYX(95),'2027: above this',SAFE,o,'end'); }
  s += focus(t,[[T(0),PX(1065),PYX(300)],[T(1),...at(NOW)],[T(3),...at(S30PK)],[T(4),...at(DRB)],[T(5),...at(R10B)],[T(6),...at(TAIL)],[T(7),PX(600),PY(660)],[T(8),PX(1085),PYX(300)],[T(9),RX+150,420],[T(10),...at(TOP)],[T(13),RX+150,470]]);
  return s;
}

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  const tv = t; t = warpT(t);
  let cap = '', sub = '';
  for (const b of BEATS) if (t >= b[0]) { cap = b[1]; sub = b[2] || ''; }
  $('cap').innerHTML = cap; $('sub').textContent = sub;
  $('svg').innerHTML = WRAP[0] + draw(t) + WRAP[1];
  const f = $('fade');
  f.style.opacity = tv < 0.5 ? 1 - tv / 0.5 : (ANIM_DURATION - tv < 0.6 ? 1 - (ANIM_DURATION - tv) / 0.6 : 0);
};
renderFrame(0);
