function herd(n,seed,x,y,w,h){const r=rng(seed);const pts=[];for(let i=0;i<n;i++)pts.push({x:x+r()*w,y:y+r()*h,p:r()*6.28,q:r()*6.28});return pts;}

function focus(t,pts,o={}){let cur=null,prev=null;for(const p of pts){if(t>=p[0]){prev=cur;cur=p;}}if(!cur)return '';const age=t-cur[0];if(age>(o.hold||5))return '';

const BEATS = [[1.4, "Chart three: the <em>magnitude</em> of that move when it broke this support", "the 3d (fast) panel of his health check"], [10.8, "Here's the next piece of resistance. We're already there", ""], [18.7, "What was once <em>resistance</em> then became <em>support</em>. We're going to see if that is support", ""], [27.9, "More likely this was the <em>peak of the SMA30</em> before it took off on this run, and it's now starting to roll over", ""], [44.1, "The <em>bottom of the dragon</em>, which often acts as a support level", ""], [51.2, "The <em>bottom of the RL10</em>, which acts as a support level", ""], [57.2, "And the absolute limit of price on that <em>fat tail</em>", ""], [66.0, "If that one breaks, which is at <em>630</em>, <em>645</em>, <em>660</em>, and this is <em>690</em>", ""], [89.8, "That's what the downside looks like. The recovery will happen fast", ""], [103.5, "Then it has to start <em>fighting its way back up the stack</em>", ""], [115.0, "the SMA30, the tip of the dragon, the PSAR flip, the RL10", ""], [127.1, "It would have to start really proving itself here", ""], [136.7, "It has to get above this in 2027 and beyond", ""], [149.0, "If it breaks through that, you add your <em>final tranche</em> of long-term money", "the ladder down is the stack; the way back up is the same stack"]];

  return WARP[WARP.length - 1][1]; };

const between=(t,i,j)=>t>=T(i)&&t<T(j);

function draw(t){
  let s=GDEF+base(.95);
  s += head(t,0.2,'Where is the next support?') + bridge(t,0.2,'the ladder down is the stack; the way back up is the same stack');
  if (after(t,0)){ const o=op(t,T(0),.5); s += glow(arrow(PX(1065),PYX(150),PX(1065),PYX(450),{s:RISK,sw:4,o})); }

  s += rc(t,1,165,'the ladder down',{c:MUT,sz:17});
  s += rc(t,2,195,'resistance, now support',{c:KEY,sz:19,w:600});
  if (after(t,3)){ const o=op(t,T(3),.5); s += lv(690,'690',RL30,o); s += ring(...at(S30PK),14,RL30,o); }

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  const tv = t; t = warpT(t);
  let cap = '', sub = '';
  for (const b of BEATS) if (t >= b[0]) { cap = b[1]; sub = b[2] || ''; }
  $('cap').innerHTML = cap; $('sub').textContent = sub;
  $('svg').innerHTML = WRAP[0] + draw(t) + WRAP[1];
  const f = $('fade');
  f.style.opacity = tv < 0.5 ? 1 - tv / 0.5 : (ANIM_DURATION - tv < 0.6 ? 1 - (ANIM_DURATION - tv) / 0.6 : 0);
