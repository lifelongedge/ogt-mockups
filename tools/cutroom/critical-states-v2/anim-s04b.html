// Overdub twin of s04b: Ken's audio wkr 4322→4500; t is seconds after the in-point.

window.ANIM_DURATION = 178.0;
const ACC='#F2D06B', FG='#f2f5f7', MUT='#9aa7b0', OK='#4ade80', DN='#f87171', BLUE='#7baad4', BRD='rgba(255,255,255,.18)', CARD='#000', TXS=1.1, WRAP=['',''];

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const lerp=(a,b,u)=>a+(b-a)*u;

const circ=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.f||FG}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.5}" opacity="${o.o==null?1:o.o}"/>`;

const arrow=(x1,y1,x2,y2,o={})=>{const a=Math.atan2(y2-y1,x2-x1),h=10;return line(x1,y1,x2,y2,o)+path(`M${x2} ${y2} L${x2-h*Math.cos(a-0.5)} ${y2-h*Math.sin(a-0.5)} M${x2} ${y2} L${x2-h*Math.cos(a+0.5)} ${y2-h*Math.sin(a+0.5)}`,{s:o.s||MUT,sw:o.sw||2,o:o.o});};
// a labelled box that grows in from t0

// deterministic pseudo-random
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
// a herd of dots in a region; drift is a slow deterministic wander
function herd(n,seed,x,y,w,h){const r=rng(seed);const pts=[];for(let i=0;i<n;i++)pts.push({x:x+r()*w,y:y+r()*h,p:r()*6.28,q:r()*6.28});return pts;}
const wander=(p,t,amp)=>[p.x+Math.sin(t*0.9+p.p)*amp,p.y+Math.cos(t*0.7+p.q)*amp];
// typewriter: the first k chars of s by time
const type=(s,t,t0,cps)=>s.slice(0,Math.max(0,Math.floor((t-t0)*(cps||28))));
// a list that reveals one row per step seconds from t0
// --- the lesson helpers (2026-11-21, read from the Stanford "Probability for AI" screens) ---
// the question the window answers, top-left of the scene, serif, amber
const headY=(o={})=>{const capH=($('cap')||{}).offsetHeight||0;return Math.max(o.y||44,(capH-68)/1.1034+32);};
const head=(t,t0,q,o={})=>{const a=op(t,t0,.5);if(a<=0)return '';return txt(o.x||40,headY(o),q,{sz:o.sz||30,c:o.c||ACC,w:600,o:a,cls:'serif'});};
const bridge=(t,t0,s,o={})=>{const a=op(t,t0+.4,.6);if(a<=0)return '';const x=o.x||40,y=headY(o)+(o.dy||33);return txt(x,y,'in trading:',{sz:o.sz||24,c:MUT,o:a,cls:'hand'})+txt(x+(o.gap||128),y,s,{sz:o.sz||24,c:o.c||FG,o:a*.92,cls:'hand'});};   // the metaphor named as the trade, under the head, for the whole scene (lesson rule 8)   // under a three-line caption the question steps down
// where to look: a soft ring that glides to the element of the beat. pts=[[t0,x,y],...]; it holds for o.hold s (default 5) after each beat
function focus(t,pts,o={}){let cur=null,prev=null;for(const p of pts){if(t>=p[0]){prev=cur;cur=p;}}if(!cur)return '';const age=t-cur[0];if(age>(o.hold||5))return '';
  const u=prev?pr(t,cur[0],.6):1;const x=prev?lerp(prev[1],cur[1],u):cur[1],y=prev?lerp(prev[2],cur[2],u):cur[2];const r=(o.r||22)+Math.sin(t*4)*2;const a=op(t,cur[0],.3)*(age>(o.hold||5)-.6?((o.hold||5)-age)/.6:1);
  return circ(x,y,r,{f:'none',s:o.c||ACC,sw:2.5,o:a*.9})+circ(x,y,4,{f:o.c||ACC,o:a});}
// the boxed definition, once the intuition has landed: a serif title and his words under it
function defn(t,t0,x,y,w,title,lines,o={}){const u=pr(t,t0,.6);if(u<=0)return '';const lh=o.lh||28,h=(o.pad||22)*2+34+lines.length*lh;let s=rect(x,y,w,h,{r:8,s:o.s||FG,sw:2,f:o.f||'rgba(255,255,255,.03)',o:u});
  if(u>.5){const a=op(t,t0+.3,.4);s+=txt(x+(o.pad||22),y+(o.pad||22)+22,title,{sz:o.sz||26,c:o.c||FG,w:600,o:a,cls:'serif'});lines.forEach((ln,i)=>{s+=txt(x+(o.pad||22),y+(o.pad||22)+34+22+i*lh,ln,{sz:o.lsz||20,c:o.lc||FG,o:op(t,t0+.5+i*.25,.4)});});}return s;}
// the aside, in a second register: handwritten, amber, a little tilted (sparingly: his aside, not the framework)
const aside=(t,t0,x,y,s,o={})=>{const a=op(t,t0,.5);return a<=0?'':`<g transform="rotate(${o.rot==null?-2:o.rot} ${x} ${y})">`+txt(x,y,s,{sz:o.sz||24,c:o.c||ACC,o:a*(o.o==null?1:o.o),a:o.a||'start',cls:'hand'})+'</g>';};
// the recall box: an earlier figure back, small, in a corner, for a few seconds (draw the figure with its own helper inside g)
function recall(t,t0,x,y,w,h,label,inner,o={}){const a=op(t,t0,.5)*(o.until&&t>o.until?clamp(1-(t-o.until)/.6,0,1):1);if(a<=0)return '';
  return rect(x,y,w,h,{r:8,s:MUT,sw:1.5,f:'rgba(255,255,255,.03)',o:a,dash:'4 4'})+txt(x+12,y+20,label,{sz:14,c:MUT,o:a})+`<g opacity="${a}" transform="translate(${x} ${y+28}) scale(${o.sc||.5})">${inner}</g>`;}
function list(t,t0,step,items,x,y,o={}){let out='';items.forEach((s,i)=>{const o1=op(t,t0+i*step,0.4);if(o1>0)out+=txt(x,y+i*(o.lh||34),s,{sz:o.sz||22,c:o.c||FG,o:o1,w:o.w||400});});return out;}

const BEATS = [[0.7, "<em>This slope is down</em>. That slope is down. The dragon is down. The 90 is down", "SPY, 3-day bars, his weekend report"], [9.2, "And the 270 just went from <em>sloping up to sideways</em>", ""], [17.8, "Notice how much <em>boundary and safety</em> there is, as indicated by the 270", ""], [53.6, "Here's where the <em>pain and suffering</em> occurs", ""], [78.6, "This is where the <em>90 crossed the 270</em>: two legs down, and the breach of the Bollinger band safety interval", ""], [91.9, "Here's where the <em>10 breached it</em>", ""], [99.0, "Here is where the <em>30 breached</em> this boundary", ""], [104.7, "And now the <em>90 comes into the boundary</em>, and breaches it", ""], [117.0, "The 270 used to have this little <em>comfortable cushion</em> above its own protective zone", ""], [127.3, "Notice how this is <em>getting narrow</em> as the 270 comes back to its long-term", ""], [137.9, "There's a <em>very thin layer of support</em>, statistically, right here", ""], [153.0, "This price had better recover, or the 270 is going to come through and <em>smash everything</em>", "the 270's own band is the last statistical support"]];
// WARP (optional): [[t_voice, t_authored], …] knots from the voice-over's words; the scene was authored on an estimate
const WARP = null;
const warpT = t => { if (!WARP) return t; for (let i = 1; i < WARP.length; i++) if (t <= WARP[i][0]) {
  const [a0, b0] = WARP[i - 1], [a1, b1] = WARP[i]; return b0 + (b1 - b0) * (t - a0) / Math.max(1e-6, a1 - a0); }
  return WARP[WARP.length - 1][1]; };

const T=i=>BEATS[Math.min(i,BEATS.length-1)][0];
const after=(t,i)=>t>=T(i);
const between=(t,i,j)=>t>=T(i)&&t<T(j);
const ph=(t,i,j)=>op(t,T(i),.5)*(j==null?1:1-op(t,T(j)-.4,.4));
const glow=s=>`<g filter="url(#g)">${s}</g>`;
const mono=(x,y,s,o={})=>txt(x,y,s,Object.assign({cls:'mono'},o));
const kick=(s,o,x)=>mono(x||0,22,s.toUpperCase(),{sz:14,c:MUT,o:o==null?1:o,extra:'letter-spacing=".12em"'});
// a dark mask over a region of a still (the Zoom gallery that rides along in a crop)
const mask=(x0,y0,x1,y1)=>rect(x0,y0,x1-x0,y1-y0,{f:'#05070b',s:'none',r:0});
const cnt=(t,t0,d,n)=>Math.round(n*pr(t,t0,d||1.2));
function walk(keys,seed,amp){const r=rng(seed);const N=240;const nz=[];let a=0;for(let i=0;i<=N;i++){a=a*0.82+(r()-.5);nz.push(a);}
  return u=>{u=clamp(u,0,1);let k=0;while(k<keys.length-2&&u>keys[k+1][0])k++;const [x0,v0]=keys[k],[x1,v1]=keys[k+1];const w=clamp((u-x0)/((x1-x0)||1),0,1);return lerp(v0,v1,w)+nz[Math.round(u*N)]*(amp||0);};}
function fr(x,y,w,h,lo,hi){return {x,y,w,h,lo,hi,X:u=>x+u*w,Y:v=>y+h-(v-lo)/(hi-lo)*h};}
function plot(F,f,u0,u1,o={}){if(u1<=u0)return '';let d='';const n=Math.max(2,Math.round((u1-u0)*180));for(let i=0;i<=n;i++){const u=u0+(u1-u0)*i/n;d+=(i?'L':'M')+F.X(u).toFixed(1)+' '+F.Y(f(u)).toFixed(1);}return path(d,{s:o.s||FG,sw:o.sw||2.5,o:o.o==null?1:o.o,dash:o.dash});}
function lvl(F,v,label,o={}){const y=F.Y(v),x0=o.x0==null?F.x:F.X(o.x0),x1=o.x1==null?F.x+F.w:F.X(o.x1);
  return line(x0,y,x1,y,{s:o.s||MUT,sw:o.sw||1.5,dash:o.dash===undefined?'6 5':o.dash,o:o.o})+(label?txt(o.left?x0-8:x1+8,y+6,label,{a:o.left?'end':'start',c:o.s||MUT,sz:o.sz||15,o:o.o,w:o.w||500}):'');}
function zone(F,u0,u1,va,vb,o={}){const y1=F.Y(Math.max(va,vb)),y2=F.Y(Math.min(va,vb));return rect(F.X(u0),y1,F.X(u1)-F.X(u0),Math.max(1,y2-y1),{f:o.f||'rgba(239,90,111,.14)',s:o.s||DN,sw:o.sw||1.2,r:2,o:o.o==null?1:o.o,extra:o.dash?`stroke-dasharray="${o.dash}"`:''});}
function dot(F,u,v,c,o){return circ(F.X(u),F.Y(v),6,{f:c,o:o==null?1:o})+circ(F.X(u),F.Y(v),11,{f:'none',s:c,sw:1.5,o:(o==null?1:o)*.5});}
// bars from a series of [o,h,l,c]; reveal the first k
function bars(F,B,k,o={}){let s='';const n=B.length,bw=F.w/n*(o.bw||.6);for(let i=0;i<Math.min(k,n);i++){const [a,h,l,b]=B[i];const up=b>=a;const c=o.c&&o.c[i]?o.c[i]:(up?OK:DN);
  const x=F.x+(i+.5)*F.w/n;s+=line(x,F.Y(h),x,F.Y(l),{s:c,sw:1.5,o:o.o})+rect(x-bw/2,F.Y(Math.max(a,b)),bw,Math.max(2,Math.abs(F.Y(a)-F.Y(b))),{f:c,s:'none',r:1,o:o.o});}return s;}
const cx=(F,i,n)=>F.x+(i+.5)*F.w/n;

function vbr(x,y0,y1,label,o={}){const c=o.s||ACC,d=o.left?-8:8;return path(`M${x+d} ${y0} L${x} ${y0} L${x} ${y1} L${x+d} ${y1}`,{s:c,sw:o.sw||2,o:o.o})+(label?txt(x+(o.left?-14:14),(y0+y1)/2+6,label,{a:o.left?'end':'start',c,sz:o.sz||16,o:o.o,w:600}):'');}

const tick=(x,y,w,c,o)=>line(x-w/2,y,x+w/2,y,{s:c,sw:3,o});
// a card: panel with a mono label
function card(x,y,w,h,label,o){return rect(x,y,w,h,{s:BRD,f:CARD,o:o,r:8})+(label?mono(x+14,y+24,label.toUpperCase(),{c:MUT,sz:12,o:o,extra:'letter-spacing=".1em"'}):'');}
function chip(x,y,s,o={}){const w=o.w||Math.max(60,s.length*(o.sz||17)*.58+26);return rect(x,y,w,o.h||34,{f:o.f||'rgba(95,211,204,.10)',s:o.s||ACC,sw:1.2,r:17,o:o.o})+txt(x+w/2,y+(o.h||34)/2+6,s,{a:'middle',c:o.c||FG,sz:o.sz||17,o:o.o,w:500});}
function big(s,o,c,y,x){return txt(x==null?580:x,y||270,s,{a:'middle',sz:34,c:c||ACC,o:o,w:600});}

function readout(x,y,label,val,o={},c){return mono(x,y,label.toUpperCase(),{sz:12,c:MUT,o:o.o,extra:'letter-spacing=".1em"'})+mono(x,y+40,val,{sz:o.sz||36,c:c||ACC,o:o.o,w:600});}

function noise(x,y,w,h,seed,k,c,o){const r=rng(seed);let d='';for(let i=0;i<k;i++){d+=(i?'L':'M')+(x+r()*w).toFixed(1)+' '+(y+r()*h).toFixed(1);}return path(d,{s:c||DN,sw:1.4,o:o});}

const GDEF='<defs><filter id="g" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
// one colour per quantity, the whole course: his own chart colours where he has them
const RL10=BLUE, RL30='#e5e7eb', RL90='#4ade80', RL270='#f472b6', BAND='#cbd5e1', DRAG='#fbbf24', PRICE=FG,
      KEY=ACC, RISK=DN, SAFE=OK, MOUSE='#67e8f9', LUIS='#c4b5fd';
const RX=790;
const fa=(c,a)=>c+Math.round(clamp(a,0,1)*255).toString(16).padStart(2,'0');
// a right-column line that lands on beat k (o.until: fades out on that beat)
function rc(t,k,y,s,o={}){ if(!after(t,k)) return ''; const a=op(t,T(k)+(o.d||0),.5)*(o.until!=null?1-op(t,T(o.until)-.4,.4):1); return txt(o.x||RX,y,s,{sz:o.sz||19,c:o.c||FG,o:a,w:o.w||400,a:o.a||'start',cls:o.cls||''}); }
// a label on the figure: dark pill, coloured border
function tag(x,y,s,c,o,a){const w=s.length*9.4+18;const x0=a==='end'?x-w:a==='middle'?x-w/2:x;return rect(x0,y-14,w,26,{f:'rgba(0,0,0,.85)',s:c,sw:1.2,r:6,o})+txt(x0+w/2,y+5,s,{a:'middle',c:'#fff',sz:15,o,w:600});}
// a glowing ring on the thing he points at
const ring=(x,y,r,c,o)=>glow(circ(x,y,r,{f:'none',s:c,sw:3,o}));
function chip(x,y,s,o={}){const sz=o.sz||18;const w=o.w||Math.max(60,s.length*sz*.62+28);return rect(x,y,w,o.h||36,{f:o.f||fa(o.s||KEY,.10),s:o.s||KEY,sw:1.5,r:18,o:o.o})+txt(x+w/2,y+(o.h||36)/2+6,s,{a:'middle',c:o.c||FG,sz,o:o.o,w:500});}
function readout(x,y,label,val,o={},c){return txt(x,y,label,{sz:17,c:MUT,o:o.o})+txt(x,y+(o.sz||34)+6,val,{sz:o.sz||34,c:c||KEY,o:o.o,w:600});}
function big(s,o,c,y,x){return txt(x==null?580:x,y||270,s,{a:'middle',sz:34,c:c||KEY,o:o,w:600});}
// a price level across the still (PY from the fit), its tag in the gutter right of the chart
function lv(price,label,c,o,x0,x1,left){const y=PY(price);const a=x0==null?IX:x0,b=x1==null?IX+IW:x1;return line(a,y,b,y,{s:c,sw:2,dash:'7 5',o})+(label?(left?tag(a-6,y,label,c,o,'end'):tag(b+6,y,label,c,o)):'');}
// a vertical bracket between two prices at x
function vbr(x,p0,p1,label,c,o){const y0=PY(p0),y1=PY(p1);return path(`M${x+8} ${y0} L${x} ${y0} L${x} ${y1} L${x+8} ${y1}`,{s:c,sw:2.5,o})+(label?txt(x-10,(y0+y1)/2+6,label,{a:'end',c,sz:17,o,w:600}):'');}

function legend(t,k,y){ const rows=[['RL10 · the dragon',RL10],['SMA30',RL30],['RL90',RL90],['RL270 · its own band',RL270]]; let s='';
  rows.forEach((r,i)=>{ s+=rc(t,k,y+i*30,'—',{c:r[1],w:700,sz:22,d:i*.3})+rc(t,k,y+i*30,r[0],{x:RX+28,c:r[1],sz:19,d:i*.3}); }); return s; }

const WX=30, WY=140, WW=594, WH=360;

function draw(t){
  let s=GDEF;
  s += rect(WX,WY,WW,WH,{f:'none',s:'rgba(255,255,255,.28)',sw:1.5,r:4});
  s += head(t,0.2,'What does the stack say today?') + bridge(t,0.2,'every slope down; the 270’s own band is the last support');
  s += legend(t,0,165);
  
  s += rc(t,4,312,'the breaches, in order',{c:MUT,sz:17});
  s += rc(t,5,342,'1  the 10 breached the band',{c:RL10,sz:19,w:600}) + rc(t,6,370,'2  the 30 breached it',{c:RL30,sz:19,w:600}) + rc(t,7,398,'3  the 90 comes in, breaches it',{c:RL90,sz:19,w:600});
  s += defn(t,T(11),RX,432,330,'The last support',['the 270 at its own band','price had better recover','or the 270 comes through'],{lh:24,pad:12,lsz:17});

  return s;
}

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  const tv = t; t = warpT(t);
  let cap = '', sub = '';
  for (const b of BEATS) if (t >= b[0]) { cap = b[1]; sub = b[2] || ''; }
  $('cap').innerHTML = cap; $('sub').textContent = sub;
  $('svg').innerHTML = WRAP[0] + draw(t) + WRAP[1];
  const f = $('fade');
  f.style.opacity = tv < 0.5 ? 1 - tv / 0.5 : (ANIM_DURATION - tv < 0.6 ? 1 - (ANIM_DURATION - tv) / 0.6 : 0);
};
renderFrame(0);
</script>
