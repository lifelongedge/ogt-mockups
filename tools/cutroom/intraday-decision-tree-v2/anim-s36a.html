const PX=x=>IX+x*S, PYX=y=>IY+y*S;
const base=(o,k)=>`<image href="${IMGS[k||0]}" x="${IX}" y="${IY}" width="${IW}" height="${IH}" preserveAspectRatio="none" opacity="${o==null?1:o}"/>`;

const RX=890;
function body(t){
  const two=after(t,4);
  let s=base(.92,two?1:0)+mask(PX(826),PYX(0),PX(880),PYX(122))+'';
  if (!two){
    if (after(t,0)){ const o=op(t,T(0),.5); s += glow(rect(PX(210),PYX(478),PX(250)-PX(210),PYX(562)-PYX(478),{f:'rgba(242,208,107,.14)',s:ACC,sw:2,r:2,o})) + tag(PX(200)-6,PYX(470),'last 30 min',ACC,o,'end'); }
    if (after(t,1)){ const o=ph(t,1,2); s += dot({X:u=>PX(262),Y:v=>PYX(520)},0,0,FG,o) + tag(PX(270),PYX(540),'opens inside: breakout of the bar',FG,o); }
    if (after(t,2)){ const o=op(t,T(2),.5); s += arrow(PX(262),PYX(478),PX(262),PYX(300),{s:OK,sw:3,o}) + line(PX(240),PYX(290),PX(330),PYX(290),{s:ACC,sw:2,dash:'5 4',o}) + line(PX(240),PYX(330),PX(330),PYX(330),{s:ACC,sw:2,dash:'5 4',o}) + tag(PX(336),PYX(310),'bracket the 10 % gap',ACC,o); }
    if (after(t,3)){ const o=op(t,T(3),.5); s += line(PX(60),PYX(415),PX(640),PYX(415),{s:'#f59e0b',sw:2,dash:'6 4',o}) + tag(PX(60),PYX(400),'yesterday\'s VWAP',"#f59e0b",o) + txt(RX,100,'above the VWAP',{sz:18,o,w:600}) + txt(RX,124,'betting hard, fast, early',{c:MUT,sz:18,o}); }
  } else {
    if (after(t,4)){ const o=op(t,T(4),.5); s += glow(arrow(PX(262),PYX(500),PX(262),PYX(140),{s:OK,sw:3,o})) + rect(PX(290),PYX(150),PX(330)-PX(290),PYX(210)-PYX(150),{f:'rgba(242,208,107,.14)',s:ACC,sw:2,r:2,o}) + tag(PX(336),PYX(180),'R5 bracket',ACC,o) + txt(RX,100,'uranium: a big gap up',{sz:18,o}); }
    if (after(t,5)){ const k=cnt(t,T(5),2,4); for(let i=0;i<k;i++){ s += rect(PX(480),PYX(170)+i*26,40,22,{f:'rgba(248,113,113,.25)',s:DN,sw:1,r:2}) + mono(PX(500),PYX(170)+i*26+16,(i+1)+'R',{a:'middle',sz:18,c:'#fff'}); } if(k>=4) s += tag(PX(530),PYX(250),'keep 3R',DN,1); }
    if (after(t,6)){ const o=op(t,T(6),.5); s += arrow(PX(560),PYX(260),PX(560),PYX(150),{s:OK,sw:3,o}) + tag(PX(590),PYX(160),'back above VWAP: +3R',OK,o) + txt(RX,160,'in 20 minutes',{c:MUT,sz:18,o}); }
    if (after(t,7)){ const o=op(t,T(7),.5); s += noise(PX(620),PYX(180),PX(760)-PX(620),60,36,40,DN,o*.8) + txt(RX,220,'on the 3-minute:',{c:MUT,sz:18,o}) + txt(RX,244,'chopped to death',{c:DN,sz:18,o,w:600}); }
  }
  return s;
}

function draw(t){
  return head(t,0.5,'Did it open inside the last 30-minute bar?')+bridge(t,0.5,"opens inside: trade its breakout; gaps outside: bracket it")+'<g transform="translate(0 108) scale(0.774)">'+body(t)+focus(t,[[T(0),238,471],[T(1),267,471],[T(2),300,280],[T(3),330,376],[T(4),300,163],[T(5),392,190],[T(6),537,190],[T(7),630,200]])+'</g>';
}

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  const tv = t; t = warpT(t);
  let cap = '', sub = '';
  for (const b of BEATS) if (t >= b[0]) { cap = b[1]; sub = b[2] || ''; }
  $('cap').innerHTML = cap; $('sub').textContent = sub;
  $('svg').innerHTML = WRAP[0] + draw(t) + WRAP[1];
  const f = $('fade');
  f.style.opacity = tv < 0.5 ? 1 - tv / 0.5 : (ANIM_DURATION - tv < 0.6 ? 1 - (ANIM_DURATION - tv) / 0.6 : 0);
};
renderFrame(0);
