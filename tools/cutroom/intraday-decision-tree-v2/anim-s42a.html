const bridge=(t,t0,s,o={})=>{const a=op(t,t0+.4,.6);if(a<=0)return '';const x=o.x||40,y=headY(o)+(o.dy||33);return txt(x,y,'in trading:',{sz:o.sz||24,c:MUT,o:a,cls:'hand'})+txt(x+(o.gap||128),y,s,{sz:o.sz||24,c:o.c||FG,o:a*.92,cls:'hand'});};   // the metaphor named as the trade, under the head, for the whole scene (lesson rule 8)   // under a three-line caption the question steps down

function focus(t,pts,o={}){let cur=null,prev=null;for(const p of pts){if(t>=p[0]){prev=cur;cur=p;}}if(!cur)return '';const age=t-cur[0];if(age>(o.hold||5))return '';

const BEATS = [[13.7, "Close above the open: <em>positive</em> follow-through", "the four cases"], [33.4, "Gap up, close higher; gap up, reverse", ""], [49.8, "Gap down, close higher; gap down, fail", ""], [78.3, "The direction does <em>not</em> predict the follow-through", ""], [98.1, "The statistic flips every week or two", ""], [125.2, "The gap's <em>size</em> predicts the follow-through size", ""], [142.2, "Small gap: a regular day. Large gap: a <em>RangeStat</em> day", ""], [187.2, "At the open, the open is the high and the low at once", ""], [216.4, "An R10 bracket on the open; take the first breakout", "the size of the gap predicts the size of the follow-through, not the direction"]];
// WARP (optional): [[t_voice, t_authored], …] knots from the voice-over's words; the scene was authored on an estimate

const warpT = t => { if (!WARP) return t; for (let i = 1; i < WARP.length; i++) if (t <= WARP[i][0]) {

const ph=(t,i,j)=>op(t,T(i),.5)*(j==null?1:1-op(t,T(j)-.4,.4));
const glow=s=>`<g filter="url(#g)">${s}</g>`;

const mask=(x0,y0,x1,y1)=>rect(x0,y0,x1-x0,y1-y0,{f:'#05070b',s:'none',r:0});
const cnt=(t,t0,d,n)=>Math.round(n*pr(t,t0,d||1.2));
function walk(keys,seed,amp){const r=rng(seed);const N=240;const nz=[];let a=0;for(let i=0;i<=N;i++){a=a*0.82+(r()-.5);nz.push(a);}

function fr(x,y,w,h,lo,hi){return {x,y,w,h,lo,hi,X:u=>x+u*w,Y:v=>y+h-(v-lo)/(hi-lo)*h};}

function lvl(F,v,label,o={}){const y=F.Y(v),x0=o.x0==null?F.x:F.X(o.x0),x1=o.x1==null?F.x+F.w:F.X(o.x1);
  return line(x0,y,x1,y,{s:o.s||MUT,sw:o.sw||1.5,dash:o.dash===undefined?'6 5':o.dash,o:o.o})+(label?txt(o.left?x0-8:x1+8,y+6,label,{a:o.left?'end':'start',c:o.s||MUT,sz:o.sz||15,o:o.o,w:o.w||500}):'');}

function body(t){
  let s='';

  if (after(t,0)){ const o=op(t,T(0),.5); s += cell(GX,GY,true,true,o) + txt(GX,GY+150,'gap up, close higher',{c:MUT,sz:16,o}); }
  if (after(t,1)){ const o=op(t,T(1),.5); s += cell(GX+260,GY,true,false,o) + txt(GX+260,GY+150,'gap up, reverse',{c:MUT,sz:16,o}); }
  if (after(t,2)){ const o=op(t,T(2),.5); s += cell(GX,GY+180,false,true,o) + txt(GX,GY+372,'gap down, close higher',{c:MUT,sz:16,o}) + cell(GX+260,GY+180,false,false,op(t,T(2)+1,.4)) + txt(GX+260,GY+372,'gap down, fail',{c:MUT,sz:16,o:op(t,T(2)+1,.4)}); }
  const RX=520;
  if (after(t,3)){ const o=op(t,T(3),.5); const f=.5+.5*Math.sin((t-T(3))*3); s += txt(RX,90,'direction',{sz:22,o,w:600}) + txt(RX+150,90,'does not predict',{sz:22,c:DN,o,w:600}) + txt(RX,118,'the follow-through',{c:MUT,sz:16,o}) + txt(RX+390,90,f>.5?'↑':'↓',{sz:28,c:MUT,o:o*.7}); }
  if (after(t,4)){ const o=op(t,T(4),.5); const wk=Math.floor((t-T(4))/1.2)%2; for(let i=0;i<2;i++){ s += rect(RX+i*130,150,120,34,{f:wk==i?'rgba(242,208,107,.3)':'rgba(139,152,165,.1)',s:MUT,sw:1,r:4,o}) + mono(RX+i*130+60,173,i?'WEEK 2: −':'WEEK 1: +',{a:'middle',sz:16,c:FG,o}); } s += txt(RX,210,'the statistic flips every week or two',{c:MUT,sz:16,o}); }
  if (after(t,5)){ const o=op(t,T(5),.5); const g=lerp(20,70,.5+.5*Math.sin((t-T(5))*1.2)); s += rect(RX,250,30,g,{f:'rgba(242,208,107,.3)',s:ACC,sw:1,r:2,o}) + mono(RX+15,250+g+16,'GAP',{a:'middle',sz:16,c:MUT,o}) + rect(RX+60,250,30,g*1.6,{f:'rgba(230,237,243,.12)',s:MUT,sw:1,r:2,o}) + mono(RX+75,250+g*1.6+16,'FOLLOW',{a:'middle',sz:16,c:MUT,o}) + txt(RX+120,272,'size predicts size',{sz:16,o,w:600}); }
  if (after(t,6)){ const o=op(t,T(6),.5); s += rect(RX+330,250,150,40,{f:'rgba(139,152,165,.1)',s:MUT,sw:1,r:4,o}) + txt(RX+405,276,'regular day',{a:'middle',c:MUT,sz:16,o}) + rect(RX+330,300,150,70,{f:'rgba(242,208,107,.2)',s:ACC,sw:1.5,r:4,o}) + txt(RX+405,340,'RangeStat day',{a:'middle',c:ACC,sz:16,o}) + txt(RX+490,276,'small gap',{c:MUT,sz:16,o}) + txt(RX+490,340,'large gap',{c:ACC,sz:16,o}); }
  if (after(t,7)){ const o=op(t,T(7),.5); const u=pr(t,T(7),1.2); const x=RX+40, y=430; s += dot({X:v=>x,Y:v=>y},0,0,ACC,o) + line(x-30,y-u*28,x+30,y-u*28,{s:OK,sw:2,o}) + line(x-30,y+u*28,x+30,y+u*28,{s:DN,sw:2,o}) + txt(x+40,y-u*28+5,'high',{c:OK,sz:16,o}) + txt(x+40,y+u*28+5,'low',{c:DN,sz:16,o}) + txt(x-40,y+60,'open = high = low',{c:MUT,sz:16,o}); }
  if (after(t,8)){ const o=op(t,T(8),.5); const x=RX+260, y=430; s += rect(x-30,y-22,60,44,{f:'rgba(242,208,107,.14)',s:ACC,sw:2,r:3,o}) + dot({X:v=>x,Y:v=>y},0,0,ACC,o) + arrow(x+44,y-22,x+44,y-60,{s:OK,sw:2.5,o}) + tag(x+56,y-40,'first breakout',OK,o) + txt(x-30,y+60,'R10 bracket on the open',{c:MUT,sz:16,o}); }
  return s;
}

function draw(t){
  return head(t,0.5,'Which of the four gap cases comes next?')+bridge(t,0.5,"trade the gap's size, not its direction: bracket the open")+'<g transform="translate(0 80) scale(0.87)">'+body(t)+focus(t,[[T(0),120,110],[T(1),320,110],[T(2),220,290],[T(3),650,85],[T(4),620,167],[T(5),580,280],[T(6),900,300],[T(7),560,430],[T(8),780,430]])+'</g>';
}

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  const tv = t; t = warpT(t);
  let cap = '', sub = '';
  for (const b of BEATS) if (t >= b[0]) { cap = b[1]; sub = b[2] || ''; }
  $('cap').innerHTML = cap; $('sub').textContent = sub;
  $('svg').innerHTML = WRAP[0] + draw(t) + WRAP[1];
  const f = $('fade');
  f.style.opacity = tv < 0.5 ? 1 - tv / 0.5 : (ANIM_DURATION - tv < 0.6 ? 1 - (ANIM_DURATION - tv) / 0.6 : 0);
};
renderFrame(0);
</script>
