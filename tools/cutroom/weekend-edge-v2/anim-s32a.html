<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>s32a · yellow, green and red zones</title>
<style>
  :root { --bg:#030507; --fg:#E1EEF5; --muted:#8fa3ad; --border:rgba(56,225,255,0.14); --accent:#F2D06B;
          --ok:#4ade80; --dn:#f87171; --card:#0a1016; --blue:#7baad4; }
  html, body { margin:0; background:var(--bg); overflow:hidden; }
  #stage { position:relative; width:1280px; height:720px; background:var(--bg); color:var(--fg);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #cap { position:absolute; left:60px; right:60px; top:30px; font-size:32px; font-weight:600; letter-spacing:-.01em; line-height:1.15; }
  #cap em { font-style:normal; color:var(--accent); }
  #sub { position:absolute; left:60px; width:1160px; top:648px; font-size:20px; color:var(--muted); line-height:1.4; }
  #scene { position:absolute; left:60px; top:112px; width:1160px; height:518px; border:1px solid var(--border);
           border-radius:10px; background:var(--card); overflow:hidden; }
  #svg { position:absolute; inset:0; }
  #fade { position:absolute; inset:0; background:var(--bg); pointer-events:none; opacity:0; }
  /* the picture-in-picture corner: build_v2 composites Ken's camera tile here (PIP_W/X/Y); the cutroom shows this placeholder */
  #pip { position:absolute; left:950px; top:22px; width:300px; height:169px; border:1px dashed rgba(56,225,255,0.35); border-radius:4px;
         display:none; color:var(--muted); font-size:13px; text-align:center; line-height:169px; }
  .pip #pip { display:block; } .pip #cap { right:360px; font-size:29px; }
  text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; fill:#E1EEF5; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; }
  #third { display:none; }
</style>
</head>
<body>
<div id="stage" class="pip">
  <div id="cap"></div>
  <div id="pip">Ken on camera, composited at render</div>
  <div id="scene"><svg id="svg" width="1160" height="530" viewBox="0 0 1160 530"></svg></div>
  <div id="third"></div>
  <div id="sub"></div>
  <div id="fade"></div>
</div>
<script>
const BUILD = 's32a-1';
console.log('[s32a] build', BUILD);
// Overdub twin of s32: Ken's audio mc 928.0→1250.0; t is seconds after the in-point.
// Beat times read from the VTT cues on 2026-11-21 (tools/cutroom/weekend-edge-v2/transcript-mc.json).
window.ANIM_DURATION = 322.0;
const ACC='#F2D06B', FG='#E1EEF5', MUT='#8fa3ad', OK='#4ade80', DN='#f87171', BLUE='#7baad4', BRD='rgba(56,225,255,.22)', CARD='#0a1016', TXS=1, WRAP=['',''];
const W=1160, H=530;
const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=u=>{u=clamp(u,0,1);return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;};
const lerp=(a,b,u)=>a+(b-a)*u;
const pr=(t,t0,d)=>ease((t-t0)/(d||0.6));          // eased progress 0..1 from t0 over d seconds
const on=(t,t0)=>t>=t0;
const op=(t,t0,d)=>clamp((t-t0)/(d||0.5),0,1);      // linear opacity ramp
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const txt=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${(o.sz||20)*TXS}" fill="${o.c||FG}" opacity="${o.o==null?1:o.o}" text-anchor="${o.a||'start'}" font-weight="${o.w||400}" class="${o.cls||''}" ${o.extra||''}>${esc(s)}</text>`;
const rect=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r==null?6:o.r}" fill="${o.f||'none'}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.5}" opacity="${o.o==null?1:o.o}" ${o.extra||''}/>`;
const circ=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.f||FG}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.5}" opacity="${o.o==null?1:o.o}"/>`;
const line=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.s||MUT}" stroke-width="${o.sw||2}" opacity="${o.o==null?1:o.o}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} stroke-linecap="round"/>`;
const path=(d,o={})=>`<path d="${d}" fill="${o.f||'none'}" stroke="${o.s||FG}" stroke-width="${o.sw||2}" opacity="${o.o==null?1:o.o}" stroke-linecap="round" stroke-linejoin="round" ${o.dash?`stroke-dasharray="${o.dash}"`:''}/>`;
const arrow=(x1,y1,x2,y2,o={})=>{const a=Math.atan2(y2-y1,x2-x1),h=10;return line(x1,y1,x2,y2,o)+path(`M${x2} ${y2} L${x2-h*Math.cos(a-0.5)} ${y2-h*Math.sin(a-0.5)} M${x2} ${y2} L${x2-h*Math.cos(a+0.5)} ${y2-h*Math.sin(a+0.5)}`,{s:o.s||MUT,sw:o.sw||2,o:o.o});};
// a labelled box that grows in from t0
const box=(t,t0,x,y,w,h,label,o={})=>{const u=pr(t,t0,0.5);if(u<=0)return '';const ww=w*u,hh=h;return rect(x+(w-ww)/2,y,ww,hh,{s:o.s||BRD,f:o.f||'rgba(255,255,255,.02)',sw:o.sw||1.5,o:u})+(u>.6?txt(x+w/2,y+h/2+(o.sz||20)/3,label,{a:'middle',sz:o.sz||20,c:o.c||FG,o:op(t,t0+.3,.3),w:o.w||500}):'');};
// deterministic pseudo-random
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
// a herd of dots in a region; drift is a slow deterministic wander
function herd(n,seed,x,y,w,h){const r=rng(seed);const pts=[];for(let i=0;i<n;i++)pts.push({x:x+r()*w,y:y+r()*h,p:r()*6.28,q:r()*6.28});return pts;}
const wander=(p,t,amp)=>[p.x+Math.sin(t*0.9+p.p)*amp,p.y+Math.cos(t*0.7+p.q)*amp];
// typewriter: the first k chars of s by time
const type=(s,t,t0,cps)=>s.slice(0,Math.max(0,Math.floor((t-t0)*(cps||28))));
// a list that reveals one row per step seconds from t0
function list(t,t0,step,items,x,y,o={}){let out='';items.forEach((s,i)=>{const o1=op(t,t0+i*step,0.4);if(o1>0)out+=txt(x,y+i*(o.lh||34),s,{sz:o.sz||22,c:o.c||FG,o:o1,w:o.w||400});});return out;}

const BEATS = [[2.4, "the main point is that it's <em>holding</em> here, and the price has come into the pocket and then taken off", ""], [29.5, "it starts with your SSC, then a series of Kata 2s all the way up: <em>re-entries</em> or a second or third position", ""], [47.2, "<em>climbing up the stairs</em>, and as long as it's staying above the PSAR dots every pullback is an opportunity", ""], [76.0, "if you wait for it to emerge higher than the previous peak, that entry is an <em>emerging dragon</em>", ""], [107.4, "why wait for the emerging dragon? you want <em>evidence</em> it's continuing: new buying power above the old peak", ""], [132.3, "in the pocket you don't know yet if it breaks through; if not, that failing action leads to a <em>collapsing dragon</em>", ""], [160.8, "between the peak and the belly: the <em>yellow zone</em>. Above the previous peak: the <em>green zone</em>", ""], [178.2, "below that line of the RL10 is the <em>red zone</em>, and that's collapsing dragon territory: you want to be short there", ""], [191.8, "in the yellow zone you are trading in a region of <em>maximum uncertainty</em>", ""], [211.1, "the breakout above that previous RL10 peak will <em>really go</em>; wait for it and you may be chasing a bad fill", ""], [240.8, "during the burst all you have to do is get your <em>stop above your entry</em> and you've locked in that gain", ""], [258.0, "you don't get a Kata 2 until you had a <em>successful supported spring crossing</em>, pulled back a certain distance", ""], [284.8, "while it is slow in climbing the steps, when it breaks it <em>jumps out the window</em>", ""], [297.0, "when these support levels collapse, the <em>optimism</em> that was feeding this collapses and <em>fear</em> takes over", ""], [310.9, "the collapsing dragon is our <em>favorite pattern</em>: when it goes, that first move is large", "His read of the pattern, not a measured figure."]];

const m3_pill=(x,y,s,o={})=>{const w=(o.w||s.length*9.5+22);return rect(x-w/2,y-15,w,30,{r:15,s:o.s||BRD,f:o.f||'rgba(255,255,255,.03)',o:o.o==null?1:o.o})+txt(x,y+6,s,{a:'middle',sz:o.sz||15,c:o.c||FG,o:o.o==null?1:o.o,w:o.wt||500});};
const m3_lab=(t,t0,x,y,s,o={})=>{const a=op(t,t0,o.d||.5);return a<=0?'':txt(x,y,s,{...o,o:a*(o.o==null?1:o.o)});};
const m3_card=(x,y,w,h,o={})=>rect(x,y,w,h,{r:10,s:o.s||BRD,f:o.f||'rgba(255,255,255,.02)',o:o.o==null?1:o.o});
const m3_person=(x,y,o={})=>circ(x,y-14,9,{f:'none',s:o.c||FG,sw:2,o:o.o==null?1:o.o})+path(`M${x-16} ${y+22} C${x-16} ${y} ${x+16} ${y} ${x+16} ${y+22}`,{s:o.c||FG,sw:2,o:o.o==null?1:o.o});
// the points of a timed polyline that are visible at t: pts=[[x,y,t0],...]; the segment into the next point eases in
function m3_vis(t,pts){const v=[];for(let i=0;i<pts.length;i++){const p=pts[i];const t0=p[2]==null?-1e9:p[2];if(t0<=t){v.push([p[0],p[1]]);}else{if(i>0){const q=pts[i-1];const q0=q[2]==null?t0-1:q[2];const u=pr(t,q0,Math.max(0.4,t0-q0));if(u>0)v.push([lerp(q[0],p[0],u),lerp(q[1],p[1],u)]);}break;}}return v;}
function m3_d(v,smooth){if(v.length<2)return '';let d=`M${v[0][0]} ${v[0][1]}`;if(!smooth){for(let i=1;i<v.length;i++)d+=` L${v[i][0]} ${v[i][1]}`;return d;}for(let i=1;i<v.length-1;i++){const mx=(v[i][0]+v[i+1][0])/2,my=(v[i][1]+v[i+1][1])/2;d+=` Q${v[i][0]} ${v[i][1]} ${mx} ${my}`;}const l=v[v.length-1];d+=` L${l[0]} ${l[1]}`;return d;}
const m3_poly=(t,pts,o={})=>{const d=m3_d(m3_vis(t,pts),o.smooth);return d?path(d,{s:o.s||FG,sw:o.sw||2.5,o:o.o==null?1:o.o,dash:o.dash||''}):'';};
// the RL10 of a price path: a 3-point smoothing, shifted right a touch (a lagging line)
function m3_rl(pts,dx){const r=[];for(let i=0;i<pts.length;i++){const a=pts[Math.max(0,i-1)],b=pts[i],c=pts[Math.min(pts.length-1,i+1)];r.push([b[0]+(dx||8),(a[1]+b[1]+c[1])/3,b[2]]);}return r;}
// a band of half-width hw around a visible polyline
function m3_band(t,pts,hw,o={}){const v=m3_vis(t,pts);if(v.length<2)return '';const up=v.map(p=>[p[0],p[1]-hw]),dn=v.slice().reverse().map(p=>[p[0],p[1]+hw]);return path(m3_d(up,true)+' '+m3_d(dn,true).replace('M','L')+' Z',{f:o.f||'rgba(242,208,107,.14)',s:'none',o:o.o==null?1:o.o});}
// PSAR dots: [[x,y,t0],...]
const m3_dots=(t,ds,o={})=>ds.map(d=>{const a=op(t,d[2],.3);return a<=0?'':circ(d[0],d[1],o.r||3.5,{f:o.c||FG,o:a*(o.o==null?1:o.o)});}).join('');
// a candle: body from y1 to y2 at x
const m3_candle=(x,y1,y2,o={})=>rect(x-5,Math.min(y1,y2),10,Math.abs(y2-y1)||2,{r:1,f:o.f||DN,s:'none',o:o.o==null?1:o.o})+line(x,Math.min(y1,y2)-(o.wick||6),x,Math.max(y1,y2)+(o.wick||6),{s:o.f||DN,sw:1.5,o:o.o==null?1:o.o});

const P=[[100,330,0],[150,300,2],[190,318,8],[240,262,14],[280,282,29],[330,236,33],[370,256,40],[420,210,47],[460,232,52],[520,180,59],[560,176,76],[600,150,211],[640,120,218],[690,124,250],[730,160,284.8],[760,250,288],[790,330,292],[820,420,297]];
const RL=m3_rl(P,10);
const DOTS=[[150,330,8],[190,338,8],[240,300,14],[280,306,29],[330,274,33],[370,278,40],[420,250,47],[460,256,52],[520,222,59],[560,214,76],[600,200,211],[640,170,218]];
function draw(t){
  let s='';
  // the zones around the pullback at x 440..600 (peak 180, belly 232); their names in the gutter to the right, one per row
  if (t>=160.8){ const a=op(t,160.8,.8); s += rect(440,180,160,52,{r:0,f:'rgba(242,208,107,.20)',s:'none',o:a}); }
  if (t>=169.5){ const a=op(t,169.5,.8); s += rect(440,110,160,70,{r:0,f:'rgba(74,222,128,.14)',s:'none',o:a}); }
  if (t>=178.2){ const a=op(t,178.2,.8); s += rect(440,232,160,70,{r:0,f:'rgba(248,113,113,.16)',s:'none',o:a}); }
  s += line(80,470,880,470,{s:BRD,sw:1});
  s += m3_band(t,RL,14,{o:.8});
  s += m3_poly(t,P,{s:FG,sw:2.5,smooth:true});
  s += m3_poly(t,RL,{s:ACC,sw:2,smooth:true});
  s += m3_dots(t,DOTS,{c:OK});
  s += m3_lab(t,2.4,170,350,'holding',{sz:12,c:MUT});
  if (t>=29.5){ s += m3_pill(280,320,'SSC',{sz:12,w:46,c:OK,s:OK,o:op(t,29.5,.4)}); s += m3_pill(370,300,'K2',{sz:12,w:38,c:OK,s:OK,o:op(t,33,.4)}); s += m3_pill(460,280,'K2',{sz:12,w:38,c:OK,s:OK,o:op(t,36,.4)}); }
  s += m3_lab(t,47.2,200,186,'climbing up the stairs',{sz:13,c:MUT});
  if (t>=76){ const a=op(t,76,.6); s += line(440,180,600,180,{s:MUT,sw:1.5,dash:'4 4',o:a}); s += txt(434,184,'previous peak',{sz:11,c:MUT,a:'end',o:a}); }
  if (t>=107.4){ const a=op(t,107.4,.6); s += arrow(460,176,460,140,{s:OK,sw:2,o:a}); }
  // the zone names, gutter right of the box, each on its own row
  s += m3_lab(t,169.5,596,130,'green: above the peak',{sz:12,c:OK,a:'end'});
  s += m3_lab(t,160.8,612,212,'yellow: peak to belly',{sz:12,c:ACC}); s += m3_lab(t,191.8,612,228,'maximum uncertainty',{sz:11,c:ACC});
  s += m3_lab(t,178.2,612,262,'red: below the belly',{sz:12,c:DN}); s += m3_lab(t,181,612,278,'collapsing dragon territory',{sz:11,c:DN});
  if (t>=211.1){ s += m3_lab(t,211.1,700,100,'the breakout really goes',{sz:12,c:OK}); }
  if (t>=240.8){ const a=op(t,240.8,.5); s += line(596,160,660,160,{s:ACC,sw:1.5,dash:'3 3',o:a}); s += m3_lab(t,240.8,664,164,'stop above entry',{sz:11,c:ACC}); }
  if (t>=284.8){ const a=op(t,284.8,.5); s += m3_lab(t,284.8,640,462,'jumps out the window',{sz:14,c:DN}); for(let i=0;i<3;i++) s += line(700+i*30,200+i*70,780+i*30,200+i*70,{s:DN,sw:1.2,dash:'4 3',o:a*.6}); }
  // the text column
  s += m3_card(900,110,240,250,{o:op(t,76,.6)});
  s += m3_lab(t,76,916,138,'emerging dragon:',{sz:12,c:OK}); s += m3_lab(t,76,916,156,'above the previous peak',{sz:12,c:OK});
  s += m3_lab(t,119.7,916,182,'it shows new buying power',{sz:12,c:MUT});
  s += m3_lab(t,258,916,216,'no K2 without',{sz:12,c:FG}); s += m3_lab(t,258,916,234,'a successful SSC',{sz:12,c:FG});
  s += m3_lab(t,297,916,266,'optimism → fear',{sz:12,c:DN}); s += m3_lab(t,315.4,916,290,'the first move is large',{sz:12,c:DN});
  s += m3_lab(t,310.9,916,322,'“our favorite pattern”',{sz:11,c:MUT});
  return s;
}

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  let cap = '', sub = '';
  for (const b of BEATS) if (t >= b[0]) { cap = b[1]; sub = b[2] || ''; }
  $('cap').innerHTML = cap; $('sub').textContent = sub;
  $('svg').innerHTML = WRAP[0] + draw(t) + WRAP[1];
  const f = $('fade');
  f.style.opacity = t < 0.5 ? 1 - t / 0.5 : (ANIM_DURATION - t < 0.6 ? 1 - (ANIM_DURATION - t) / 0.6 : 0);
};
renderFrame(0);
</script>
</body>
</html>
