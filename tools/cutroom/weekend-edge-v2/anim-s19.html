<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>s19 · the grid, drawn (explainer)</title>
<style>
  :root { --bg:#030507; --fg:#E1EEF5; --muted:#8fa3ad; --border:rgba(56,225,255,0.14); --accent:#F2D06B;
          --ok:#4ade80; --dn:#f87171; --card:#0a1016; --blue:#7baad4; }
  html, body { margin:0; background:var(--bg); overflow:hidden; }
  #stage { position:relative; width:1280px; height:720px; background:var(--bg); color:var(--fg);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #cap { position:absolute; left:60px; right:60px; top:30px; font-size:32px; font-weight:600; letter-spacing:-.01em; line-height:1.15; }
  #cap em { font-style:normal; color:var(--accent); }
  #sub { position:absolute; left:60px; width:1160px; top:648px; font-size:20px; color:var(--muted); line-height:1.4; }
  #scene { position:absolute; left:60px; top:112px; width:1160px; height:518px; border:1px solid var(--border);
           border-radius:10px; background:var(--card); overflow:hidden; }
  #svg { position:absolute; inset:0; }
  #fade { position:absolute; inset:0; background:var(--bg); pointer-events:none; opacity:0; }
  /* the picture-in-picture corner: build_v2 composites Ken's camera tile here (PIP_W/X/Y); the cutroom shows this placeholder */
  #pip { position:absolute; left:950px; top:22px; width:300px; height:169px; border:1px dashed rgba(56,225,255,0.35); border-radius:4px;
         display:none; color:var(--muted); font-size:13px; text-align:center; line-height:169px; }
  .pip #pip { display:block; } .pip #cap { right:360px; font-size:29px; }
  text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; fill:#E1EEF5; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; }
  #third { display:none; }
</style>
</head>
<body>
<div id="stage" class="">
  <div id="cap"></div>
  <div id="pip">Ken on camera, composited at render</div>
  <div id="scene"><svg id="svg" width="1160" height="530" viewBox="0 0 1160 530"></svg></div>
  <div id="third"></div>
  <div id="sub"></div>
  <div id="fade"></div>
</div>
<script>
const BUILD = 's19-1';
console.log('[s19] build', BUILD);
// Overdub twin of s19: Ken's audio ava 0.0→90.0; t is seconds after the in-point.
// Beat times read from the VTT cues on 2026-11-21 (tools/cutroom/weekend-edge-v2/transcript-ava.json).
window.ANIM_DURATION = 90.0;
const ACC='#F2D06B', FG='#E1EEF5', MUT='#8fa3ad', OK='#4ade80', DN='#f87171', BLUE='#7baad4', BRD='rgba(56,225,255,.22)', CARD='#0a1016', TXS=1, WRAP=['',''];
const W=1160, H=530;
const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=u=>{u=clamp(u,0,1);return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;};
const lerp=(a,b,u)=>a+(b-a)*u;
const pr=(t,t0,d)=>ease((t-t0)/(d||0.6));          // eased progress 0..1 from t0 over d seconds
const on=(t,t0)=>t>=t0;
const op=(t,t0,d)=>clamp((t-t0)/(d||0.5),0,1);      // linear opacity ramp
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const txt=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${(o.sz||20)*TXS}" fill="${o.c||FG}" opacity="${o.o==null?1:o.o}" text-anchor="${o.a||'start'}" font-weight="${o.w||400}" class="${o.cls||''}" ${o.extra||''}>${esc(s)}</text>`;
const rect=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r==null?6:o.r}" fill="${o.f||'none'}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.5}" opacity="${o.o==null?1:o.o}" ${o.extra||''}/>`;
const circ=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.f||FG}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.5}" opacity="${o.o==null?1:o.o}"/>`;
const line=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.s||MUT}" stroke-width="${o.sw||2}" opacity="${o.o==null?1:o.o}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} stroke-linecap="round"/>`;
const path=(d,o={})=>`<path d="${d}" fill="${o.f||'none'}" stroke="${o.s||FG}" stroke-width="${o.sw||2}" opacity="${o.o==null?1:o.o}" stroke-linecap="round" stroke-linejoin="round" ${o.dash?`stroke-dasharray="${o.dash}"`:''}/>`;
const arrow=(x1,y1,x2,y2,o={})=>{const a=Math.atan2(y2-y1,x2-x1),h=10;return line(x1,y1,x2,y2,o)+path(`M${x2} ${y2} L${x2-h*Math.cos(a-0.5)} ${y2-h*Math.sin(a-0.5)} M${x2} ${y2} L${x2-h*Math.cos(a+0.5)} ${y2-h*Math.sin(a+0.5)}`,{s:o.s||MUT,sw:o.sw||2,o:o.o});};
// a labelled box that grows in from t0
const box=(t,t0,x,y,w,h,label,o={})=>{const u=pr(t,t0,0.5);if(u<=0)return '';const ww=w*u,hh=h;return rect(x+(w-ww)/2,y,ww,hh,{s:o.s||BRD,f:o.f||'rgba(255,255,255,.02)',sw:o.sw||1.5,o:u})+(u>.6?txt(x+w/2,y+h/2+(o.sz||20)/3,label,{a:'middle',sz:o.sz||20,c:o.c||FG,o:op(t,t0+.3,.3),w:o.w||500}):'');};
// deterministic pseudo-random
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
// a herd of dots in a region; drift is a slow deterministic wander
function herd(n,seed,x,y,w,h){const r=rng(seed);const pts=[];for(let i=0;i<n;i++)pts.push({x:x+r()*w,y:y+r()*h,p:r()*6.28,q:r()*6.28});return pts;}
const wander=(p,t,amp)=>[p.x+Math.sin(t*0.9+p.p)*amp,p.y+Math.cos(t*0.7+p.q)*amp];
// typewriter: the first k chars of s by time
const type=(s,t,t0,cps)=>s.slice(0,Math.max(0,Math.floor((t-t0)*(cps||28))));
// a list that reveals one row per step seconds from t0
function list(t,t0,step,items,x,y,o={}){let out='';items.forEach((s,i)=>{const o1=op(t,t0+i*step,0.4);if(o1>0)out+=txt(x,y+i*(o.lh||34),s,{sz:o.sz||22,c:o.c||FG,o:o1,w:o.w||400});});return out;}

const BEATS = [[0.5, "Page one. The label Ken reads first is <em>Van Tharp's market type</em>, as Ken applies it", "Ava."], [7.0, "Two questions, <em>nine</em> answers", ""], [10.0, "<em>Direction</em>: where did the S&amp;P close against its 200-day moving average?", ""], [16.0, "more than 2 % above: <em>bull</em> · within 2 %: <em>sideways</em> · more than 2 % below: <em>bear</em>", ""], [26.0, "<em>Volatility</em>: where does today's 14-day ATR % sit among the last 100 days?", ""], [33.0, "inside one SD of the average: <em>normal</em> · the top sixth: <em>volatile</em> · the bottom sixth: <em>quiet</em>", ""], [44.0, "Three by three", ""], [47.0, "In Ken's thirty-year test the next day was up on average in <em>four</em> cells: every bull cell, and sideways quiet", ""], [57.0, "<em>Down</em> in the three bear cells", ""], [61.0, "<em>Flat</em> in sideways normal and sideways volatile", ""], [67.0, "The words at the top of the report, <em>bullish normal</em>, name one of these nine cells", ""], [76.0, "Everything else in this course is read <em>after that label</em>", ""]];

const m1_pill=(x,y,s,o={})=>{const w=(o.w||s.length*10+22);return rect(x-w/2,y-15,w,30,{r:15,s:o.s||BRD,f:o.f||'rgba(255,255,255,.03)',o:o.o==null?1:o.o})+txt(x,y+6,s,{a:'middle',sz:o.sz||15,c:o.c||FG,o:o.o==null?1:o.o,w:o.wt||500});};
const m1_card=(x,y,w,h,o={})=>rect(x,y,w,h,{r:10,s:o.s||BRD,f:o.f||'rgba(255,255,255,.02)',o:o.o==null?1:o.o});
const m1_lab=(t,t0,x,y,s,o={})=>{const a=op(t,t0,o.d||.5);return a<=0?'':txt(x,y,s,{...o,o:a*(o.o==null?1:o.o)});};
// the 3x3 grid: rows bull / sideways / bear (top to bottom), cols volatile / normal / quiet (left to right)
// cells: {[r*3+c]: {f: fill, s: stroke, o: opacity, tag: text}}; (x,y) top-left, cw x ch per cell
const M1_ROWS=['bull','sideways','bear'], M1_COLS=['volatile','normal','quiet'];
function m1_grid(x,y,cw,ch,cells,o={}){const a=o.o==null?1:o.o;let s='';
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){const k=r*3+c,cl=(cells&&cells[k])||{};const cx=x+c*cw,cy=y+r*ch;
    s+=rect(cx,cy,cw-6,ch-6,{r:8,f:cl.f||'rgba(255,255,255,.02)',s:cl.s||BRD,sw:cl.sw||1.5,o:a*(cl.o==null?1:cl.o)});
    if(cl.tag)s+=txt(cx+(cw-6)/2,cy+(ch-6)/2+5,cl.tag,{a:'middle',sz:cl.sz||14,c:cl.c||FG,o:a*(cl.o==null?1:cl.o),w:500});}
  if(!o.noAxes){for(let r=0;r<3;r++)s+=txt(x-10,y+r*ch+ch/2,M1_ROWS[r],{a:'end',sz:14,c:MUT,o:a});
    for(let c=0;c<3;c++)s+=txt(x+c*cw+(cw-6)/2,y-10,M1_COLS[c],{a:'middle',sz:14,c:MUT,o:a});}
  return s;}
// a drifting price line over [x0,x1] at base y with amplitude amp (deterministic)
function m1_price(x0,x1,y,amp,seed,t){const r=rng(seed);let d='',v=0;for(let i=0;i<=40;i++){v+=(r()-.5)*amp*.6;v*=.92;const px=x0+(x1-x0)*i/40,py=y+v*1.6+Math.sin(i*.5+seed)*amp*.3;d+=(i?'L':'M')+px+' '+py+' ';}return d;}

function draw(t){
  let s='';
  const gx=400,gy=140,cw=130,ch=100;
  // axes appear with their questions
  if (t>=10){ const a=op(t,10,.6); s += txt(gx-30,gy-50,'direction ↓',{a:'end',sz:14,c:ACC,o:a}); s += m1_lab(t,16,60,gy+ch*0.5+5,'> +2 % of 200-day',{sz:13,c:MUT}); s += m1_lab(t,19,60,gy+ch*1.5+5,'within ±2 %',{sz:13,c:MUT}); s += m1_lab(t,22,60,gy+ch*2.5+5,'< −2 %',{sz:13,c:MUT}); }
  if (t>=26){ const a=op(t,26,.6); s += txt(gx+3*cw+10,gy-50,'volatility →',{sz:14,c:ACC,o:a}); s += m1_lab(t,33,gx+0*cw+(cw-6)/2,gy+3*ch+16,'top ⅙ of 100 d',{a:'middle',sz:12,c:MUT}); s += m1_lab(t,36,gx+1*cw+(cw-6)/2,gy+3*ch+16,'within ±1 SD',{a:'middle',sz:12,c:MUT}); s += m1_lab(t,39,gx+2*cw+(cw-6)/2,gy+3*ch+16,'bottom ⅙',{a:'middle',sz:12,c:MUT}); }
  const cells={}; for (let k=0;k<9;k++) cells[k]={o:op(t,44,.8)};
  const names=['bull volatile','bull normal','bull quiet','sideways volatile','sideways normal','sideways quiet','bear volatile','bear normal','bear quiet'];
  for (let k=0;k<9;k++){ cells[k].tag=names[k]; cells[k].sz=12; }
  if (t>=47) [0,1,2,5].forEach(k=>{ cells[k].f='rgba(74,222,128,.16)'; cells[k].s=OK; cells[k].c=OK; });
  if (t>=57) [6,7,8].forEach(k=>{ cells[k].f='rgba(248,113,113,.16)'; cells[k].s=DN; cells[k].c=DN; });
  if (t>=61) [3,4].forEach(k=>{ cells[k].f='rgba(255,255,255,.04)'; cells[k].c=MUT; });
  if (t>=67){ cells[1].sw=3; cells[1].s=ACC; cells[1].c=ACC; cells[1].tag='BULLISH NORMAL'; cells[1].sz=12; }
  if (t>=44) s += m1_grid(gx,gy,cw,ch,cells,{o:op(t,44,.8),noAxes:t<10});
  else { // before the grid: the two questions as text
    s += m1_pill(580,90,'two questions · nine answers',{o:op(t,7,.5),w:300,c:FG});
  }
  if (t>=47) s += m1_lab(t,47,gx+3*cw+14,gy+ch*0.5+5,'next day up, on average',{sz:13,c:OK});
  if (t>=57) s += m1_lab(t,57,gx+3*cw+14,gy+ch*2.5+5,'next day down',{sz:13,c:DN});
  if (t>=61) s += m1_lab(t,61,gx+3*cw+14,gy+ch*1.5+5,'flat',{sz:13,c:MUT});
  if (t>=67) s += m1_lab(t,67,60,gy+3*ch+60,'the label on page one is a cell',{sz:15,c:ACC});
  if (t>=76) s += m1_pill(580,478,'read everything else after that label',{o:op(t,76,.5),w:360,c:ACC,s:ACC});
  return s;
}

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  let cap = '', sub = '';
  for (const b of BEATS) if (t >= b[0]) { cap = b[1]; sub = b[2] || ''; }
  $('cap').innerHTML = cap; $('sub').textContent = sub;
  $('svg').innerHTML = WRAP[0] + draw(t) + WRAP[1];
  const f = $('fade');
  f.style.opacity = t < 0.5 ? 1 - t / 0.5 : (ANIM_DURATION - t < 0.6 ? 1 - (ANIM_DURATION - t) / 0.6 : 0);
};
renderFrame(0);
</script>
</body>
</html>
