<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>s54a · the valve</title>
<style>
  :root { --bg:#030507; --fg:#E1EEF5; --muted:#8fa3ad; --border:rgba(56,225,255,0.14); --accent:#F2D06B;
          --ok:#4ade80; --dn:#f87171; --card:#0a1016; --blue:#7baad4; }
  html, body { margin:0; background:var(--bg); overflow:hidden; }
  #stage { position:relative; width:1280px; height:720px; background:var(--bg); color:var(--fg);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #cap { position:absolute; left:60px; right:60px; top:30px; font-size:32px; font-weight:600; letter-spacing:-.01em; line-height:1.15; }
  #cap em { font-style:normal; color:var(--accent); }
  #sub { position:absolute; left:60px; width:1160px; top:648px; font-size:20px; color:var(--muted); line-height:1.4; }
  #scene { position:absolute; left:60px; top:112px; width:1160px; height:518px; border:1px solid var(--border);
           border-radius:10px; background:var(--card); overflow:hidden; }
  #svg { position:absolute; inset:0; }
  #fade { position:absolute; inset:0; background:var(--bg); pointer-events:none; opacity:0; }
  /* the picture-in-picture corner: build_v2 composites Ken's camera tile here (PIP_W/X/Y); the cutroom shows this placeholder */
  #pip { position:absolute; left:950px; top:22px; width:300px; height:169px; border:1px dashed rgba(56,225,255,0.35); border-radius:4px;
         display:none; color:var(--muted); font-size:13px; text-align:center; line-height:169px; }
  .pip #pip { display:block; } .pip #cap { right:360px; font-size:29px; }
  text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; fill:#E1EEF5; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; }
  #third { display:none; }
</style>
</head>
<body>
<div id="stage" class="pip">
  <div id="cap"></div>
  <div id="pip">Ken on camera, composited at render</div>
  <div id="scene"><svg id="svg" width="1160" height="530" viewBox="0 0 1160 530"></svg></div>
  <div id="third"></div>
  <div id="sub"></div>
  <div id="fade"></div>
</div>
<script>
const BUILD = 's54a-1';
console.log('[s54a] build', BUILD);
// Overdub twin of s54: Ken's audio rgs 2181.0→2305.0; t is seconds after the in-point.
// Beat times read from the VTT cues on 2026-11-21 (tools/cutroom/weekend-edge-v2/transcript-rgs.json).
window.ANIM_DURATION = 124.0;
const ACC='#F2D06B', FG='#E1EEF5', MUT='#8fa3ad', OK='#4ade80', DN='#f87171', BLUE='#7baad4', BRD='rgba(56,225,255,.22)', CARD='#0a1016', TXS=1, WRAP=['',''];
const W=1160, H=530;
const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=u=>{u=clamp(u,0,1);return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;};
const lerp=(a,b,u)=>a+(b-a)*u;
const pr=(t,t0,d)=>ease((t-t0)/(d||0.6));          // eased progress 0..1 from t0 over d seconds
const on=(t,t0)=>t>=t0;
const op=(t,t0,d)=>clamp((t-t0)/(d||0.5),0,1);      // linear opacity ramp
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const txt=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${(o.sz||20)*TXS}" fill="${o.c||FG}" opacity="${o.o==null?1:o.o}" text-anchor="${o.a||'start'}" font-weight="${o.w||400}" class="${o.cls||''}" ${o.extra||''}>${esc(s)}</text>`;
const rect=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r==null?6:o.r}" fill="${o.f||'none'}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.5}" opacity="${o.o==null?1:o.o}" ${o.extra||''}/>`;
const circ=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.f||FG}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.5}" opacity="${o.o==null?1:o.o}"/>`;
const line=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.s||MUT}" stroke-width="${o.sw||2}" opacity="${o.o==null?1:o.o}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} stroke-linecap="round"/>`;
const path=(d,o={})=>`<path d="${d}" fill="${o.f||'none'}" stroke="${o.s||FG}" stroke-width="${o.sw||2}" opacity="${o.o==null?1:o.o}" stroke-linecap="round" stroke-linejoin="round" ${o.dash?`stroke-dasharray="${o.dash}"`:''}/>`;
const arrow=(x1,y1,x2,y2,o={})=>{const a=Math.atan2(y2-y1,x2-x1),h=10;return line(x1,y1,x2,y2,o)+path(`M${x2} ${y2} L${x2-h*Math.cos(a-0.5)} ${y2-h*Math.sin(a-0.5)} M${x2} ${y2} L${x2-h*Math.cos(a+0.5)} ${y2-h*Math.sin(a+0.5)}`,{s:o.s||MUT,sw:o.sw||2,o:o.o});};
// a labelled box that grows in from t0
const box=(t,t0,x,y,w,h,label,o={})=>{const u=pr(t,t0,0.5);if(u<=0)return '';const ww=w*u,hh=h;return rect(x+(w-ww)/2,y,ww,hh,{s:o.s||BRD,f:o.f||'rgba(255,255,255,.02)',sw:o.sw||1.5,o:u})+(u>.6?txt(x+w/2,y+h/2+(o.sz||20)/3,label,{a:'middle',sz:o.sz||20,c:o.c||FG,o:op(t,t0+.3,.3),w:o.w||500}):'');};
// deterministic pseudo-random
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
// a herd of dots in a region; drift is a slow deterministic wander
function herd(n,seed,x,y,w,h){const r=rng(seed);const pts=[];for(let i=0;i<n;i++)pts.push({x:x+r()*w,y:y+r()*h,p:r()*6.28,q:r()*6.28});return pts;}
const wander=(p,t,amp)=>[p.x+Math.sin(t*0.9+p.p)*amp,p.y+Math.cos(t*0.7+p.q)*amp];
// typewriter: the first k chars of s by time
const type=(s,t,t0,cps)=>s.slice(0,Math.max(0,Math.floor((t-t0)*(cps||28))));
// a list that reveals one row per step seconds from t0
function list(t,t0,step,items,x,y,o={}){let out='';items.forEach((s,i)=>{const o1=op(t,t0+i*step,0.4);if(o1>0)out+=txt(x,y+i*(o.lh||34),s,{sz:o.sz||22,c:o.c||FG,o:o1,w:o.w||400});});return out;}

const BEATS = [[0.0, "managing a <em>valve</em> to increase or decrease the flow of water into a container <em>without spilling</em>", "To a student raising size after a drawdown."], [18.0, "let the <em>observations about the results</em> drive the next decision", ""], [34.0, "not how do you <em>feel</em> emotionally about where I am in my life stages", ""], [49.0, "what is the <em>evidence</em> that I use to justify a decision to increase or decrease risk", ""], [66.0, "the <em>three and the four period moving averages of expectancy</em> to shape the risk per trade", ""], [99.0, "they don't care how you feel. They care about <em>what you do</em>", ""], [116.0, "what are your <em>decision rules</em> for the adjustment in risk", ""]];

const m5_pill=(x,y,s,o={})=>{const w=(o.w||s.length*10+22);return rect(x-w/2,y-15,w,30,{r:15,s:o.s||BRD,f:o.f||'rgba(255,255,255,.03)',o:o.o==null?1:o.o})+txt(x,y+6,s,{a:'middle',sz:o.sz||15,c:o.c||FG,o:o.o==null?1:o.o,w:o.wt||500});};
const m5_card=(x,y,w,h,o={})=>rect(x,y,w,h,{r:10,s:o.s||BRD,f:o.f||'rgba(255,255,255,.02)',o:o.o==null?1:o.o});
const m5_lab=(t,t0,x,y,s,o={})=>{const a=op(t,t0,o.d||.5);return a<=0?'':txt(x,y,s,{...o,o:a*(o.o==null?1:o.o)});};
// the 3x3 market-type grid: rows volatile / normal / quiet, columns bear / sideways / bull; lit = [col,row]
function m5_grid(x,y,cell,o={}){const a=o.o==null?1:o.o;let s='';const cols=['bear','sideways','bull'],rows=['volatile','normal','quiet'];
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){const lit=o.lit&&o.lit[0]==c&&o.lit[1]==r;s+=rect(x+c*cell,y+r*cell,cell-4,cell-4,{r:4,f:lit?'rgba(242,208,107,.25)':'rgba(255,255,255,.02)',s:lit?ACC:BRD,sw:lit?2:1,o:a});}
  cols.forEach((c,i)=>s+=txt(x+i*cell+cell/2-2,y+3*cell+14,c,{a:'middle',sz:12,c:MUT,o:a}));
  rows.forEach((r,i)=>s+=txt(x-8,y+i*cell+cell/2+4,r,{a:'end',sz:12,c:MUT,o:a}));
  return s;}
// a bar that fills to u (0..1) from the left
const m5_bar=(x,y,w,h,u,o={})=>rect(x,y,w,h,{r:4,s:BRD,f:'none',o:o.o==null?1:o.o})+rect(x,y,Math.max(0,w*clamp(u,0,1)),h,{r:4,f:o.f||'rgba(242,208,107,.35)',s:'none',o:o.o==null?1:o.o});
// a small person
const m5_person=(x,y,o={})=>circ(x,y-14,8,{f:'none',s:o.c||FG,sw:2,o:o.o==null?1:o.o})+path(`M${x-14} ${y+20} C${x-14} ${y} ${x+14} ${y} ${x+14} ${y+20}`,{s:o.c||FG,sw:2,o:o.o==null?1:o.o});

function draw(t){
  let s='';
  // the pipe, the valve, the container
  const px=120, py=160;
  s += rect(px,py,420,26,{r:4,f:'rgba(255,255,255,.03)',s:BRD,o:op(t,0,.5)});
  s += rect(600,120,220,200,{r:8,f:'none',s:FG,sw:2,o:op(t,0,.5)});
  // the valve wheel at the pipe; its opening follows the moving average of expectancy once he names it, a steady half before
  const open = t<66 ? 0.5 : 0.5 + 0.35*Math.sin((t-66)/9);
  s += circ(360,py-30,22,{f:'none',s:ACC,sw:3,o:op(t,0,.5)}); s += line(360,py-30,360+20*Math.cos(open*3.1),py-30+20*Math.sin(open*3.1),{s:ACC,sw:3,o:op(t,0,.5)}); s += txt(360,py-62,'the valve',{a:'middle',sz:13,c:ACC,o:op(t,0,.5)});
  // the water level: fills with the opening, never above the rim
  const lvl = clamp(0.25 + 0.55*clamp(t/120,0,1)*open,0,0.9); s += rect(602,120+200*(1-lvl),216,200*lvl-2,{r:6,f:'rgba(96,165,250,.25)',s:'none',o:op(t,0,.5)}); s += txt(710,340,'without spilling',{a:'middle',sz:12,c:MUT,o:op(t,0,.5)});
  // the expectancy series and its moving averages, bottom
  if (t>=18){ const a=op(t,18,.6); const x0=120,y0=440,w=700; s += line(x0,y0,x0+w,y0,{s:BRD,sw:1,o:a}); s += txt(x0,y0+22,'results, trade by trade',{sz:12,c:MUT,o:a});
    const r=rng(54); const vals=[]; for(let i=0;i<40;i++) vals.push(0.4*Math.sin(i/6)+(r()-0.5)*1.2); const n=Math.floor(clamp((t-18)/60,0,1)*40);
    for(let i=0;i<n;i++) s += circ(x0+i*17.5,y0-vals[i]*40,2.5,{f:FG,o:a*0.8});
    if (t>=66){ const b=op(t,66,.6); let d3='',d4=''; for(let i=3;i<n;i++){ const m3=(vals[i]+vals[i-1]+vals[i-2])/3, m4=(vals[i]+vals[i-1]+vals[i-2]+vals[i-3])/4; d3+=(i==3?'M':'L')+(x0+i*17.5)+' '+(y0-m3*40)+' '; d4+=(i==3?'M':'L')+(x0+i*17.5)+' '+(y0-m4*40)+' '; } if(n>4){ s += path(d3,{s:ACC,sw:2,o:b}); s += path(d4,{s:OK,sw:2,o:b,dash:'5 4'}); } s += txt(x0+w+10,y0-30,'3-period',{sz:12,c:ACC,o:b}); s += txt(x0+w+10,y0-12,'4-period',{sz:12,c:OK,o:b}); s += txt(360,py+50,'the averages turn the wheel',{a:'middle',sz:12,c:ACC,o:b}); } }
  if (t>=34){ const a=op(t,34,.5); s += m5_card(860,120,260,60,{o:a,s:DN}); s += txt(990,156,'how I feel',{a:'middle',sz:14,c:DN,o:a}); s += line(880,150,1100,150,{s:DN,sw:2,o:a}); }
  if (t>=49){ const a=op(t,49,.5); s += m5_card(860,200,260,60,{o:a,s:OK}); s += txt(990,236,'the evidence',{a:'middle',sz:14,c:OK,o:a}); }
  if (t>=99) s += m5_lab(t,99,990,300,'what you do, not how you feel',{sz:13,c:FG,a:'middle'});
  if (t>=116) s += m5_lab(t,116,990,326,'decision rules for the adjustment in risk',{sz:12,c:MUT,a:'middle'});
  return s;
}

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  let cap = '', sub = '';
  for (const b of BEATS) if (t >= b[0]) { cap = b[1]; sub = b[2] || ''; }
  $('cap').innerHTML = cap; $('sub').textContent = sub;
  $('svg').innerHTML = WRAP[0] + draw(t) + WRAP[1];
  const f = $('fade');
  f.style.opacity = t < 0.5 ? 1 - t / 0.5 : (ANIM_DURATION - t < 0.6 ? 1 - (ANIM_DURATION - t) / 0.6 : 0);
};
renderFrame(0);
</script>
</body>
</html>
