<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>s41a · what a kata is; Kata 2 against the collapsing dragon</title>
<style>
  :root { --bg:#030507; --fg:#E1EEF5; --muted:#8fa3ad; --border:rgba(56,225,255,0.14); --accent:#F2D06B;
          --ok:#4ade80; --dn:#f87171; --card:#0a1016; --blue:#7baad4; }
  html, body { margin:0; background:var(--bg); overflow:hidden; }
  #stage { position:relative; width:1280px; height:720px; background:var(--bg); color:var(--fg);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #cap { position:absolute; left:60px; right:60px; top:30px; font-size:32px; font-weight:600; letter-spacing:-.01em; line-height:1.15; }
  #cap em { font-style:normal; color:var(--accent); }
  #sub { position:absolute; left:60px; width:1160px; top:648px; font-size:20px; color:var(--muted); line-height:1.4; }
  #scene { position:absolute; left:60px; top:112px; width:1160px; height:518px; border:1px solid var(--border);
           border-radius:10px; background:var(--card); overflow:hidden; }
  #svg { position:absolute; inset:0; }
  #fade { position:absolute; inset:0; background:var(--bg); pointer-events:none; opacity:0; }
  /* the picture-in-picture corner: build_v2 composites Ken's camera tile here (PIP_W/X/Y); the cutroom shows this placeholder */
  #pip { position:absolute; left:950px; top:22px; width:300px; height:169px; border:1px dashed rgba(56,225,255,0.35); border-radius:4px;
         display:none; color:var(--muted); font-size:13px; text-align:center; line-height:169px; }
  .pip #pip { display:block; } .pip #cap { right:360px; font-size:29px; }
  text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; fill:#E1EEF5; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; }
  #third { display:none; }
</style>
</head>
<body>
<div id="stage" class="pip">
  <div id="cap"></div>
  <div id="pip">Ken on camera, composited at render</div>
  <div id="scene"><svg id="svg" width="1160" height="530" viewBox="0 0 1160 530"></svg></div>
  <div id="third"></div>
  <div id="sub"></div>
  <div id="fade"></div>
</div>
<script>
const BUILD = 's41a-1';
console.log('[s41a] build', BUILD);
// Overdub twin of s41: Ken's audio kat 81.0→660.0; t is seconds after the in-point.
// Beat times read from the VTT cues on 2026-11-21 (tools/cutroom/weekend-edge-v2/transcript-kat.json).
window.ANIM_DURATION = 579.0;
const ACC='#F2D06B', FG='#E1EEF5', MUT='#8fa3ad', OK='#4ade80', DN='#f87171', BLUE='#7baad4', BRD='rgba(56,225,255,.22)', CARD='#0a1016', TXS=1, WRAP=['',''];
const W=1160, H=530;
const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=u=>{u=clamp(u,0,1);return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;};
const lerp=(a,b,u)=>a+(b-a)*u;
const pr=(t,t0,d)=>ease((t-t0)/(d||0.6));          // eased progress 0..1 from t0 over d seconds
const on=(t,t0)=>t>=t0;
const op=(t,t0,d)=>clamp((t-t0)/(d||0.5),0,1);      // linear opacity ramp
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const txt=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${(o.sz||20)*TXS}" fill="${o.c||FG}" opacity="${o.o==null?1:o.o}" text-anchor="${o.a||'start'}" font-weight="${o.w||400}" class="${o.cls||''}" ${o.extra||''}>${esc(s)}</text>`;
const rect=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r==null?6:o.r}" fill="${o.f||'none'}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.5}" opacity="${o.o==null?1:o.o}" ${o.extra||''}/>`;
const circ=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.f||FG}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.5}" opacity="${o.o==null?1:o.o}"/>`;
const line=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.s||MUT}" stroke-width="${o.sw||2}" opacity="${o.o==null?1:o.o}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} stroke-linecap="round"/>`;
const path=(d,o={})=>`<path d="${d}" fill="${o.f||'none'}" stroke="${o.s||FG}" stroke-width="${o.sw||2}" opacity="${o.o==null?1:o.o}" stroke-linecap="round" stroke-linejoin="round" ${o.dash?`stroke-dasharray="${o.dash}"`:''}/>`;
const arrow=(x1,y1,x2,y2,o={})=>{const a=Math.atan2(y2-y1,x2-x1),h=10;return line(x1,y1,x2,y2,o)+path(`M${x2} ${y2} L${x2-h*Math.cos(a-0.5)} ${y2-h*Math.sin(a-0.5)} M${x2} ${y2} L${x2-h*Math.cos(a+0.5)} ${y2-h*Math.sin(a+0.5)}`,{s:o.s||MUT,sw:o.sw||2,o:o.o});};
// a labelled box that grows in from t0
const box=(t,t0,x,y,w,h,label,o={})=>{const u=pr(t,t0,0.5);if(u<=0)return '';const ww=w*u,hh=h;return rect(x+(w-ww)/2,y,ww,hh,{s:o.s||BRD,f:o.f||'rgba(255,255,255,.02)',sw:o.sw||1.5,o:u})+(u>.6?txt(x+w/2,y+h/2+(o.sz||20)/3,label,{a:'middle',sz:o.sz||20,c:o.c||FG,o:op(t,t0+.3,.3),w:o.w||500}):'');};
// deterministic pseudo-random
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
// a herd of dots in a region; drift is a slow deterministic wander
function herd(n,seed,x,y,w,h){const r=rng(seed);const pts=[];for(let i=0;i<n;i++)pts.push({x:x+r()*w,y:y+r()*h,p:r()*6.28,q:r()*6.28});return pts;}
const wander=(p,t,amp)=>[p.x+Math.sin(t*0.9+p.p)*amp,p.y+Math.cos(t*0.7+p.q)*amp];
// typewriter: the first k chars of s by time
const type=(s,t,t0,cps)=>s.slice(0,Math.max(0,Math.floor((t-t0)*(cps||28))));
// a list that reveals one row per step seconds from t0
function list(t,t0,step,items,x,y,o={}){let out='';items.forEach((s,i)=>{const o1=op(t,t0+i*step,0.4);if(o1>0)out+=txt(x,y+i*(o.lh||34),s,{sz:o.sz||22,c:o.c||FG,o:o1,w:o.w||400});});return out;}

const BEATS = [[4.6, "the first thing I want to say about the <em>Kata 2</em>", ""], [9.3, "the key word is <em>Kata</em>: a form, or <em>standard work</em>", ""], [33.1, "in that form we're concerned about defense: a <em>front block</em>", "The martial-arts form, drilled to muscle memory."], [68.9, "later you learn the <em>back fist</em>, and realize: that's the same motion", ""], [97.7, "we build proficiency on patterns that are going to be <em>widely useful</em>", ""], [122.8, "Kata 2 was our <em>second favorite</em>; the first one being the <em>collapsing dragon</em>", ""], [137.9, "a harsh sell-off, a rebound, and when that thing <em>fails</em>", ""], [145.7, "the size of leg one is also the size of <em>leg two</em>: large and fast", ""], [161.2, "what we liked about Kata 2: if it <em>doesn't fail</em>, but holds support at a <em>higher level</em>", ""], [184.1, "we had a successful <em>SSC</em>; it sold off a little, then resumed", ""], [197.0, "if it breaks higher than the previous maximum excursion of the <em>RL10</em>", ""], [209.0, "that gives us new information: there's <em>new buyers</em> coming in", ""], [235.8, "the <em>emerging dragon</em>: new money stronger than the old sellers", ""], [273.7, "a winning SSC has already started to overcome the selling pressure", ""], [301.7, "to review: the collapsing dragon when it fails, <em>large and fast</em>", ""], [321.3, "if instead it holds: the <em>Kata 2</em>, buying it inside <em>the pocket</em>", ""], [361.7, "early in the recovery, during the quiet period before the move is confirmed", ""], [400.4, "everybody who was short this bounce puts their stops in here", "Why the upward move, when it works, can be really fast."], [426.8, "the <em>smallest possible risk</em>, inside the pocket", ""], [446.0, "moving my stop above my entry: <em>no lose, plus dinner for two</em>", ""], [452.9, "Kata is a <em>standard play</em> in a series: harsh winter, SSC, Kata 2", ""], [468.9, "and if the SSC fails, it takes us to the <em>collapsing dragon</em>", ""], [485.8, "the <em>PSAR flip</em> is sort of the official entry", ""], [515.5, "the sooner this thing fails, <em>the better</em>", ""], [551.9, "when it works we're already in: <em>managing our exit</em> instead of chasing an entry", ""], [562.4, "that's where the name <em>Kata 2</em> comes from", ""]];

const m4_pill=(x,y,s,o={})=>{const w=(o.w||s.length*10+22);return rect(x-w/2,y-15,w,30,{r:15,s:o.s||BRD,f:o.f||'rgba(255,255,255,.03)',o:o.o==null?1:o.o})+txt(x,y+6,s,{a:'middle',sz:o.sz||15,c:o.c||FG,o:o.o==null?1:o.o,w:o.wt||500});};
const m4_card=(x,y,w,h,o={})=>rect(x,y,w,h,{r:10,s:o.s||BRD,f:o.f||'rgba(255,255,255,.02)',o:o.o==null?1:o.o});
const m4_lab=(t,t0,x,y,s,o={})=>{const a=op(t,t0,o.d||.5);return a<=0?'':txt(x,y,s,{...o,o:a*(o.o==null?1:o.o)});};
// a polyline revealed from its first point to a fraction u of its length
function m4_poly(pts,u,o={}){u=clamp(u,0,1);if(u<=0)return '';const n=pts.length-1;const k=u*n;const i=Math.floor(k);let d=`M${pts[0][0]} ${pts[0][1]}`;for(let j=1;j<=Math.min(i,n);j++)d+=` L${pts[j][0]} ${pts[j][1]}`;if(i<n){const f=k-i;d+=` L${lerp(pts[i][0],pts[i+1][0],f)} ${lerp(pts[i][1],pts[i+1][1],f)}`;}return path(d,{s:o.s||FG,sw:o.sw||2.5,o:o.o==null?1:o.o,dash:o.dash});}
// a ring around a point that fades in from t0
const m4_ring=(t,t0,x,y,o={})=>{const a=op(t,t0,.5);return a<=0?'':circ(x,y,o.r||14,{f:'none',s:o.c||ACC,sw:2.5,o:a});};
// a horizontal level with a tag at the right
const m4_level=(t,t0,x1,x2,y,s,o={})=>{const a=op(t,t0,.5);return a<=0?'':line(x1,y,x2,y,{s:o.c||ACC,sw:1.5,o:a,dash:o.dash||'6 5'})+txt(x2+8,y+5,s,{sz:o.sz||13,c:o.c||ACC,o:a});};
// PSAR dots under (side=1) or over (side=-1) a path segment
function m4_dots(t,t0,pts,side,o={}){const a=op(t,t0,.5);if(a<=0)return '';let s='';pts.forEach(p=>{s+=circ(p[0],p[1]+side*18,3,{f:o.c||FG,o:a});});return s;}

function draw(t){
  let s='';
  // the word, top-left
  s += m4_pill(150,60,'Kata',{o:op(t,9.3,.5),w:110,c:ACC,s:ACC,sz:18});
  s += m4_lab(t,13.0,215,66,'a form · standard work',{sz:15,c:MUT});
  s += m4_lab(t,33.1,70,110,'front block',{sz:13,c:MUT}); s += m4_lab(t,68.9,160,110,'back fist: the same motion',{sz:13,c:MUT});
  s += m4_lab(t,97.7,70,136,'widely useful patterns',{sz:13,c:ACC});
  // the price path: harsh winter down (A), SSC leg up (B), pullback to a higher low (C), resume to the RL10 peak line (D), break (E)
  const A=[[120,220],[200,290],[260,360],[330,420]];            // the harsh winter
  const B=[[330,420],[380,380],[430,330],[470,300]];            // SSC: the first leg back
  const C=[[470,300],[500,330],[525,350]];                      // the pullback: the pocket
  const D=[[525,350],[560,320],[600,300],[640,270]];            // resumes to the previous RL10 peak
  const E=[[640,270],[690,220],[740,170],[790,130]];            // the emerging dragon
  const F=[[525,350],[560,400],[600,460],[640,500]];            // the failing branch: the collapsing dragon
  if (t>=137.9){ s += m4_poly(A,pr(t,137.9,1.5)); s += m4_lab(t,138.5,120,205,'harsh winter',{sz:13,c:DN}); }
  if (t>=140.1){ s += m4_poly(B,pr(t,140.1,1.2)); s += m4_lab(t,184.1,440,280,'SSC',{sz:14,c:OK}); }
  if (t>=142.7 && t<161.2){ const u=pr(t,142.7,1.5); s += m4_poly(F,u,{s:DN}); s += m4_lab(t,145.7,650,490,'leg two = leg one',{sz:13,c:DN}); }
  if (t>=161.2){ const u=pr(t,161.2,1.2); s += m4_poly(C,u); s += m4_ring(t,165.1,525,350,{c:OK}); }
  // the notes about the pocket, a column at the right (one tag stays at the pocket itself)
  s += m4_lab(t,168.6,700,310,'holds at a higher low',{sz:13,c:OK});
  s += m4_lab(t,426.8,700,335,'the smallest possible risk',{sz:13,c:DN});
  s += m4_lab(t,449.4,700,360,'stop above entry: no lose + dinner for two',{sz:12,c:OK});
  s += m4_lab(t,361.7,700,385,'early, before the move is confirmed',{sz:12,c:MUT});
  if (t>=184.1){ s += m4_poly(D,pr(t,188.3,1.5)); }
  if (t>=197.0){ s += m4_level(t,197.0,420,800,270,'RL10 peak',{c:ACC}); }
  if (t>=209.0){ s += m4_poly(E,pr(t,209.0,1.5),{s:OK,sw:3}); s += m4_lab(t,211.2,700,120,'new buyers',{sz:14,c:OK}); }
  if (t>=235.8){ s += m4_lab(t,235.8,700,150,'the emerging dragon',{sz:13,c:MUT}); }
  // the pocket, named and shaded, when he says it
  if (t>=321.3){ const a=op(t,321.3,.6); s += rect(490,300,70,56,{r:6,f:'rgba(74,222,128,.10)',s:OK,sw:1.5,o:a,extra:'stroke-dasharray="4 3"'}); s += m4_lab(t,324.1,560,345,'the pocket',{sz:14,c:OK}); }
  if (t>=400.4){ const a=op(t,400.4,.5); for (let i=0;i<4;i++) s += line(610+i*22,262,610+i*22,250,{s:DN,sw:2,o:a}); s += m4_lab(t,403.6,560,240,"shorts' stops",{sz:12,c:DN}); }
  if (t>=426.8){ const a=op(t,426.8,.5); s += line(492,362,558,362,{s:DN,sw:2.5,o:a}); }
  if (t>=446.0){ const a=op(t,446.0,.5); s += line(492,296,558,296,{s:OK,sw:2.5,o:a}); }
  // the series as a chain of pills along the bottom row: harsh winter > SSC > Kata 2 > (pocket fails) collapsing dragon
  if (t>=452.9){ s += m4_pill(120,480,'harsh winter',{o:op(t,461.9,.5),w:120,c:DN,s:DN}); s += arrow(183,480,208,480,{s:MUT,o:op(t,465,.5)}); s += m4_pill(250,480,'SSC',{o:op(t,465.5,.5),w:80,c:OK,s:OK}); s += arrow(293,480,313,480,{s:MUT,o:op(t,468.9,.5)}); s += m4_pill(360,480,'Kata 2',{o:op(t,468.9,.5),w:90,c:ACC,s:ACC}); }
  if (t>=468.9){ s += arrow(408,480,443,480,{s:DN,o:op(t,472.1,.5)}); s += m4_lab(t,472.1,425,503,'if it fails',{sz:11,c:DN,a:'middle'}); s += m4_pill(525,480,'collapsing dragon',{o:op(t,472.1,.5),w:150,c:DN,s:DN,sz:14}); s += m4_poly(F.slice(0,3),pr(t,472.1,1.2),{s:DN}); }
  if (t>=485.8){ s += m4_dots(t,485.8,[[330,420],[350,430]],1,{c:ACC}); s += m4_lab(t,488.8,365,452,'PSAR flip: the official entry',{sz:12,c:ACC}); }
  if (t>=515.5){ s += m4_lab(t,515.5,620,485,'the sooner it fails, the better',{sz:12,c:MUT}); }
  if (t>=551.9){ s += m4_pill(980,480,'manage the exit, not the entry',{o:op(t,559.3,.5),w:230,c:ACC,s:ACC,sz:13}); }
  if (t>=562.4){ s += m4_lab(t,565.3,980,505,'that is where the name comes from',{sz:12,c:MUT,a:'middle'}); }
  return s;
}

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  let cap = '', sub = '';
  for (const b of BEATS) if (t >= b[0]) { cap = b[1]; sub = b[2] || ''; }
  $('cap').innerHTML = cap; $('sub').textContent = sub;
  $('svg').innerHTML = WRAP[0] + draw(t) + WRAP[1];
  const f = $('fade');
  f.style.opacity = t < 0.5 ? 1 - t / 0.5 : (ANIM_DURATION - t < 0.6 ? 1 - (ANIM_DURATION - t) / 0.6 : 0);
};
renderFrame(0);
</script>
</body>
</html>
