<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>s14a · intuition: anomaly detection</title>
<style>
  :root { --bg:#030507; --fg:#E1EEF5; --muted:#8fa3ad; --border:rgba(56,225,255,0.14); --accent:#F2D06B;
          --ok:#4ade80; --dn:#f87171; --card:#0a1016; --blue:#7baad4; }
  html, body { margin:0; background:var(--bg); overflow:hidden; }
  #stage { position:relative; width:1280px; height:720px; background:var(--bg); color:var(--fg);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #cap { position:absolute; left:60px; right:60px; top:30px; font-size:32px; font-weight:600; letter-spacing:-.01em; line-height:1.15; }
  #cap em { font-style:normal; color:var(--accent); }
  #sub { position:absolute; left:60px; width:1160px; top:648px; font-size:20px; color:var(--muted); line-height:1.4; }
  #scene { position:absolute; left:60px; top:112px; width:1160px; height:518px; border:1px solid var(--border);
           border-radius:10px; background:var(--card); overflow:hidden; }
  #svg { position:absolute; inset:0; }
  #fade { position:absolute; inset:0; background:var(--bg); pointer-events:none; opacity:0; }
  /* the picture-in-picture corner: build_v2 composites Ken's camera tile here (PIP_W/X/Y); the cutroom shows this placeholder */
  #pip { position:absolute; left:950px; top:22px; width:300px; height:169px; border:1px dashed rgba(56,225,255,0.35); border-radius:4px;
         display:none; color:var(--muted); font-size:13px; text-align:center; line-height:169px; }
  .pip #pip { display:block; } .pip #cap { right:360px; font-size:29px; }
  text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; fill:#E1EEF5; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; }
</style>
</head>
<body>
<div id="stage" class="">
  <div id="cap"></div>
  <div id="pip">Ken on camera, composited at render</div>
  <div id="scene"><svg id="svg" width="1160" height="530" viewBox="0 0 1160 530"></svg></div>
  <div id="sub"></div>
  <div id="fade"></div>
</div>
<script>
const BUILD = 's14a-2';
console.log('[s14a] build', BUILD);
// Overdub twin of s14: Ken's audio hva 1929→2031; t is seconds after the in-point.
// Beat times read from the VTT cues on 2026-11-16 (tools/cutroom/mental-model-v2/transcript-hva.json).
window.ANIM_DURATION = 102.0;

const ACC='#F2D06B', FG='#E1EEF5', MUT='#8fa3ad', OK='#4ade80', DN='#f87171', BLUE='#7baad4', BRD='rgba(56,225,255,.22)', CARD='#0a1016';
const W=1160, H=530;
const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=u=>{u=clamp(u,0,1);return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;};
const lerp=(a,b,u)=>a+(b-a)*u;
const pr=(t,t0,d)=>ease((t-t0)/(d||0.6));          // eased progress 0..1 from t0 over d seconds
const on=(t,t0)=>t>=t0;
const op=(t,t0,d)=>clamp((t-t0)/(d||0.5),0,1);      // linear opacity ramp
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const txt=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${o.sz||20}" fill="${o.c||FG}" opacity="${o.o==null?1:o.o}" text-anchor="${o.a||'start'}" font-weight="${o.w||400}" class="${o.cls||''}" ${o.extra||''}>${esc(s)}</text>`;
const rect=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r==null?6:o.r}" fill="${o.f||'none'}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.5}" opacity="${o.o==null?1:o.o}" ${o.extra||''}/>`;
const circ=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.f||FG}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.5}" opacity="${o.o==null?1:o.o}"/>`;
const line=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.s||MUT}" stroke-width="${o.sw||2}" opacity="${o.o==null?1:o.o}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} stroke-linecap="round"/>`;
const path=(d,o={})=>`<path d="${d}" fill="${o.f||'none'}" stroke="${o.s||FG}" stroke-width="${o.sw||2}" opacity="${o.o==null?1:o.o}" stroke-linecap="round" stroke-linejoin="round" ${o.dash?`stroke-dasharray="${o.dash}"`:''}/>`;
const arrow=(x1,y1,x2,y2,o={})=>{const a=Math.atan2(y2-y1,x2-x1),h=10;return line(x1,y1,x2,y2,o)+path(`M${x2} ${y2} L${x2-h*Math.cos(a-0.5)} ${y2-h*Math.sin(a-0.5)} M${x2} ${y2} L${x2-h*Math.cos(a+0.5)} ${y2-h*Math.sin(a+0.5)}`,{s:o.s||MUT,sw:o.sw||2,o:o.o});};
// a labelled box that grows in from t0
const box=(t,t0,x,y,w,h,label,o={})=>{const u=pr(t,t0,0.5);if(u<=0)return '';const ww=w*u,hh=h;return rect(x+(w-ww)/2,y,ww,hh,{s:o.s||BRD,f:o.f||'rgba(255,255,255,.02)',sw:o.sw||1.5,o:u})+(u>.6?txt(x+w/2,y+h/2+(o.sz||20)/3,label,{a:'middle',sz:o.sz||20,c:o.c||FG,o:op(t,t0+.3,.3),w:o.w||500}):'');};
// deterministic pseudo-random
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
// a herd of dots in a region; drift is a slow deterministic wander
function herd(n,seed,x,y,w,h){const r=rng(seed);const pts=[];for(let i=0;i<n;i++)pts.push({x:x+r()*w,y:y+r()*h,p:r()*6.28,q:r()*6.28});return pts;}
const wander=(p,t,amp)=>[p.x+Math.sin(t*0.9+p.p)*amp,p.y+Math.cos(t*0.7+p.q)*amp];
// typewriter: the first k chars of s by time
const type=(s,t,t0,cps)=>s.slice(0,Math.max(0,Math.floor((t-t0)*(cps||28))));
// a list that reveals one row per step seconds from t0
function list(t,t0,step,items,x,y,o={}){let out='';items.forEach((s,i)=>{const o1=op(t,t0+i*step,0.4);if(o1>0)out+=txt(x,y+i*(o.lh||34),s,{sz:o.sz||22,c:o.c||FG,o:o1,w:o.w||400});});return out;}

const BEATS = [[3.1, "<em>Intuition</em>: the creative spark", ""], [14.5, "Tapped into the visual cortex", "Designed to detect differences, anomalies, movement."], [26.8, "A survival instinct", "Charging tigers, hiding tigers; and targets you can go eat."], [39.9, "A wide lens: what peripheral vision sees is <em>movement</em>", ""], [47.7, "The thing was there, but until it moves you don't see it", ""], [52.0, "Moving against a stationary background: you see the edge of it", ""], [58.5, "The brain is wired to detect anomalies on the wider field of vision", ""], [66.0, "In quality control my dad would say: <em>good parts don't look funny</em>", ""], [72.2, "Twenty bent tubes on the rack, all facing one way", ""], [88.8, "One facing the other way is probably the part that's wrong", ""], [94.2, "Good parts don't look funny. We are wired to detect divergences.", ""]];

// a stick figure: head + shoulders, c = colour
const person=(x,y,o={})=>circ(x,y-14,9,{f:'none',s:o.c||FG,sw:2,o:o.o==null?1:o.o})+path(`M${x-16} ${y+22} C${x-16} ${y} ${x+16} ${y} ${x+16} ${y+22}`,{s:o.c||FG,sw:2,o:o.o==null?1:o.o});
// a pill label
const pill=(x,y,s,o={})=>{const w=(o.w||s.length*10+22);return rect(x-w/2,y-15,w,30,{r:15,s:o.s||BRD,f:o.f||'rgba(255,255,255,.03)',o:o.o==null?1:o.o})+txt(x,y+6,s,{a:'middle',sz:o.sz||15,c:o.c||FG,o:o.o==null?1:o.o,w:o.wt||500});};
// a candle chart from a seed; n bars, rising drift d
function candles(x,y,w,h,n,seed,d){const r=rng(seed);let v=h*0.55,s='';const bw=w/n;for(let i=0;i<n;i++){const o1=v;v=clamp(v-(r()-0.5+ (d||0))*h*0.12,8,h-8);const hi=Math.min(o1,v)-r()*8,lo=Math.max(o1,v)+r()*8;const up=v<o1;s+=line(x+i*bw+bw/2,y+hi,x+i*bw+bw/2,y+lo,{s:up?OK:DN,sw:1.5});s+=rect(x+i*bw+2,y+Math.min(o1,v),bw-4,Math.max(2,Math.abs(v-o1)),{f:up?OK:DN,r:1});}return s;}
// a teeter-totter plank on a fulcrum at (cx,cy), half-length L, tilt in degrees
const plank=(cx,cy,L,deg,o={})=>{const a=deg*Math.PI/180,dx=Math.cos(a)*L,dy=Math.sin(a)*L;return path(`M${cx-22} ${cy+36} L${cx} ${cy} L${cx+22} ${cy+36} Z`,{s:MUT,sw:2,f:'rgba(255,255,255,.04)',o:o.o==null?1:o.o})+line(cx-dx,cy-dy,cx+dx,cy+dy,{s:o.s||FG,sw:o.sw||5,o:o.o==null?1:o.o});};
// a point on that plank at fraction u (-1 left end .. +1 right end), lifted by r
const onPlank=(cx,cy,L,deg,u,r)=>{const a=deg*Math.PI/180;return [cx+Math.cos(a)*L*u-Math.sin(a)*-r*0, cy+Math.sin(a)*L*u-(r||0)];};

const FIELD = herd(120, 21, 90, 90, 980, 330);
function draw(t){
  let s='';
  if (t<66){
    // the wide field: static dots; one of them starts moving at 45 s
    const of=op(t,14.5,.8);
    FIELD.forEach((p,i)=>{ let x=p.x,y=p.y; if(i==57 && t>=45){ const u=(t-45)*0.5; x+=Math.sin(u)*40; y+=Math.cos(u*0.7)*26; } s += circ(x,y,i==57&&t>=45?6:3.5,{f:i==57&&t>=47.7?ACC:MUT,o:of*(i==57&&t>=47.7?1:0.45)}); });
    // the lens: a wide ellipse
    if (t>=39.9){ const o=op(t,39.9,.6); s += `<ellipse cx="580" cy="255" rx="${500*pr(t,39.9,1)}" ry="175" fill="none" stroke="${ACC}" stroke-width="2" opacity="${o}"/>`; s += txt(580,470,'the wide lens: peripheral vision sees movement',{a:'middle',c:ACC,sz:15,o}); }
    if (t>=52 && t<58.5){ const p=FIELD[57]; const u=(t-45)*0.5; s += circ(p.x+Math.sin(u)*40,p.y+Math.cos(u*0.7)*26,16,{f:'none',s:ACC,sw:2,o:op(t,52,.5)}); }
    if (t>=3.1 && t<14.5){ const g=0.5+0.5*Math.sin(t*5); s += circ(580,255,20+10*g,{f:'none',s:ACC,sw:2,o:0.7*g}); s += circ(580,255,8,{f:ACC}); s += txt(580,310,'the spark',{a:'middle',c:ACC,sz:15}); }
    if (t>=26.8 && t<39.9){ const o=op(t,26.8,.5); s += txt(300,470,'charging tigers · hiding tigers',{a:'middle',c:DN,sz:14,o}); s += txt(860,470,'targets you can eat',{a:'middle',c:OK,sz:14,o:op(t,36.4,.5)}); }
  } else {
    // the rack of twenty bent tubes
    const o=op(t,66,.6); s += line(100,130,1060,130,{s:MUT,sw:4,o}); s += txt(580,110,'the rack',{a:'middle',c:MUT,sz:13,o});
    const n = t<72.2 ? 0 : Math.min(20, Math.floor((t-72.2)*2.2)+1);
    for(let i=0;i<n;i++){ const x=130+i*48; const flip = i==13 && t>=88.8; const col=flip?DN:FG; const dir=flip?-1:1;
      s += line(x,130,x,230,{s:col,sw:4}); s += path(`M${x} 230 Q${x} 260 ${x+dir*28} 262`,{s:col,sw:4}); if(flip){ s += circ(x-6,300,22,{f:'none',s:DN,sw:2,o:op(t,88.8,.5)}); } }
    if (t>=88.8) s += txt(754,350,'this one looks funny',{a:'middle',c:DN,sz:15,o:op(t,89.5,.5)});
    if (t>=94.2) s += txt(580,470,'wired to detect divergences',{a:'middle',c:ACC,sz:17,o:op(t,94.2,.5)});
    s += pill(580,420,'good parts don’t look funny',{c:ACC,s:ACC,sz:17,w:330,o:op(t,66.5,.5)});
  }
  return s;
}

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  let cap = '', sub = '';
  for (const b of BEATS) if (t >= b[0]) { cap = b[1]; sub = b[2] || ''; }
  $('cap').innerHTML = cap; $('sub').textContent = sub;
  $('svg').innerHTML = draw(t);
  const f = $('fade');
  f.style.opacity = t < 0.5 ? 1 - t / 0.5 : (ANIM_DURATION - t < 0.6 ? 1 - (ANIM_DURATION - t) / 0.6 : 0);
};
renderFrame(0);
</script>
</body>
</html>
