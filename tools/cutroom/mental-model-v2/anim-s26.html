<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>s26 · bulls, bears and the demographics</title>
<style>
  :root { --bg:#030507; --fg:#E1EEF5; --muted:#8fa3ad; --border:rgba(56,225,255,0.14); --accent:#F2D06B;
          --ok:#4ade80; --dn:#f87171; --card:#0a1016; --blue:#7baad4; }
  html, body { margin:0; background:var(--bg); overflow:hidden; }
  #stage { position:relative; width:1280px; height:720px; background:var(--bg); color:var(--fg);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #cap { position:absolute; left:60px; right:60px; top:30px; font-size:32px; font-weight:600; letter-spacing:-.01em; line-height:1.15; }
  #cap em { font-style:normal; color:var(--accent); }
  #sub { position:absolute; left:60px; width:1160px; top:648px; font-size:20px; color:var(--muted); line-height:1.4; }
  #scene { position:absolute; left:60px; top:112px; width:1160px; height:518px; border:1px solid var(--border);
           border-radius:10px; background:var(--card); overflow:hidden; }
  #svg { position:absolute; inset:0; }
  #fade { position:absolute; inset:0; background:var(--bg); pointer-events:none; opacity:0; }
  /* the picture-in-picture corner: build_v2 composites Ken's camera tile here (PIP_W/X/Y); the cutroom shows this placeholder */
  #pip { position:absolute; left:950px; top:22px; width:300px; height:169px; border:1px dashed rgba(56,225,255,0.35); border-radius:4px;
         display:none; color:var(--muted); font-size:13px; text-align:center; line-height:169px; }
  .pip #pip { display:block; } .pip #cap { right:360px; font-size:29px; }
  text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; fill:#E1EEF5; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; }
</style>
</head>
<body>
<div id="stage" class="">
  <div id="cap"></div>
  <div id="pip">Ken on camera, composited at render</div>
  <div id="scene"><svg id="svg" width="1160" height="530" viewBox="0 0 1160 530"></svg></div>
  <div id="sub"></div>
  <div id="fade"></div>
</div>
<script>
const BUILD = 's26-2';
console.log('[s26] build', BUILD);
// Overdub twin of s26: Ken's audio keu 424→749; t is seconds after the in-point.
// Beat times read from the VTT cues on 2026-11-16 (tools/cutroom/mental-model-v2/transcript-keu.json).
window.ANIM_DURATION = 325.0;

const ACC='#F2D06B', FG='#E1EEF5', MUT='#8fa3ad', OK='#4ade80', DN='#f87171', BLUE='#7baad4', BRD='rgba(56,225,255,.22)', CARD='#0a1016';
const W=1160, H=530;
const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=u=>{u=clamp(u,0,1);return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;};
const lerp=(a,b,u)=>a+(b-a)*u;
const pr=(t,t0,d)=>ease((t-t0)/(d||0.6));          // eased progress 0..1 from t0 over d seconds
const on=(t,t0)=>t>=t0;
const op=(t,t0,d)=>clamp((t-t0)/(d||0.5),0,1);      // linear opacity ramp
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const txt=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${o.sz||20}" fill="${o.c||FG}" opacity="${o.o==null?1:o.o}" text-anchor="${o.a||'start'}" font-weight="${o.w||400}" class="${o.cls||''}" ${o.extra||''}>${esc(s)}</text>`;
const rect=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r==null?6:o.r}" fill="${o.f||'none'}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.5}" opacity="${o.o==null?1:o.o}" ${o.extra||''}/>`;
const circ=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.f||FG}" stroke="${o.s||'none'}" stroke-width="${o.sw||1.5}" opacity="${o.o==null?1:o.o}"/>`;
const line=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.s||MUT}" stroke-width="${o.sw||2}" opacity="${o.o==null?1:o.o}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} stroke-linecap="round"/>`;
const path=(d,o={})=>`<path d="${d}" fill="${o.f||'none'}" stroke="${o.s||FG}" stroke-width="${o.sw||2}" opacity="${o.o==null?1:o.o}" stroke-linecap="round" stroke-linejoin="round" ${o.dash?`stroke-dasharray="${o.dash}"`:''}/>`;
const arrow=(x1,y1,x2,y2,o={})=>{const a=Math.atan2(y2-y1,x2-x1),h=10;return line(x1,y1,x2,y2,o)+path(`M${x2} ${y2} L${x2-h*Math.cos(a-0.5)} ${y2-h*Math.sin(a-0.5)} M${x2} ${y2} L${x2-h*Math.cos(a+0.5)} ${y2-h*Math.sin(a+0.5)}`,{s:o.s||MUT,sw:o.sw||2,o:o.o});};
// a labelled box that grows in from t0
const box=(t,t0,x,y,w,h,label,o={})=>{const u=pr(t,t0,0.5);if(u<=0)return '';const ww=w*u,hh=h;return rect(x+(w-ww)/2,y,ww,hh,{s:o.s||BRD,f:o.f||'rgba(255,255,255,.02)',sw:o.sw||1.5,o:u})+(u>.6?txt(x+w/2,y+h/2+(o.sz||20)/3,label,{a:'middle',sz:o.sz||20,c:o.c||FG,o:op(t,t0+.3,.3),w:o.w||500}):'');};
// deterministic pseudo-random
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
// a herd of dots in a region; drift is a slow deterministic wander
function herd(n,seed,x,y,w,h){const r=rng(seed);const pts=[];for(let i=0;i<n;i++)pts.push({x:x+r()*w,y:y+r()*h,p:r()*6.28,q:r()*6.28});return pts;}
const wander=(p,t,amp)=>[p.x+Math.sin(t*0.9+p.p)*amp,p.y+Math.cos(t*0.7+p.q)*amp];
// typewriter: the first k chars of s by time
const type=(s,t,t0,cps)=>s.slice(0,Math.max(0,Math.floor((t-t0)*(cps||28))));
// a list that reveals one row per step seconds from t0
function list(t,t0,step,items,x,y,o={}){let out='';items.forEach((s,i)=>{const o1=op(t,t0+i*step,0.4);if(o1>0)out+=txt(x,y+i*(o.lh||34),s,{sz:o.sz||22,c:o.c||FG,o:o1,w:o.w||400});});return out;}

const BEATS = [[0.0, "The bears have a bias: make it go down", ""], [8.2, "The bulls have the optimistic bias", ""], [13.8, "Whichever side is overweighted is winning", ""], [20.2, "I have no emotional investment in the winning and losing, as they define it", ""], [29.5, "Each group has a list of reasons why they're correct", "They take positions based on their list."], [45.5, "All I do is scan the sector and see which side has the fat guys", "Which way is the momentum going?"], [58.8, "Connect that to the <em>demographics</em>", ""], [67.1, "The 3-minute, 30-minute, daily, 3-day, n-day guys", "Buckets of demographics: the timeframe cohorts, not population demographics."], [86.2, "Each bucket has some on the plus side and some on the minus", ""], [99.1, "If the n-day gets into a critical state by location", "Top or bottom of the look-back; say the 150-day."], [121.1, "What's the level of agitation of each one?", "Cruising in a normal band, or extremely oversold and fearful, or wildly optimistic?"], [164.4, "That's price location. Now look at it as a <em>heat map</em>", ""], [168.5, "The 9-day and 3-day guys are extra agitated: location plus volatility", ""], [180.8, "Now they want in, with a real strong position", ""], [188.6, "The positives jump on this side, the negatives on that side", ""], [197.2, "When all of them are in an exaggerated state of emotionality", "They're likely to be trading larger than normal."], [209.2, "On the 3-minute and 30-minute charts the intraday traders are used to a certain volume", ""], [236.7, "They're not even looking at the longer-term traders", ""], [243.2, "Conditions where the longer-term traders are also agitated: location and volatility", ""], [258.8, "When price moves out: the day-trading volume, plus the swing and position traders", ""], [272.8, "The teeter-totter oscillates wildly: <em>range-stat moves</em>", "It catches everybody by surprise."], [295.8, "The room is crowded", "Everybody is surprised by how many others are trading this thing."], [310.0, "Short-term momentum breaks a channel; the swing and position traders pile in", "Large directional moves."]];

// a stick figure: head + shoulders, c = colour
const person=(x,y,o={})=>circ(x,y-14,9,{f:'none',s:o.c||FG,sw:2,o:o.o==null?1:o.o})+path(`M${x-16} ${y+22} C${x-16} ${y} ${x+16} ${y} ${x+16} ${y+22}`,{s:o.c||FG,sw:2,o:o.o==null?1:o.o});
// a pill label
const pill=(x,y,s,o={})=>{const w=(o.w||s.length*10+22);return rect(x-w/2,y-15,w,30,{r:15,s:o.s||BRD,f:o.f||'rgba(255,255,255,.03)',o:o.o==null?1:o.o})+txt(x,y+6,s,{a:'middle',sz:o.sz||15,c:o.c||FG,o:o.o==null?1:o.o,w:o.wt||500});};
// a candle chart from a seed; n bars, rising drift d
function candles(x,y,w,h,n,seed,d){const r=rng(seed);let v=h*0.55,s='';const bw=w/n;for(let i=0;i<n;i++){const o1=v;v=clamp(v-(r()-0.5+ (d||0))*h*0.12,8,h-8);const hi=Math.min(o1,v)-r()*8,lo=Math.max(o1,v)+r()*8;const up=v<o1;s+=line(x+i*bw+bw/2,y+hi,x+i*bw+bw/2,y+lo,{s:up?OK:DN,sw:1.5});s+=rect(x+i*bw+2,y+Math.min(o1,v),bw-4,Math.max(2,Math.abs(v-o1)),{f:up?OK:DN,r:1});}return s;}
// a teeter-totter plank on a fulcrum at (cx,cy), half-length L, tilt in degrees
const plank=(cx,cy,L,deg,o={})=>{const a=deg*Math.PI/180,dx=Math.cos(a)*L,dy=Math.sin(a)*L;return path(`M${cx-22} ${cy+36} L${cx} ${cy} L${cx+22} ${cy+36} Z`,{s:MUT,sw:2,f:'rgba(255,255,255,.04)',o:o.o==null?1:o.o})+line(cx-dx,cy-dy,cx+dx,cy+dy,{s:o.s||FG,sw:o.sw||5,o:o.o==null?1:o.o});};
// a point on that plank at fraction u (-1 left end .. +1 right end), lifted by r
const onPlank=(cx,cy,L,deg,u,r)=>{const a=deg*Math.PI/180;return [cx+Math.cos(a)*L*u-Math.sin(a)*-r*0, cy+Math.sin(a)*L*u-(r||0)];};

const BK=[['3 min',67.1],['30 min',69.5],['daily',70.6],['3 day',72.3],['n day',74.8]];
function draw(t){
  let s='';
  // the tilt: gentle until 272.8, then wild
  const amp = t>=272.8 ? lerp(7,16,pr(t,272.8,3)) : (t>=180.8 ? 9 : 6);
  const tilt = Math.sin(t*0.9)*amp;
  s += plank(580,320,440,tilt,{});
  s += txt(140,420,'bears',{a:'middle',c:DN,sz:15,o:op(t,0,.5)}); s += txt(1020,420,'bulls',{a:'middle',c:OK,sz:15,o:op(t,8.2,.5)});
  // bears left, bulls right, as figures on the plank ends
  for(let i=0;i<3;i++){ const [x,y]=onPlank(580,320,440,tilt,-0.98+i*0.09,0); s += person(x,y-26,{c:DN,o:op(t,0+i*0.4,.4)}); const [x2,y2]=onPlank(580,320,440,tilt,0.98-i*0.09,0); s += person(x2,y2-26,{c:OK,o:op(t,8.2+i*0.4,.4)}); }
  if (t>=13.8 && t<20.2) s += txt(580,460,'overweighted side wins',{a:'middle',c:MUT,sz:14,o:op(t,13.8,.5)});
  // me: no emotional investment, off to the side
  if (t>=20.2){ const o=op(t,20.2,.6); s += person(1090,120,{c:ACC,o}); s += txt(1090,165,'me',{a:'middle',c:ACC,sz:12,o}); }
  if (t>=29.5 && t<58.8){ const o=op(t,29.5,.5); s += rect(80,90,180,90,{s:DN,o:o*0.7,r:6}); s += txt(170,115,'our reasons',{a:'middle',sz:12,c:DN,o}); for(let i=0;i<3;i++) s += line(100,130+i*16,240-i*30,130+i*16,{s:DN,sw:1.5,o:o*0.6});
    s += rect(900,90,180,90,{s:OK,o:o*0.7,r:6}); s += txt(990,115,'our reasons',{a:'middle',sz:12,c:OK,o}); for(let i=0;i<3;i++) s += line(920,130+i*16,1060-i*30,130+i*16,{s:OK,sw:1.5,o:o*0.6}); }
  if (t>=45.5 && t<58.8){ const o=op(t,45.5,.5); const dir=Math.sin(t*0.9)>0?1:-1; s += arrow(580,470,580+140*dir,470,{s:ACC,sw:3,o}); s += txt(580,500,'which side has the fat guys? which way is the momentum?',{a:'middle',c:ACC,sz:13,o}); }
  // the buckets: five cohorts along the plank, each with +/- figures
  if (t>=58.8){ BK.forEach((b,i)=>{ const o=op(t,b[1],.5); if(o<=0) return; const u=-0.6+i*0.3; const [x,y]=onPlank(580,320,440,tilt,u,0);
      // agitation: wobble per cohort from 121; heat colour from 164.4
      const ag = t>=121.1 ? [0.3,0.5,0.6,1.0,1.0][i]*pr(t,121.1,2) : 0; const hot = t>=164.4 && (i==3||i==4) ? pr(t,168.5,1) : 0; const hot2 = t>=243.2 ? pr(t,243.2,2) : 0;
      const wob = Math.sin(t*7+i)*6*Math.max(ag, hot2);
      const col = hot>0 || (hot2>0 && i>=2) ? `rgba(248,113,113,${0.25+0.5*Math.max(hot,hot2)})` : (ag>0.6 ? 'rgba(242,208,107,.25)' : 'rgba(255,255,255,.04)');
      s += rect(x-40,y-70+wob,80,52,{f:col,s:BRD,o,r:6}); s += txt(x,y-37+wob,b[0],{a:'middle',sz:13,c:FG,o});
      if (t>=86.2){ const o2=op(t,86.2+i*0.3,.4); s += txt(x-24,y-78+wob,'+',{a:'middle',sz:16,c:OK,o:o2}); s += txt(x+24,y-78+wob,'−',{a:'middle',sz:16,c:DN,o:o2}); }
      // from 188.6 the figures jump to the sides
      if (t>=188.6 && t<272.8){ const u2=pr(t,188.6+i*0.2,1.2); s += circ(lerp(x-22,180,u2),lerp(y-80,300,u2),4,{f:OK}); s += circ(lerp(x+22,980,u2),lerp(y-80,300,u2),4,{f:DN}); } });
    s += txt(580,470,'the demographics: timeframe cohorts',{a:'middle',c:MUT,sz:13,o:op(t,58.8,.5)}); }
  if (t>=99.1 && t<121.1){ const o=op(t,99.1,.5); s += txt(580,500,'n-day in a critical state by location: top or bottom of the 150-day look-back',{a:'middle',c:ACC,sz:13,o}); }
  if (t>=121.1 && t<164.4){ const o=op(t,121.1,.5); s += txt(580,500,'level of agitation: normal band · oversold and fearful · wildly optimistic',{a:'middle',c:ACC,sz:13,o}); }
  if (t>=164.4 && t<197.2){ const o=op(t,164.4,.5); s += txt(580,500,'a heat map: location plus volatility',{a:'middle',c:DN,sz:14,o}); }
  if (t>=197.2 && t<258.8){ const o=op(t,197.2,.5); s += txt(580,500,t<236.7?'exaggerated emotionality: trading larger than normal':'the intraday traders are not looking at the longer-term traders',{a:'middle',c:ACC,sz:13,o}); }
  if (t>=258.8){ const o=op(t,258.8,.5); s += txt(580,500,t<295.8?'range-stat moves: everybody surprised':'the room is crowded',{a:'middle',c:ACC,sz:15,o}); }
  // the crowd from 295.8; the breakout chart from 310
  if (t>=295.8){ const C=herd(60,3,100,60,960,120); C.forEach(p=>{ const [x,y]=wander(p,t,5); s += circ(x,y,3.5,{f:MUT,o:0.5*op(t,295.8,1)}); }); }
  if (t>=310){ const o=op(t,310,.6); s += rect(60,60,220,120,{s:ACC,f:CARD,o}); if(o>0){ s += candles(70,70,120,100,10,19,0.0); const u=pr(t,312,3); s += line(190,120,190+70*u,120-70*u,{s:OK,sw:3,o}); s += line(70,100,190,100,{s:MUT,sw:1,o,dash:'4 4'}); s += txt(170,195,'breaks the channel',{a:'middle',c:OK,sz:12,o}); } }
  return s;
}

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  let cap = '', sub = '';
  for (const b of BEATS) if (t >= b[0]) { cap = b[1]; sub = b[2] || ''; }
  $('cap').innerHTML = cap; $('sub').textContent = sub;
  $('svg').innerHTML = draw(t);
  const f = $('fade');
  f.style.opacity = t < 0.5 ? 1 - t / 0.5 : (ANIM_DURATION - t < 0.6 ? 1 - (ANIM_DURATION - t) / 0.6 : 0);
};
renderFrame(0);
</script>
</body>
</html>
