// deterministic pseudo-random
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
// a herd of dots in a region; drift is a slow deterministic wander
function herd(n,seed,x,y,w,h){const r=rng(seed);const pts=[];for(let i=0;i<n;i++)pts.push({x:x+r()*w,y:y+r()*h,p:r()*6.28,q:r()*6.28});return pts;}

// a list that reveals one row per step seconds from t0
function list(t,t0,step,items,x,y,o={}){let out='';items.forEach((s,i)=>{const o1=op(t,t0+i*step,0.4);if(o1>0)out+=txt(x,y+i*(o.lh||34),s,{sz:o.sz||22,c:o.c||FG,o:o1,w:o.w||400});});return out;}

function bars(F,B,k,o={}){let s='';const n=B.length,bw=F.w/n*(o.bw||.6);for(let i=0;i<Math.min(k,n);i++){const [a,h,l,b]=B[i];const up=b>=a;const c=o.c&&o.c[i]?o.c[i]:(up?OK:DN);

const PX=x=>IX+x*S, PYX=y=>IY+y*S;
const base=(o,k)=>`<image href="${IMGS[k||0]}" x="${IX}" y="${IY}" width="${IW}" height="${IH}" preserveAspectRatio="none" opacity="${o==null?1:o}"/>`;

// the idea is hypothetical (his words: if the VWAP were pure sideways), so it is drawn over his chart, dimmed
const F=fr(60,60,740,400,-2.2,2.2), RX=860;
const Z=walk([[0,0],[.1,.6],[.2,-.4],[.3,.3],[.42,-.6],[.55,-1.55],[.62,-1.2],[.7,-.5],[.8,0],[.9,.2],[1,.1]],89,.06);
function draw(t){
  let s=base(after(t,0)?lerp(.92,.28,pr(t,T(0),1)):.92)+mask(PX(824),PYX(0),PX(880),PYX(132))+kick('VWAP z-score',1,RX);
  if (after(t,0)){ const o=op(t,T(0),.5); s += lvl(F,0,'VWAP = 0',{s:'#f0a040',dash:'',sw:3,o,sz:15}); }
  if (after(t,1)){ const o=op(t,T(1),.5); s += readout(RX,80,'look back',cnt(t,T(1),1.2,300)+' bars',{o,sz:28}); }
  if (after(t,2)){ const o=op(t,T(2),.5); for(const z of [1,-1]) s += lvl(F,z,'',{s:ACC,o,dash:'8 6'}); s += zone(F,0,1,1,-1,{f:'rgba(95,211,204,.06)',s:'none',o}); }
  const k = after(t,7)? .62 : after(t,5)? .5 : after(t,3)? .45 : .3;
  if (after(t,3)){ const o=op(t,T(3),.5); s += plot(F,Z,0,after(t,9)?1:k,{s:FG,sw:2.5,o}); }
  if (after(t,4)){ const o=op(t,T(4),.5); s += txt(RX,170,'1-2-3 reversal,',{sz:17,o}) + txt(RX,194,'back to the VWAP',{sz:17,c:'#f0a040',o,w:600}); }
  if (after(t,6)){ const o=op(t,T(6),.5); s += tag(F.X(1)+6,F.Y(1),'Z1',ACC,o) + tag(F.X(1)+6,F.Y(-1),'−1',ACC,o); }
  if (after(t,7)){ const o=op(t,T(7),.5); s += lvl(F,-1.5,'',{s:DN,o,dash:'4 4'}) + tag(F.X(1)+6,F.Y(-1.5),'−1.5',DN,o) + glow(circ(F.X(.55),F.Y(-1.55),16,{f:'none',s:DN,sw:2.5,o})); }
  if (after(t,8)){ const o=op(t,T(8),.5); for(let i=0;i<14;i++){ const u=.3+i*.025, h=(i>8&&i<11?70:20+((i*13)%25))*pr(t,T(8),.8); s += rect(F.X(u)-4,F.Y(-2.2)-h,8,h,{f:i>8&&i<11?'rgba(239,90,111,.6)':'rgba(139,152,165,.4)',s:'none',r:1,o}); } s += txt(RX,240,'volume on the breakout?',{sz:16,c:MUT,o}); }
  if (after(t,9)){ const o=op(t,T(9),.5); s += zone(F,.6,.66,-1.2,-1.75,{o}) + glow(arrow(F.X(.64),F.Y(-1.1),F.X(.8),F.Y(-.05),{s:OK,sw:3,o})) + readout(RX,290,'just back to the VWAP','3 : 1',{o,sz:32},OK) + txt(RX,400,'the VWAP magnet',{sz:22,c:'#f0a040',o,w:600}); }
  return s;
}

window.renderFrame = function (t) {
  t = clamp(t, 0, ANIM_DURATION);
  let cap = '', sub = '';
  for (const b of BEATS) if (t >= b[0]) { cap = b[1]; sub = b[2] || ''; }
  $('cap').innerHTML = cap; $('sub').textContent = sub;
  $('svg').innerHTML = WRAP[0] + draw(t) + WRAP[1];
  const f = $('fade');
  f.style.opacity = t < 0.5 ? 1 - t / 0.5 : (ANIM_DURATION - t < 0.6 ? 1 - (ANIM_DURATION - t) / 0.6 : 0);
};
renderFrame(0);
